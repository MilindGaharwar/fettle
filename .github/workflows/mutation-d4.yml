          name: d4-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: retained/aggregate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d4-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: retained/admission
      - name: Build D4 evidence index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > d4-run.json
          dispatch_timestamp=$(uv run --no-sync python -c 'import json; print(json.load(open("d4-run.json"))["created_at"])')
          complete_timestamp=$(uv run --no-sync python -c 'from datetime import UTC,datetime; print(datetime.now(UTC).isoformat().replace("+00:00","Z"))')
          uv run --no-sync python -m fettle.mutation_test --root . \
            --d4-evidence-index d4-evidence-index.json --d4-retained-files retained \
            --d4-run-id "$GITHUB_RUN_ID" --d4-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --d4-dispatch-timestamp "$dispatch_timestamp" --d4-complete-timestamp "$complete_timestamp" \
            --d4-corpus-identity retained/admission/current-corpus-identity.json --json
      - name: Upload retained D4 evidence (attempt 1)
        id: retained_evidence_attempt_1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-retained-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            retained
            d4-evidence-index.json
          if-no-files-found: error
          retention-days: 90
      - name: Recover retained D4 evidence before attempt 2
        id: retained_evidence_recover_2
        if: always() && steps.retained_evidence_attempt_1.outcome == 'failure'
        env: {GH_TOKEN: "${{ github.token }}", ARTIFACT_NAME: "d4-retained-evidence-${{ github.run_id }}-${{ github.run_attempt }}"}
        run: |
          sleep 30
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          if jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null; then echo "artifact_ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          jq -r '.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes == 0) | .id' <<<"$artifacts" | while read -r artifact_id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; done
      - name: Upload retained D4 evidence (attempt 2)
        id: retained_evidence_attempt_2
        if: always() && steps.retained_evidence_attempt_1.outcome == 'failure' && steps.retained_evidence_recover_2.outcome == 'success' && steps.retained_evidence_recover_2.outputs.artifact_ready != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-retained-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            retained
            d4-evidence-index.json
          if-no-files-found: error
          retention-days: 90
      - name: Recover retained D4 evidence before attempt 3
        id: retained_evidence_recover_3
        if: always() && steps.retained_evidence_attempt_2.outcome == 'failure'
        env: {GH_TOKEN: "${{ github.token }}", ARTIFACT_NAME: "d4-retained-evidence-${{ github.run_id }}-${{ github.run_attempt }}"}
        run: |
          sleep 30
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          if jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null; then echo "artifact_ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          jq -r '.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes == 0) | .id' <<<"$artifacts" | while read -r artifact_id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; done
      - name: Upload retained D4 evidence (attempt 3)
        id: retained_evidence_attempt_3
        if: always() && steps.retained_evidence_attempt_2.outcome == 'failure' && steps.retained_evidence_recover_3.outcome == 'success' && steps.retained_evidence_recover_3.outputs.artifact_ready != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-retained-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            retained
            d4-evidence-index.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify retained D4 evidence upload
        id: retained_evidence_verify
        if: always()
        env: {GH_TOKEN: "${{ github.token }}", ARTIFACT_NAME: "d4-retained-evidence-${{ github.run_id }}-${{ github.run_attempt }}", ATTEMPT_1: "${{ steps.retained_evidence_attempt_1.outcome }}", ATTEMPT_2: "${{ steps.retained_evidence_attempt_2.outcome }}", ATTEMPT_3: "${{ steps.retained_evidence_attempt_3.outcome }}"}
        run: |
          if [[ "$ATTEMPT_1" == success || "$ATTEMPT_2" == success || "$ATTEMPT_3" == success ]]; then exit 0; fi
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null || exit 1
      - name: Add provider artifact IDs and re-digest index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > provider-artifacts.json
          uv run --no-sync python -m fettle.mutation_test --root . \
            --d4-evidence-index d4-evidence-index.json \
            --d4-retained-files provider-artifacts.json --json
      - name: Upload D4 evidence index (attempt 1)
        id: evidence_index_attempt_1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-evidence-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: d4-evidence-index.json
          if-no-files-found: error
          retention-days: 90
      - name: Recover D4 evidence index before attempt 2
        id: evidence_index_recover_2
        if: always() && steps.evidence_index_attempt_1.outcome == 'failure'
        env: {GH_TOKEN: "${{ github.token }}", ARTIFACT_NAME: "d4-evidence-index-${{ github.run_id }}-${{ github.run_attempt }}"}
        run: |
          sleep 30
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          if jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null; then echo "artifact_ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          jq -r '.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes == 0) | .id' <<<"$artifacts" | while read -r artifact_id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; done
      - name: Upload D4 evidence index (attempt 2)
        id: evidence_index_attempt_2
        if: always() && steps.evidence_index_attempt_1.outcome == 'failure' && steps.evidence_index_recover_2.outcome == 'success' && steps.evidence_index_recover_2.outputs.artifact_ready != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: "d4-evidence-index-${{ github.run_id }}-${{ github.run_attempt }}", path: d4-evidence-index.json, if-no-files-found: error, retention-days: 90}
      - name: Recover D4 evidence index before attempt 3
        id: evidence_index_recover_3
        if: always() && steps.evidence_index_attempt_2.outcome == 'failure'
        env: {GH_TOKEN: "${{ github.token }}", ARTIFACT_NAME: "d4-evidence-index-${{ github.run_id }}-${{ github.run_attempt }}"}
        run: |
          sleep 30
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          if jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null; then echo "artifact_ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          jq -r '.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes == 0) | .id' <<<"$artifacts" | while read -r artifact_id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; done
      - name: Upload D4 evidence index (attempt 3)
        id: evidence_index_attempt_3
        if: always() && steps.evidence_index_attempt_2.outcome == 'failure' && steps.evidence_index_recover_3.outcome == 'success' && steps.evidence_index_recover_3.outputs.artifact_ready != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: "d4-evidence-index-${{ github.run_id }}-${{ github.run_attempt }}", path: d4-evidence-index.json, if-no-files-found: error, retention-days: 90}
      - name: Verify D4 evidence index upload
        id: evidence_index_verify
        if: always()
        env: {GH_TOKEN: "${{ github.token }}", ARTIFACT_NAME: "d4-evidence-index-${{ github.run_id }}-${{ github.run_attempt }}", ATTEMPT_1: "${{ steps.evidence_index_attempt_1.outcome }}", ATTEMPT_2: "${{ steps.evidence_index_attempt_2.outcome }}", ATTEMPT_3: "${{ steps.evidence_index_attempt_3.outcome }}"}
        run: |
          if [[ "$ATTEMPT_1" == success || "$ATTEMPT_2" == success || "$ATTEMPT_3" == success ]]; then exit 0; fi
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null || exit 1
      - name: Mirror D4 evidence index and digests off provider
        run: |
          find retained -type f -print0 | sort -z | xargs -0 shasum -a 256 > retained-files.sha256
          mkdir mirror
          cp d4-evidence-index.json retained-files.sha256 mirror/
          if git ls-remote --exit-code --heads origin evidence/d4; then
            git fetch origin evidence/d4
            git switch -C evidence/d4 FETCH_HEAD
          else
            git switch --orphan evidence/d4
            git rm -rf .
          fi
          destination="runs/$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$destination"
          cp mirror/* "$destination/"
          git add "$destination"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "evidence(d4): retain run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          git push origin HEAD:evidence/d4
      - name: Enforce D4 aggregate result
        if: always()
        run: uv run --no-sync python -c 'import json,sys; report=json.load(open("retained/aggregate/d4-mutation-report.json")); sys.exit(0 if report.get("status")=="completed" and report.get("passed") is True else 2)'
