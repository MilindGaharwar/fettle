          jq -r '.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes == 0) | .id' <<<"$artifacts" | while read -r artifact_id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; done
