      - run: uv venv --python 3.12.13 && uv pip install --quiet --require-hashes -r requirements-mutation.txt && uv pip install --quiet --no-deps -e .
      - name: Validate exact clean execute candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          D4_ID: ${{ inputs.d4_id }}
          D4_PREFLIGHT_RUN_ID: ${{ inputs.d4_preflight_run_id }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          if os.environ["CANDIDATE_SHA"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("candidate differs from workflow revision")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,63}", os.environ["D4_ID"]):
              raise SystemExit("invalid D4 ID")
          if not re.fullmatch(r"[1-9][0-9]*", os.environ["D4_PREFLIGHT_RUN_ID"]):
              raise SystemExit("invalid D4 preflight run ID")
          if subprocess.check_output(["git", "status", "--porcelain"], text=True):
              raise SystemExit("candidate checkout is dirty")
          PY
      - name: Download exact sealed D4 corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d4-corpus-${{ inputs.d4_id }}-${{ inputs.d4_preflight_run_id }}
          path: d4-corpus
          run-id: ${{ inputs.d4_preflight_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate D4 admission
        id: admit
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          D4_ID: ${{ inputs.d4_id }}
          D4_PREFLIGHT_RUN_ID: ${{ inputs.d4_preflight_run_id }}
          D4_RUNNER_MINUTE_CEILING: ${{ inputs.d4_runner_minute_ceiling }}
        run: |
          uv run --no-sync python -m fettle.mutation_test --root . --d4-admission-ledger .github/mutation-observed-ledger.json --d4-runner-minute-ceiling "$D4_RUNNER_MINUTE_CEILING" --json > d4-admission.json
