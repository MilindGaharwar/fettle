name: Mutation D4 evidence

on:
  workflow_dispatch:
    inputs:
      d4_phase:
        description: "Prepare a sealed corpus or execute it"
        required: true
        type: choice
        options:
          - preflight
          - execute
          - gate
      candidate_sha:
        description: "Exact clean 40-character candidate commit"
        required: true
        type: string
      d4_id:
        description: "Unique D4 full-scope identity"
        required: true
        type: string
      d4_preflight_run_id:
        description: "Preflight run ID; required for execute and empty for preflight"
        required: false
        type: string
      d4_runner_minute_ceiling:
        description: "Execute ceiling; at least projected P95 plus 1200 minutes"
        required: false
        type: string

concurrency:
  group: mutation-authoritative-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  d4-preflight-prepare:
    if: inputs.d4_phase == 'preflight'
    name: mutation (D4 prepare corpus)
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - run: uv venv --python 3.12.13 && uv pip install --quiet --require-hashes -r requirements-mutation.txt && uv pip install --quiet --no-deps -e .
      - name: Validate preflight identity and prepare manifests
        id: prepare
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          D4_ID: ${{ inputs.d4_id }}
          D4_PREFLIGHT_RUN_ID: ${{ inputs.d4_preflight_run_id }}
          D4_RUNNER_MINUTE_CEILING: ${{ inputs.d4_runner_minute_ceiling }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          if os.environ["D4_PREFLIGHT_RUN_ID"] or os.environ["D4_RUNNER_MINUTE_CEILING"]:
              raise SystemExit("D4 preflight rejects execute-only inputs")
          if os.environ["CANDIDATE_SHA"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("candidate differs from workflow revision")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,63}", os.environ["D4_ID"]):
              raise SystemExit("invalid D4 ID")
          if subprocess.check_output(["git", "status", "--porcelain"], text=True):
              raise SystemExit("candidate checkout is dirty")
          PY
          uv run --no-sync python -m fettle.mutation_test --root . --prepare-manifests d4-manifests --json > manifest-summary.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          report = json.load(open("manifest-summary.json"))
          if report.get("shard_count") != 256:
              raise SystemExit("D4 requires exactly 256 manifests")
          print("matrix=" + json.dumps(report["matrix"], separators=(",", ":")))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-preflight-manifests-${{ github.run_id }}
          path: d4-manifests
          if-no-files-found: error
          retention-days: 90

  d4-preflight-shards:
    if: inputs.d4_phase == 'preflight'
    needs: d4-preflight-prepare
    name: mutation (D4 preflight shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    container:
      image: python:3.12.13-bookworm@sha256:3cd9086bdb30f7c9bc08a3fa621d9842e0d3f6f9291aeb4677e0547817c10b12
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.d4-preflight-prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - run: uv venv --python 3.12.13 && uv pip install --quiet --require-hashes -r requirements-mutation.txt && uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d4-preflight-manifests-${{ github.run_id }}
          path: d4-manifests
      - run: uv run --no-sync python -m fettle.mutation_test --root . --preflight-manifest d4-manifests/partition-${{ matrix.shard }}.json --json > mutation-preflight.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: d4-preflight-report-${{ github.run_id }}-${{ matrix.shard }}
          path: mutation-preflight.json
          if-no-files-found: error
          retention-days: 90

  d4-preflight-seal:
    if: always() && inputs.d4_phase == 'preflight'
    needs: [d4-preflight-prepare, d4-preflight-shards]
    name: mutation (D4 seal corpus)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - run: uv venv --python 3.12.13 && uv pip install --quiet --require-hashes -r requirements-mutation.txt && uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d4-preflight-manifests-${{ github.run_id }}
          path: d4-corpus/manifests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: d4-preflight-report-${{ github.run_id }}-*
          path: d4-preflight-reports
      - name: Aggregate and seal corpus
        run: |
          uv run --no-sync python -m fettle.mutation_test --root . --aggregate-preflight d4-preflight-reports --shard-count 256 --json > d4-corpus/mutation-preflight.json
          uv run --no-sync python -m fettle.mutation_test --root . --write-d4-corpus-identity d4-corpus/corpus-identity.json --aggregate-scope d4-corpus/manifests --aggregate-preflight-evidence d4-corpus/mutation-preflight.json --json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-corpus-${{ inputs.d4_id }}-${{ github.run_id }}
          path: d4-corpus
          if-no-files-found: error
          retention-days: 90

  d4-admit:
    if: inputs.d4_phase == 'execute'
    name: mutation (D4 admission)
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.admit.outputs.matrix }}
      corpus_artifact: ${{ steps.admit.outputs.corpus_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - run: uv venv --python 3.12.13 && uv pip install --quiet --require-hashes -r requirements-mutation.txt && uv pip install --quiet --no-deps -e .
      - name: Validate exact clean execute candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          D4_ID: ${{ inputs.d4_id }}
          D4_PREFLIGHT_RUN_ID: ${{ inputs.d4_preflight_run_id }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          if os.environ["CANDIDATE_SHA"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("candidate differs from workflow revision")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,63}", os.environ["D4_ID"]):
              raise SystemExit("invalid D4 ID")
          if not re.fullmatch(r"[1-9][0-9]*", os.environ["D4_PREFLIGHT_RUN_ID"]):
              raise SystemExit("invalid D4 preflight run ID")
          if subprocess.check_output(["git", "status", "--porcelain"], text=True):
              raise SystemExit("candidate checkout is dirty")
          PY
      - name: Download exact sealed D4 corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d4-corpus-${{ inputs.d4_id }}-${{ inputs.d4_preflight_run_id }}
          path: d4-corpus
          run-id: ${{ inputs.d4_preflight_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate D4 admission
        id: admit
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          D4_ID: ${{ inputs.d4_id }}
          D4_PREFLIGHT_RUN_ID: ${{ inputs.d4_preflight_run_id }}
          D4_RUNNER_MINUTE_CEILING: ${{ inputs.d4_runner_minute_ceiling }}
        run: |
          uv run --no-sync python -m fettle.mutation_test --root . --d4-admission-ledger .github/mutation-observed-ledger.json --d4-runner-minute-ceiling "$D4_RUNNER_MINUTE_CEILING" --json > d4-admission.json
          uv run --no-sync python -m fettle.mutation_test --root . --write-d4-corpus-identity current-corpus-identity.json --aggregate-scope d4-corpus/manifests --aggregate-preflight-evidence d4-corpus/mutation-preflight.json --json
          cmp d4-corpus/corpus-identity.json current-corpus-identity.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          if len(list(Path("d4-corpus/manifests").glob("partition-*.json"))) != 256:
              raise SystemExit("D4 admission requires exactly 256 manifests")
          print("matrix=" + json.dumps({"shard": list(range(256))}, separators=(",", ":")))
          print("corpus_artifact=d4-current-corpus-" + os.environ["GITHUB_RUN_ID"])
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-current-corpus-${{ github.run_id }}
          path: d4-corpus
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: d4-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            d4-admission.json
            current-corpus-identity.json
          if-no-files-found: error
          retention-days: 90

  d4-gate:
    if: inputs.d4_phase == 'execute' || inputs.d4_phase == 'gate'
    uses: ./.github/workflows/mutation-d4-shard.yml
    with:
      shard: 0
      d4_id: ${{ inputs.d4_id }}
      manifest_artifact: synthetic-gate-does-not-download
      gate: true
      report_artifact: d4-gate-report-${{ github.run_id }}-${{ github.run_attempt }}
      execute: true

  d4-shards:
    if: inputs.d4_phase == 'execute'
    needs: [d4-admit, d4-gate]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.d4-admit.outputs.matrix) }}
    uses: ./.github/workflows/mutation-d4-shard.yml
    with:
      shard: ${{ matrix.shard }}
      d4_id: ${{ inputs.d4_id }}
      manifest_artifact: ${{ needs.d4-admit.outputs.corpus_artifact }}
      report_artifact: d4-shard-report-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      execute: true

  d4-aggregate:
    if: always() && inputs.d4_phase == 'execute'
    needs: [d4-admit, d4-gate, d4-shards]
    name: mutation (D4 aggregate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - run: uv venv --python 3.12.13 && uv pip install --quiet --require-hashes -r requirements-mutation.txt && uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: d4-shard-report-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: d4-shard-reports
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d4-current-corpus-${{ github.run_id }}
          path: d4-corpus
      - name: Aggregate current-attempt D4 evidence
        continue-on-error: true
        run: uv run --no-sync python -m fettle.mutation_test --root . --aggregate-d4 d4-shard-reports --aggregate-scope d4-corpus/manifests --aggregate-preflight-evidence d4-corpus/mutation-preflight.json --d4-corpus-identity d4-corpus/corpus-identity.json --d4-id '${{ inputs.d4_id }}' --d4-run-id '${{ github.run_id }}' --d4-run-attempt '${{ github.run_attempt }}' --json > d4-mutation-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: d4-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: d4-mutation-report.json
          if-no-files-found: error
          retention-days: 90

  d4-retain:
    if: always() && inputs.d4_phase == 'execute'
    needs: [d4-admit, d4-gate, d4-shards, d4-aggregate]
    name: mutation (D4 retain and mirror)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - run: uv venv --python 3.12.13 && uv pip install --quiet --require-hashes -r requirements-mutation.txt && uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: d4-shard-report-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: retained/shards
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d4-gate-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: retained/gate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d4-current-corpus-${{ github.run_id }}
          path: retained/corpus
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d4-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: retained/aggregate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d4-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: retained/admission
      - name: Build D4 evidence index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > d4-run.json
          dispatch_timestamp=$(uv run --no-sync python -c 'import json; print(json.load(open("d4-run.json"))["created_at"])')
          complete_timestamp=$(uv run --no-sync python -c 'from datetime import UTC,datetime; print(datetime.now(UTC).isoformat().replace("+00:00","Z"))')
          uv run --no-sync python -m fettle.mutation_test --root . \
            --d4-evidence-index d4-evidence-index.json --d4-retained-files retained \
            --d4-run-id "$GITHUB_RUN_ID" --d4-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --d4-dispatch-timestamp "$dispatch_timestamp" --d4-complete-timestamp "$complete_timestamp" \
            --d4-corpus-identity retained/admission/current-corpus-identity.json --json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-retained-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            retained
            d4-evidence-index.json
          if-no-files-found: error
          retention-days: 90
      - name: Add provider artifact IDs and re-digest index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > provider-artifacts.json
          uv run --no-sync python -m fettle.mutation_test --root . \
            --d4-evidence-index d4-evidence-index.json \
            --d4-retained-files provider-artifacts.json --json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-evidence-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: d4-evidence-index.json
          if-no-files-found: error
          retention-days: 90
      - name: Mirror D4 evidence index and digests off provider
        run: |
          find retained -type f -print0 | sort -z | xargs -0 shasum -a 256 > retained-files.sha256
          mkdir mirror
          cp d4-evidence-index.json retained-files.sha256 mirror/
          if git ls-remote --exit-code --heads origin evidence/d4; then
            git fetch origin evidence/d4
            git switch -C evidence/d4 FETCH_HEAD
          else
            git switch --orphan evidence/d4
            git rm -rf .
          fi
          destination="runs/$GITHUB_RUN_ID/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$destination"
          cp mirror/* "$destination/"
          git add "$destination"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "evidence(d4): retain run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          git push origin HEAD:evidence/d4
      - name: Enforce D4 aggregate result
        if: always()
        run: uv run --no-sync python -c 'import json,sys; report=json.load(open("retained/aggregate/d4-mutation-report.json")); sys.exit(0 if report.get("status")=="completed" and report.get("passed") is True else 2)'
