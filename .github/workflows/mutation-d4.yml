name: Mutation D4 evidence

on:
  workflow_dispatch:
    inputs:
      d4_phase:
        description: "Prepare a sealed corpus or execute it"
        required: true
        type: choice
        options:
          - preflight
          - execute
          - gate
      candidate_sha:
        description: "Exact clean 40-character candidate commit"
        required: true
        type: string
      d4_id:
        description: "Unique D4 full-scope identity"
        required: true
        type: string
      d4_preflight_run_id:
        description: "Preflight run ID; required for execute and empty for preflight"
        required: false
        type: string
      d4_runner_minute_ceiling:
        description: "Execute ceiling; at least projected P95 plus 1200 minutes"
        required: false
        type: string

concurrency:
  group: mutation-authoritative-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  d4-preflight-prepare:
    if: inputs.d4_phase == 'preflight'
    name: mutation (D4 prepare corpus)
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - run: uv venv --python 3.12.13 && uv pip install --quiet --require-hashes -r requirements-mutation.txt && uv pip install --quiet --no-deps -e .
      - name: Validate preflight identity and prepare manifests
        id: prepare
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          D4_ID: ${{ inputs.d4_id }}
          D4_PREFLIGHT_RUN_ID: ${{ inputs.d4_preflight_run_id }}
          D4_RUNNER_MINUTE_CEILING: ${{ inputs.d4_runner_minute_ceiling }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          if os.environ["D4_PREFLIGHT_RUN_ID"] or os.environ["D4_RUNNER_MINUTE_CEILING"]:
              raise SystemExit("D4 preflight rejects execute-only inputs")
          if os.environ["CANDIDATE_SHA"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("candidate differs from workflow revision")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,63}", os.environ["D4_ID"]):
              raise SystemExit("invalid D4 ID")
          if subprocess.check_output(["git", "status", "--porcelain"], text=True):
              raise SystemExit("candidate checkout is dirty")
          PY
          uv run --no-sync python -m fettle.mutation_test --root . --prepare-manifests d4-manifests --json > manifest-summary.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          report = json.load(open("manifest-summary.json"))
          if report.get("shard_count") != 256:
              raise SystemExit("D4 requires exactly 256 manifests")
          print("matrix=" + json.dumps(report["matrix"], separators=(",", ":")))
          PY
      - name: Upload D4 preflight manifests (attempt 1)
        id: preflight_manifests_attempt_1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-preflight-manifests-${{ github.run_id }}
          path: d4-manifests
          if-no-files-found: error
          retention-days: 90
      - name: Recover D4 preflight manifests before attempt 2
        id: preflight_manifests_recover_2
        if: always() && steps.preflight_manifests_attempt_1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: d4-preflight-manifests-${{ github.run_id }}
        run: |
          sleep 30
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          if jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null; then
            echo "artifact_ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r '.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes == 0) | .id' <<<"$artifacts" |
            while read -r artifact_id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; done
      - name: Upload D4 preflight manifests (attempt 2)
        id: preflight_manifests_attempt_2
        if: always() && steps.preflight_manifests_attempt_1.outcome == 'failure' && steps.preflight_manifests_recover_2.outcome == 'success' && steps.preflight_manifests_recover_2.outputs.artifact_ready != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-preflight-manifests-${{ github.run_id }}
          path: d4-manifests
          if-no-files-found: error
          retention-days: 90
      - name: Recover D4 preflight manifests before attempt 3
        id: preflight_manifests_recover_3
        if: always() && steps.preflight_manifests_attempt_2.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: d4-preflight-manifests-${{ github.run_id }}
        run: |
          sleep 30
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          if jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null; then
            echo "artifact_ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r '.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes == 0) | .id' <<<"$artifacts" |
            while read -r artifact_id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; done
      - name: Upload D4 preflight manifests (attempt 3)
        id: preflight_manifests_attempt_3
        if: always() && steps.preflight_manifests_attempt_2.outcome == 'failure' && steps.preflight_manifests_recover_3.outcome == 'success' && steps.preflight_manifests_recover_3.outputs.artifact_ready != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-preflight-manifests-${{ github.run_id }}
          path: d4-manifests
          if-no-files-found: error
          retention-days: 90
      - name: Verify D4 preflight manifests upload
        id: preflight_manifests_verify
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: d4-preflight-manifests-${{ github.run_id }}
          ATTEMPT_1: ${{ steps.preflight_manifests_attempt_1.outcome }}
          ATTEMPT_2: ${{ steps.preflight_manifests_attempt_2.outcome }}
          ATTEMPT_3: ${{ steps.preflight_manifests_attempt_3.outcome }}
        run: |
          if [[ "$ATTEMPT_1" == success || "$ATTEMPT_2" == success || "$ATTEMPT_3" == success ]]; then exit 0; fi
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null || exit 1

  d4-preflight-shards:
    if: inputs.d4_phase == 'preflight'
    needs: d4-preflight-prepare
    name: mutation (D4 preflight shard ${{ matrix.shard }})
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-24.04
    container:
      image: python:3.12.13-bookworm@sha256:3cd9086bdb30f7c9bc08a3fa621d9842e0d3f6f9291aeb4677e0547817c10b12
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.d4-preflight-prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Git checkout
        run: |
          git --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/d4-gate"
          git rev-parse HEAD
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install artifact recovery tools
        run: apt-get update && apt-get install --yes gh jq
      - run: uv venv --python 3.12.13 && uv pip install --quiet --require-hashes -r requirements-mutation.txt && uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d4-preflight-manifests-${{ github.run_id }}
          path: d4-manifests
      - run: |
          set +e
          uv run --no-sync python -m fettle.mutation_test --root . --preflight-manifest d4-manifests/partition-${{ matrix.shard }}.json --json > mutation-preflight.json
          preflight_exit=$?
          set -e
          cat mutation-preflight.json
          if (( preflight_exit != 0 )); then exit "$preflight_exit"; fi
      - name: Upload D4 preflight report (attempt 1)
        id: preflight_report_attempt_1
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-preflight-report-${{ github.run_id }}-${{ matrix.shard }}
          path: mutation-preflight.json
          if-no-files-found: error
          retention-days: 90
      - name: Recover D4 preflight report before attempt 2
        id: preflight_report_recover_2
        if: always() && steps.preflight_report_attempt_1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: d4-preflight-report-${{ github.run_id }}-${{ matrix.shard }}
        run: |
          sleep 30
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          if jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null; then echo "artifact_ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          jq -r '.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes == 0) | .id' <<<"$artifacts" |
            while read -r artifact_id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; done
      - name: Upload D4 preflight report (attempt 2)
        id: preflight_report_attempt_2
        if: always() && steps.preflight_report_attempt_1.outcome == 'failure' && steps.preflight_report_recover_2.outcome == 'success' && steps.preflight_report_recover_2.outputs.artifact_ready != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-preflight-report-${{ github.run_id }}-${{ matrix.shard }}
          path: mutation-preflight.json
          if-no-files-found: error
          retention-days: 90
      - name: Recover D4 preflight report before attempt 3
        id: preflight_report_recover_3
        if: always() && steps.preflight_report_attempt_2.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: d4-preflight-report-${{ github.run_id }}-${{ matrix.shard }}
        run: |
          sleep 30
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          if jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null; then echo "artifact_ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          jq -r '.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes == 0) | .id' <<<"$artifacts" |
            while read -r artifact_id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; done
      - name: Upload D4 preflight report (attempt 3)
        id: preflight_report_attempt_3
        if: always() && steps.preflight_report_attempt_2.outcome == 'failure' && steps.preflight_report_recover_3.outcome == 'success' && steps.preflight_report_recover_3.outputs.artifact_ready != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-preflight-report-${{ github.run_id }}-${{ matrix.shard }}
          path: mutation-preflight.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify D4 preflight report upload
        id: preflight_report_verify
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: d4-preflight-report-${{ github.run_id }}-${{ matrix.shard }}
          ATTEMPT_1: ${{ steps.preflight_report_attempt_1.outcome }}
          ATTEMPT_2: ${{ steps.preflight_report_attempt_2.outcome }}
          ATTEMPT_3: ${{ steps.preflight_report_attempt_3.outcome }}
        run: |
          if [[ "$ATTEMPT_1" == success || "$ATTEMPT_2" == success || "$ATTEMPT_3" == success ]]; then exit 0; fi
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null || exit 1

  d4-preflight-seal:
    if: always() && inputs.d4_phase == 'preflight'
    needs: [d4-preflight-prepare, d4-preflight-shards]
    name: mutation (D4 seal corpus)
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - run: uv venv --python 3.12.13 && uv pip install --quiet --require-hashes -r requirements-mutation.txt && uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d4-preflight-manifests-${{ github.run_id }}
          path: d4-corpus/manifests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: d4-preflight-report-${{ github.run_id }}-*
          path: d4-preflight-reports
      - name: Aggregate and seal corpus
        run: |
          set +e
          uv run --no-sync python -m fettle.mutation_test --root . --aggregate-preflight d4-preflight-reports --shard-count 256 --json > d4-corpus/mutation-preflight.json
          aggregate_exit=$?
          set -e
          cat d4-corpus/mutation-preflight.json
          if (( aggregate_exit != 0 )); then exit "$aggregate_exit"; fi
          set +e
          uv run --no-sync python -m fettle.mutation_test --root . --write-d4-corpus-identity d4-corpus/corpus-identity.json --aggregate-scope d4-corpus/manifests --aggregate-preflight-evidence d4-corpus/mutation-preflight.json --json
          identity_exit=$?
          set -e
          if [ -f d4-corpus/corpus-identity.json ]; then cat d4-corpus/corpus-identity.json; fi
          if (( identity_exit != 0 )); then exit "$identity_exit"; fi
      - name: Upload partial D4 corpus (attempt 1)
        id: corpus_partial_attempt_1
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-corpus-partial-${{ inputs.d4_id }}-${{ github.run_id }}
          path: d4-corpus
          if-no-files-found: error
          retention-days: 90
      - name: Recover partial D4 corpus before attempt 2
        id: corpus_partial_recover_2
        if: always() && steps.corpus_partial_attempt_1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: d4-corpus-partial-${{ inputs.d4_id }}-${{ github.run_id }}
        run: |
          sleep 30
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          if jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null; then echo "artifact_ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          jq -r '.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes == 0) | .id' <<<"$artifacts" |
            while read -r artifact_id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; done
      - name: Upload partial D4 corpus (attempt 2)
        id: corpus_partial_attempt_2
        if: always() && steps.corpus_partial_attempt_1.outcome == 'failure' && steps.corpus_partial_recover_2.outcome == 'success' && steps.corpus_partial_recover_2.outputs.artifact_ready != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-corpus-partial-${{ inputs.d4_id }}-${{ github.run_id }}
          path: d4-corpus
          if-no-files-found: error
          retention-days: 90
      - name: Recover partial D4 corpus before attempt 3
        id: corpus_partial_recover_3
        if: always() && steps.corpus_partial_attempt_2.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: d4-corpus-partial-${{ inputs.d4_id }}-${{ github.run_id }}
        run: |
          sleep 30
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          if jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null; then echo "artifact_ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          jq -r '.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes == 0) | .id' <<<"$artifacts" |
            while read -r artifact_id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; done
      - name: Upload partial D4 corpus (attempt 3)
        id: corpus_partial_attempt_3
        if: always() && steps.corpus_partial_attempt_2.outcome == 'failure' && steps.corpus_partial_recover_3.outcome == 'success' && steps.corpus_partial_recover_3.outputs.artifact_ready != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-corpus-partial-${{ inputs.d4_id }}-${{ github.run_id }}
          path: d4-corpus
          if-no-files-found: error
          retention-days: 90
      - name: Verify partial D4 corpus upload
        id: corpus_partial_verify
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: d4-corpus-partial-${{ inputs.d4_id }}-${{ github.run_id }}
          ATTEMPT_1: ${{ steps.corpus_partial_attempt_1.outcome }}
          ATTEMPT_2: ${{ steps.corpus_partial_attempt_2.outcome }}
          ATTEMPT_3: ${{ steps.corpus_partial_attempt_3.outcome }}
        run: |
          if [[ "$ATTEMPT_1" == success || "$ATTEMPT_2" == success || "$ATTEMPT_3" == success ]]; then exit 0; fi
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null || exit 1
      - name: Upload sealed D4 corpus (attempt 1)
        id: corpus_attempt_1
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-corpus-${{ inputs.d4_id }}-${{ github.run_id }}
          path: d4-corpus
          if-no-files-found: error
          retention-days: 90
      - name: Recover sealed D4 corpus before attempt 2
        id: corpus_recover_2
        if: always() && steps.corpus_attempt_1.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: d4-corpus-${{ inputs.d4_id }}-${{ github.run_id }}
        run: |
          sleep 30
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
          if jq -e '[.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes > 0)] | length > 0' <<<"$artifacts" >/dev/null; then echo "artifact_ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          jq -r '.[].artifacts[] | select(.name == env.ARTIFACT_NAME and .size_in_bytes == 0) | .id' <<<"$artifacts" |
            while read -r artifact_id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"; done
      - name: Upload sealed D4 corpus (attempt 2)
        id: corpus_attempt_2
        if: always() && steps.corpus_attempt_1.outcome == 'failure' && steps.corpus_recover_2.outcome == 'success' && steps.corpus_recover_2.outputs.artifact_ready != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d4-corpus-${{ inputs.d4_id }}-${{ github.run_id }}
          path: d4-corpus
          if-no-files-found: error
          retention-days: 90
      - name: Recover sealed D4 corpus before attempt 3
        id: corpus_recover_3
        if: always() && steps.corpus_attempt_2.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: d4-corpus-${{ inputs.d4_id }}-${{ github.run_id }}
        run: |
          sleep 30
          artifacts="$(gh api --method GET --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME" -f per_page=100)"
