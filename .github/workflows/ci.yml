name: CI

on:
  push:
    branches: [main]
  pull_request:

# WP-B4: third-party actions pinned by commit SHA (tag in trailing comment);
# all pip tools pinned exactly. Bump deliberately, not by tag drift.

jobs:
  # WP-B1: ruff is a blocking gate — the same check the pre-commit hook runs.
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install ruff (pinned)
        run: python -m pip install --quiet ruff==0.15.20

      - name: Ruff check
        run: ruff check fettle tests

      - name: Require provenance for every rule asset
        run: python scripts/check_rule_provenance.py

  # WP-B5: honesty for the `Typing :: Typed` classifier — mypy runs on every
  # push but does not block yet. Promote to blocking once the baseline is 0.
  typecheck:
    name: typecheck (mypy, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install mypy (pinned)
        run: python -m pip install --quiet mypy==2.3.0 pyyaml==6.0.3

      - name: Mypy (informative)
        run: mypy fettle --ignore-missing-imports || true

  test:
    strategy:
      fail-fast: false
      # WP-B2: every supported Python (3.11/3.12/3.13) blocks on ubuntu;
      # macOS covers one Python (runner minutes cost 10x). Canary legs —
      # newest semgrep (WP-117) and Python 3.14 — inform, never block.
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        semgrep: ["1.168.0"]
        canary: [false]
        include:
          - os: macos-latest
            python: "3.12"
            semgrep: "1.168.0"
            canary: false
          - os: ubuntu-latest
            python: "3.12"
            semgrep: "latest"
            canary: true
          - os: ubuntu-latest
            python: "3.14"
            semgrep: "1.168.0"
            canary: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.canary }}
    name: test (${{ matrix.os }}, py${{ matrix.python }}, semgrep ${{ matrix.semgrep }}${{ matrix.canary && ', canary' || '' }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install tools (pinned)
        if: ${{ matrix.semgrep != 'latest' }}
        run: |
          python -m pip install --quiet pytest==9.1.1 ruff==0.15.20 semgrep==${{ matrix.semgrep }} pyyaml==6.0.3

      - name: Install tools (canary — newest semgrep)
        if: ${{ matrix.semgrep == 'latest' }}
        run: |
          python -m pip install --quiet pytest==9.1.1 ruff==0.15.20 semgrep pyyaml==6.0.3
          semgrep --version

      # Editable install so `python -m fettle.cli` resolves from any cwd —
      # CLI subprocess tests run with cwd=tmp_path, where a bare checkout
      # is not importable. Tests the same entry users get from pip.
      - name: Install fettle (editable)
        run: python -m pip install --quiet -e .

      # Rust scan paths only need coverage on one OS (cargo on macOS runners
      # is slow and 10x the minute cost); shellcheck runs on BOTH OSes so
      # shell-gate paths are exercised everywhere (WP-16).
      - name: Install cargo + shellcheck (exercises Rust/shell gate tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends shellcheck cargo

      - name: Install shellcheck (macOS — shell gate parity)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Scrub audit (no private strings)
        run: bash fettle/scrub_audit.sh

      - name: Doctor
        run: python fettle/doctor.py

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Validate completion evidence
        run: fettle completion validate

      - name: Self-scan (dogfood)
        run: python fettle/quality_scan.py --root fettle --json > /dev/null

  # WP-B1: branch coverage with a no-regression floor. Baseline measured at
  # 67% (2026-08; much of the suite exercises hooks via subprocess, which
  # coverage does not see). Floor 65 ratchets upward — raise it as the
  # in-process baseline climbs toward the [gates.coverage] threshold of 80.
  coverage:
    name: coverage (branch, floor 65)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install tools (pinned)
        run: |
          python -m pip install --quiet pytest==9.1.1 pytest-cov==7.1.0 ruff==0.15.20 semgrep==1.168.0 pyyaml==6.0.3
          python -m pip install --quiet -e .

      - name: Install cargo + shellcheck (parity with the test job)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends shellcheck cargo

      - name: Tests with coverage
        run: python -m pytest tests/ -q --cov=fettle --cov-branch --cov-report=term --cov-report=xml --cov-fail-under=65

      - name: Publish coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml

  windows-bridge:
    name: Windows installed bridge
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Publish, diagnose, and recover installed bridge
        shell: pwsh
        run: |
          $homeRoot = Join-Path $env:RUNNER_TEMP "fettle home"
          $env:HOME = $homeRoot
          $env:USERPROFILE = $homeRoot
          $env:LOCALAPPDATA = Join-Path $homeRoot "Local App Data"
          $project = Join-Path $env:RUNNER_TEMP "fettle project"
          $venv = Join-Path $env:RUNNER_TEMP "fettle python"
          New-Item -ItemType Directory -Force $project | Out-Null
          git init -q $project
          python -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          & $python -m pip install --quiet $env:GITHUB_WORKSPACE
          & $python -m fettle demo
          if ($LASTEXITCODE -ne 0) { throw "offline demo failed" }
          $bridgeRoot = Join-Path $env:LOCALAPPDATA "fettle\bridge"

          Push-Location $project
          try {
            $dryRun = & $python -m fettle init --dry-run --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or (Test-Path $bridgeRoot)) { throw "dry-run wrote the bridge" }
            if (($dryRun | Where-Object name -eq "bridge").status -ne "created") { throw "dry-run omitted bridge publication" }

            $init = & $python -m fettle init --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or ($init | Where-Object name -eq "bridge").status -ne "created") { throw "bridge publication failed" }
            $bridgeVersion = & $python -c "from fettle.bridge import bridge_dir; print(bridge_dir())"
            $doctor = & $python -m fettle doctor --json | ConvertFrom-Json
            $doctorExit = $LASTEXITCODE
            Write-Host "Bridge path: $bridgeVersion"
            Write-Host ($doctor | ConvertTo-Json -Depth 6)
            if (($doctorExit -ne 0 -and $doctorExit -ne 1) -or -not ($doctor.checks | Where-Object { $_.name -eq "bridge" -and $_.ok })) { throw "doctor did not validate bridge" }

            Add-Content (Join-Path $bridgeVersion "opencode\fettle.ts") "tampered"
            $stale = & $python -m fettle doctor --json | ConvertFrom-Json
            if ($stale.checks | Where-Object { $_.name -eq "bridge" -and $_.ok }) { throw "doctor accepted tampered bridge" }
            & $python -m fettle init --json | Out-Null
            $recovered = & $python -m fettle doctor --json | ConvertFrom-Json
            $recoveredExit = $LASTEXITCODE
            if (($recoveredExit -ne 0 -and $recoveredExit -ne 1) -or -not ($recovered.checks | Where-Object { $_.name -eq "bridge" -and $_.ok })) { throw "bridge recovery failed" }
          } finally {
            Pop-Location
          }
          exit 0

  linux-wheel:
    name: Linux wheel via pipx
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and install exact wheel
        run: |
          python -m pip install --quiet build==1.5.0 pipx==1.7.1
          python -m build --wheel
          export PIPX_HOME=/tmp/pipx
          export PIPX_BIN_DIR=/tmp/bin
          pipx install dist/*.whl
          /tmp/bin/fettle demo || exit 1

      - name: Configure detected OpenCode host without a clone
        run: |
          apt-get update -q
          apt-get install -yq --no-install-recommends git
          export HOME=/tmp/home
          export XDG_DATA_HOME=/tmp/home/.local/share
          mkdir -p "$HOME/.config/opencode" /tmp/project
          git init -q /tmp/project
          cd /tmp/project
          /tmp/bin/fettle init --json > /tmp/init.json
          /tmp/pipx/venvs/finefettle/bin/python -c "import json; from pathlib import Path; from fettle.bridge import validate_bridge; data=json.loads(Path('/tmp/init.json').read_text()); steps={item['name']: item for item in data}; assert steps['bridge']['status'] == 'created'; assert steps['opencode']['status'] == 'created'; assert validate_bridge().ok"

  required:
    name: CI required
    if: always()
    needs: [lint, test, coverage, windows-bridge, linux-wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Require every blocking CI job
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          WINDOWS_BRIDGE_RESULT: ${{ needs.windows-bridge.result }}
          LINUX_WHEEL_RESULT: ${{ needs.linux-wheel.result }}
        run: |
          if [ "$LINT_RESULT" != "success" ] || \
             [ "$TEST_RESULT" != "success" ] || \
             [ "$COVERAGE_RESULT" != "success" ] || \
             [ "$WINDOWS_BRIDGE_RESULT" != "success" ] || \
             [ "$LINUX_WHEEL_RESULT" != "success" ]; then
            echo "::error::Required CI failed: lint=$LINT_RESULT test=$TEST_RESULT coverage=$COVERAGE_RESULT windows-bridge=$WINDOWS_BRIDGE_RESULT linux-wheel=$LINUX_WHEEL_RESULT"
            exit 1
          fi
