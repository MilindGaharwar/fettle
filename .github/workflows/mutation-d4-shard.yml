name: Mutation D4 shard

on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: number
      d4_id:
        required: true
        type: string
      manifest_artifact:
        required: true
        type: string
      gate:
        required: false
        default: false
        type: boolean
      report_artifact:
        required: true
        type: string
      execute:
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  execute:
    if: inputs.execute
    name: mutation (D4 shard ${{ inputs.shard }})
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-24.04
    container:
      image: python:3.12.13-bookworm@sha256:3cd9086bdb30f7c9bc08a3fa621d9842e0d3f6f9291aeb4677e0547817c10b12
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Git checkout
        run: |
          git --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/d4-gate"
          git rev-parse HEAD
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
          uv run --no-sync python -c 'import platform,sys; sys.exit(0 if platform.python_implementation()=="CPython" and platform.python_version()=="3.12.13" else 2)'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.gate == false
        with:
          name: ${{ inputs.manifest_artifact }}
          path: d4-corpus
      - name: Prepare one-manifest synthetic D4 corpus
        if: inputs.gate
        run: |
          mkdir -p d4-gate/fettle d4-gate/tests d4-corpus/manifests d4-corpus
          : > d4-gate/fettle/__init__.py
          printf 'def answer():\n    return 42\n' > d4-gate/fettle/gate.py
          printf 'from fettle.gate import answer\ndef test_answer():\n    assert answer() == 42\n' > d4-gate/tests/test_gate.py
          printf '[mutation]\nenabled=true\nmode="advisory"\npaths=["fettle/"]\nexclude=[]\nfull_shards=1\nscore_target=0\n[mutation.test_mappings]\n"fettle/gate.py"=["tests/test_gate.py"]\n' > d4-gate/.fettle.toml
          git -C d4-gate init -q
          git -C d4-gate config user.email gate@example.invalid
          git -C d4-gate config user.name 'D4 gate'
          git -C d4-gate add .
          git -C d4-gate commit -qm gate
          uv run --no-sync python -m fettle.mutation_test --root d4-gate \
            --prepare-manifests d4-corpus/manifests --json > d4-manifest-summary.json
          uv run --no-sync python -m fettle.mutation_test --root d4-gate \
            --preflight-manifest d4-corpus/manifests/partition-0.json --json > d4-corpus/mutation-preflight.json
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          from fettle.mutation_test import _canonical_digest
          report = json.loads(Path("d4-corpus/mutation-preflight.json").read_text())
          report.update(shard_count=1, manifest_digests=[report["manifest_digest"]])
          report["corpus"] = [dict(item, shard_index=0) for item in report["corpus"]]
          report["corpus_digest"] = _canonical_digest(report["corpus"])
          Path("d4-corpus/mutation-preflight.json").write_text(json.dumps(report) + "\n")
          PY
      - name: Execute fresh D4 shard
        timeout-minutes: 340
        env:
          D4_ID: ${{ inputs.d4_id }}
          SHARD: ${{ inputs.shard }}
          CONTAINER_DIGEST: sha256:3cd9086bdb30f7c9bc08a3fa621d9842e0d3f6f9291aeb4677e0547817c10b12
        run: |
          ROOT=.
          if [[ "${{ inputs.gate }}" == true ]]; then ROOT=d4-gate; fi
          uv run --no-sync python -m fettle.mutation_test --root "$ROOT" \
            --manifest "d4-corpus/manifests/partition-${SHARD}.json" \
            --initialize-timeout-report mutation-report.json --timeout 20100
          uv run --no-sync python -m fettle.mutation_test --root "$ROOT" \
            --d4-manifest "d4-corpus/manifests/partition-${SHARD}.json" \
            --retained-preflight d4-corpus/mutation-preflight.json \
            --d4-id "$D4_ID" \
            --timeout 20100 --d4-run-id "$GITHUB_RUN_ID" \
            --d4-run-attempt "$GITHUB_RUN_ATTEMPT" --d4-job-id '${{ job.check_run_id }}' \
            --d4-container-digest "$CONTAINER_DIGEST" \
            --d4-runner-image-version "${ImageVersion:-unknown}" --json > mutation-report.json.tmp
          uv run --no-sync python -c 'import json; value=json.load(open("mutation-report.json.tmp")); assert isinstance(value,dict)'
          mv mutation-report.json.tmp mutation-report.json
          uv run --no-sync python - <<'PY'
          import json, os
          report = json.load(open("mutation-report.json"))
          valid = (
              report.get("status") == "completed"
              and str(report.get("run_id")) == os.environ["GITHUB_RUN_ID"]
              and str(report.get("run_attempt")) == os.environ["GITHUB_RUN_ATTEMPT"]
              and report.get("fresh_execution") is True
          )
          raise SystemExit(0 if valid else 2)
          PY
      - name: Retain D4 shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.report_artifact }}
          path: mutation-report.json
          if-no-files-found: error
          retention-days: 90
