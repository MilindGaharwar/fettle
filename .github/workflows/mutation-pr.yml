name: Mutation PR advisory

on:
  pull_request:

concurrency:
  group: mutation-pr-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  admission-gate:
    name: mutation (admission gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Defer while another advisory matrix is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/mutation-pr.yml/runs?status=in_progress&per_page=100" \
            > mutation-pr-active.json
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/mutation-pr.yml/runs?status=queued&per_page=100" \
            > mutation-pr-queued.json
          python .github/scripts/mutation_advisory_runs.py guard \
            --runs mutation-pr-active.json --runs mutation-pr-queued.json \
            --current-run-id "$GITHUB_RUN_ID" --output mutation-advisory-serialization.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - name: Exercise real two-shard advisory path
        run: >-
          uv run --no-sync python .github/scripts/mutation_admission_fixture.py
          --output mutation-admission-fixtures
      - name: Run full suite in shard environment
        env:
          FETTLE_REQUIRE_MUTATION_TOOLS: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: uv run --no-sync python .github/scripts/run_full_suite_parallel.py --workers 4
      - name: Retain admission fixtures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-admission-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mutation-admission-fixtures
            mutation-advisory-serialization.json
          if-no-files-found: error
          retention-days: 90

  changed-prepare:
    needs: admission-gate
    name: mutation (prepare advisory scope)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.projection.outputs.matrix }}
      shard_count: ${{ steps.prepare.outputs.shard_count }}
      reused_shards: ${{ steps.reuse.outputs.reused_shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - run: uv venv --python 3.12.13 && uv pip install --quiet --no-deps -e .
      - name: Prepare exact-head advisory partitions
        id: prepare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          MERGE_BASE="$(git merge-base "$BASE_SHA" HEAD)"
          export MERGE_BASE
          uv run --no-sync python -m fettle.mutation_test --root . --base "$MERGE_BASE" \
            --prepare-changed-manifests mutation-changed-manifests --json > prepare-changed.json
          uv run --no-sync python - <<'PY'
          import json, os
          from pathlib import Path
          prepared = json.loads(Path("prepare-changed.json").read_text())
          count = prepared["shard_count"]
          if prepared.get("status") != "completed" or not isinstance(count, int) or not 0 <= count <= 256:
              raise SystemExit(2)
          identity = {"schema_version":"1","kind":"mutation_pr_advisory_identity","head_sha":os.environ["HEAD_SHA"],"base_sha":os.environ["BASE_SHA"],"merge_base":os.environ["MERGE_BASE"],"scope":"changed","shard_count":count}
          Path("mutation-pr-identity.json").write_text(json.dumps(identity, indent=2) + "\n")
          PY
          echo "matrix=$(python -c 'import json; print(json.dumps(json.load(open("prepare-changed.json"))["matrix"],separators=(",",":")))')" >> "$GITHUB_OUTPUT"
          echo "shard_count=$(python -c 'import json; print(json.load(open("prepare-changed.json"))["shard_count"])')" >> "$GITHUB_OUTPUT"
      - name: Find successful advisory sources
        id: reuse-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/mutation-pr.yml/runs?event=pull_request&status=success&per_page=100" \
            > mutation-pr-runs.json
          python .github/scripts/mutation_advisory_runs.py candidates \
            --runs mutation-pr-runs.json --current-run-id "$GITHUB_RUN_ID" \
            --output mutation-pr-reuse-candidates.json
      - name: Download retained advisory candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p mutation-pr-reuse-source
          python -c 'import json; [print(item["run_id"], item["run_attempt"]) for item in json.load(open("mutation-pr-reuse-candidates.json"))["candidates"]]' |
          while read -r run_id run_attempt; do
            mkdir -p "mutation-pr-reuse-source/$run_id"
            gh run download "$run_id" --name "mutation-pr-advisory-$run_id-$run_attempt" \
              --dir "mutation-pr-reuse-source/$run_id" || true
          done
      - name: Select digest-compatible advisory shards
        id: reuse
        run: |
          if [ "$(python -c 'import json; print(json.load(open("prepare-changed.json"))["shard_count"])')" = 0 ]; then
            python -c 'import json; json.dump({"status":"completed","passed":True,"reused_shards":[],"matrix":{"shard":[]},"reexecution_reasons":[]},open("advisory-reuse.json","w"),separators=(",",":"))'
          elif find mutation-pr-reuse-source -type f -name mutation-pr-identity.json -print -quit | grep -q .; then
            uv run --no-sync python -m fettle.mutation_test --root . \
              --prepare-advisory-reuse mutation-pr-reuse-source \
              --reuse-manifest-scope mutation-changed-manifests \
              --reuse-output mutation-pr-reused-reports \
              --reuse-candidates-index mutation-pr-reuse-candidates.json \
              --json > advisory-reuse.json
          else
            python -c 'import json; json.dump({"status":"completed","passed":True,"reused_shards":[],"matrix":json.load(open("prepare-changed.json"))["matrix"]},open("advisory-reuse.json","w"),separators=(",",":"))'
          fi
          python -c 'import json,sys; value=json.load(open("advisory-reuse.json")); sys.exit(0 if value.get("status")=="completed" and value.get("passed") is True else 2)'
          mkdir -p mutation-pr-reused-reports
          echo "matrix=$(python -c 'import json; print(json.dumps(json.load(open("advisory-reuse.json"))["matrix"],separators=(",",":")))')" >> "$GITHUB_OUTPUT"
          echo "reused_shards=$(python -c 'import json; print(json.dumps(json.load(open("advisory-reuse.json"))["reused_shards"],separators=(",",":")))')" >> "$GITHUB_OUTPUT"
      - name: Enforce observed P95 engine budget
        id: projection
        if: always()
        run: |
          if [ "$(python -c 'import json; print(json.load(open("prepare-changed.json"))["shard_count"])')" = 0 ]; then
            python -c 'import json; json.dump({"status":"not_applicable","passed":True,"qualification_eligible":False,"dispatch_shards":[]},open("mutation-projection.json","w"),separators=(",",":"))'
            echo 'matrix={"shard":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          uv run --no-sync python -m fettle.mutation_test --root . \
            --advisory-projection-ledger .github/mutation-observed-ledger.json \
            --advisory-projection-manifests mutation-changed-manifests \
            --advisory-projection-matrix advisory-reuse.json \
            --engine-budget-seconds 21300 --json > mutation-projection.json
          status=$?
          set -e
          if python -c 'import json,sys; value=json.load(open("mutation-projection.json")); sys.exit(0 if value.get("passed") is True else 2)'; then
            echo "matrix=$(python -c 'import json; print(json.dumps(json.load(open("advisory-reuse.json"))["matrix"],separators=(",",":")))')" >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"shard":[]}' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Retain advisory-scope manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-pr-manifests-${{ github.run_id }}
          path: |
            mutation-changed-manifests
            prepare-changed.json
            advisory-reuse.json
            mutation-projection.json
            mutation-pr-identity.json
            mutation-pr-reused-reports
          if-no-files-found: error
          retention-days: 90

  changed-shard:
    if: needs.admission-gate.result == 'success' && needs.changed-prepare.result == 'success' && needs.changed-prepare.outputs.shard_count != '0' && needs.changed-prepare.outputs.matrix != '{"shard":[]}'
    needs: [admission-gate, changed-prepare]
    name: mutation (changed shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.changed-prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-pr-manifests-${{ github.run_id }}
          path: mutation-pr-source
      - name: Execute one manifest-bound advisory attempt
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHARD_COUNT: ${{ needs.changed-prepare.outputs.shard_count }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          set +e
          uv run --no-sync python -m fettle.mutation_test --root . \
            --manifest "mutation-pr-source/mutation-changed-manifests/partition-${{ matrix.shard }}.json" \
            --manifest-scope mutation-pr-source/mutation-changed-manifests \
            --shard-index "${{ matrix.shard }}" --shard-count "$SHARD_COUNT" \
            --advisory-execution --timeout 21300 --json > mutation-report.json.tmp
          status=$?
          set -e
          python -c 'import json; value=json.load(open("mutation-report.json.tmp")); assert isinstance(value,dict)'
          mv mutation-report.json.tmp mutation-report.json
          exit "$status"
      - name: Retain shard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-pr-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: mutation-report.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    if: always()
    needs: [admission-gate, changed-prepare, changed-shard]
    name: ${{ 'mutation evidence' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - run: uv venv --python 3.12.13 && uv pip install --quiet --no-deps -e .
      - name: Download exact changed-scope manifests
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-pr-manifests-${{ github.run_id }}
          path: mutation-pr-source
      - name: Download all shard reports
        if: always() && needs.changed-prepare.outputs.shard_count != '0'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-pr-shard-${{ github.run_id }}-*-*
          path: mutation-pr-reports
          merge-multiple: false
      - name: Add provenance-bound reused shard reports
        if: always() && hashFiles('mutation-pr-source/mutation-pr-reused-reports/**/mutation-report.json') != ''
        run: |
          mkdir -p mutation-pr-reports
          cp -R mutation-pr-source/mutation-pr-reused-reports/. mutation-pr-reports/
      - name: Aggregate complete exact-head evidence
        if: always()
        # Every missing, malformed, or indeterminate path emits {"status":"unknown","passed":false}.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SHARD_COUNT: ${{ needs.changed-prepare.outputs.shard_count }}
          ADMISSION_RESULT: ${{ needs.admission-gate.result }}
          PREPARE_RESULT: ${{ needs.changed-prepare.result }}
        run: |
          MERGE_BASE="$(git merge-base "$BASE_SHA" HEAD)"
          export MERGE_BASE
          if [ "$ADMISSION_RESULT" != success ]; then
            python -c 'import json; json.dump({"status":"unknown","message":"Mutation admission gate did not pass","score":None,"passed":False},open("mutation-report.json","w"),separators=(",",":"))'
          elif [ "$PREPARE_RESULT" != success ] || [ -z "$SHARD_COUNT" ] || [ ! -f mutation-pr-source/mutation-pr-identity.json ]; then
            python -c 'import json; json.dump({"status":"unknown","message":"Changed-scope preparation evidence is missing or malformed","score":None,"passed":False},open("mutation-report.json","w"),separators=(",",":"))'
          elif [ "$SHARD_COUNT" = 0 ]; then
            python - <<'PY'
          import json, os
          try:
              identity=json.load(open("mutation-pr-source/mutation-pr-identity.json"))
              valid=(identity.get("head_sha")==os.environ["HEAD_SHA"] and identity.get("base_sha")==os.environ["BASE_SHA"] and identity.get("merge_base")==os.environ["MERGE_BASE"] and identity.get("scope")=="changed" and identity.get("shard_count")==0)
          except (OSError, ValueError, TypeError):
              valid=False
          json.dump({"status":"not_applicable" if valid else "unknown","message":"No mutation-relevant changed scope" if valid else "Changed-scope identity is malformed","revision":os.environ["HEAD_SHA"],"score":None,"passed":valid},open("mutation-report.json","w"),separators=(",",":"))
          PY
          else
            if ! python -c 'import json,os,sys; identity=json.load(open("mutation-pr-source/mutation-pr-identity.json")); valid=(identity.get("head_sha")==os.environ["HEAD_SHA"] and identity.get("base_sha")==os.environ["BASE_SHA"] and identity.get("merge_base")==os.environ["MERGE_BASE"] and identity.get("scope")=="changed" and identity.get("shard_count")==int(os.environ["SHARD_COUNT"])); sys.exit(0 if valid else 2)'; then
              python -c 'import json; json.dump({"status":"unknown","message":"Changed-scope identity is malformed","score":None,"passed":False},open("mutation-report.json","w"),separators=(",",":"))'
            fi
            if [ ! -f mutation-report.json ]; then
              set +e
              uv run --no-sync python -m fettle.mutation_test --root . \
                --aggregate mutation-pr-reports \
                --aggregate-advisory \
                --aggregate-scope mutation-pr-source/mutation-changed-manifests \
              --shard-count "$SHARD_COUNT" --json > mutation-report.json.tmp
              status=$?
              set -e
              if python -c 'import json; value=json.load(open("mutation-report.json.tmp")); assert isinstance(value,dict)' 2>/dev/null; then
                mv mutation-report.json.tmp mutation-report.json
              else
                python -c 'import json; json.dump({"status":"unknown","message":"Aggregate mutation evidence is missing or malformed","score":None,"passed":False},open("mutation-report.json","w"),separators=(",",":"))'
              fi
              test "$status" -eq 0 || true
            fi
          fi
      - name: Record advisory scope and projected runtime
        if: always() && hashFiles('mutation-report.json') != ''
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "### PR mutation advisory scope"
            echo "- Head: \`$HEAD_SHA\`"
            echo "- Base: \`$BASE_SHA\`"
            echo "- One attempt per changed-scope shard; per-mutant timeouts remain advisory debt."
            echo "- Runtime admission: every dispatched shard passed target-runner P95 at 85% of the 21,300-second engine budget."
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --no-sync python -m fettle.mutation_test --github-summary mutation-report.json \
            --artifact-name mutation-pr-advisory-${{ github.run_id }}-${{ github.run_attempt }} \
            --artifact-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
      - name: Retain complete PR advisory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-pr-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mutation-report.json
            mutation-pr-source
            mutation-pr-reports
          if-no-files-found: error
          retention-days: 90
      - name: Enforce mutation advisory result
        if: always()
        run: >-
          python -c "import json,sys;
          report=json.load(open('mutation-report.json'));
          sys.exit(0 if report.get('passed') is True else 2)"
