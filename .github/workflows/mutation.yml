name: Mutation evidence

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Bounded P62 stage to execute"
        required: true
        default: preflight
        type: choice
        options:
          - binding-probe
          - diagnostic-canary
          - staged-preflight
          - staged-preflight-recovery
          - preflight
          - replay
          - calibration
          - finalize
      preflight_run_id:
        description: "Successful preflight run on this commit (required for replay/calibration)"
        required: false
        type: string
      calibration_id:
        description: "Unique logical calibration ID (required for calibration)"
        required: false
        type: string
      calibration_stage:
        description: "Calibration stage to execute (1, 2, or 3)"
        required: false
        type: string
      stage_1_run_id:
        description: "Terminal stage 1 run (required for stages 2 and 3)"
        required: false
        type: string
      stage_2_run_id:
        description: "Terminal stage 2 run (required for stage 3)"
        required: false
        type: string
      executable_candidate_sha:
        description: "Frozen executable SHA E (required for finalize)"
        required: false
        type: string
      calibration_run_id:
        description: "Successful stage 3 calibration run for E (required for finalize)"
        required: false
        type: string
      runner_minute_ceiling:
        description: "Separately approved cumulative calibration ceiling"
        required: false
        type: string
      resume_run_id:
        description: "Prior run of this replay/calibration to resume"
        required: false
        type: string
      candidate_sha:
        description: "Exact 40-character candidate commit to qualify"
        required: true
        type: string
      diagnostic_shard:
        description: "Single shard index for diagnostic-canary mode"
        required: false
        type: string

concurrency:
  group: mutation-authoritative-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    if: github.event_name == 'schedule' || (github.event.inputs.mode != 'binding-probe' && github.event.inputs.mode != 'staged-preflight' && github.event.inputs.mode != 'staged-preflight-recovery' && github.event.inputs.mode != 'finalize')
    name: mutation (prepare partitions)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix || steps.reuse.outputs.matrix }}
      execution_matrix: ${{ steps.prepare.outputs.execution_matrix || steps.reuse.outputs.execution_matrix }}
      shard_count: ${{ steps.prepare.outputs.shard_count || steps.reuse.outputs.shard_count }}
      max_parallel: ${{ steps.prepare.outputs.max_parallel || steps.reuse.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - run: uv venv --python 3.12.13 && uv pip install --quiet -e .
      - name: Validate effective configuration
        run: uv run --no-sync fettle config --validate
      - name: Bind dispatch to exact candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
        run: >-
          python -c 'import os,re,sys; candidate=os.environ["CANDIDATE_SHA"];
          sys.exit(0 if re.fullmatch(r"[0-9a-f]{40}", candidate) and candidate == os.environ["GITHUB_SHA"] else 1)'
      - name: Require retained preflight run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight' && github.event.inputs.mode != 'diagnostic-canary'
        env:
          PREFLIGHT_RUN_ID: ${{ github.event.inputs.preflight_run_id }}
        run: test -n "$PREFLIGHT_RUN_ID" && test "$PREFLIGHT_RUN_ID" -eq "$PREFLIGHT_RUN_ID"
      - name: Require numeric resume run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.resume_run_id != ''
        env:
          RESUME_RUN_ID: ${{ github.event.inputs.resume_run_id }}
        run: test "$RESUME_RUN_ID" -eq "$RESUME_RUN_ID"
      - name: Require calibration identity
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'calibration' || github.event.inputs.mode == 'finalize')
        env:
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
        run: >-
          python -c 'import os,re,sys; value=os.environ["CALIBRATION_ID"];
          sys.exit(0 if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,63}", value) else 1)'
      - name: Bind sequential calibration stage
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'calibration'
        env:
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
          STAGE_1_RUN_ID: ${{ github.event.inputs.stage_1_run_id }}
          STAGE_2_RUN_ID: ${{ github.event.inputs.stage_2_run_id }}
        run: >-
          python -c 'import os,re,sys; stage=os.environ["CALIBRATION_STAGE"];
          one=os.environ["STAGE_1_RUN_ID"]; two=os.environ["STAGE_2_RUN_ID"];
          numeric=lambda value: bool(re.fullmatch(r"[1-9][0-9]*",value));
          valid=(stage=="1" and not one and not two) or (stage=="2" and numeric(one) and not two)
          or (stage=="3" and numeric(one) and numeric(two) and one!=two);
          sys.exit(0 if valid else 1)'
      - name: Require separately approved calibration ceiling
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'calibration'
        env:
          RUNNER_MINUTE_CEILING: ${{ github.event.inputs.runner_minute_ceiling }}
        run: >-
          python -c 'import os,re,sys; value=os.environ["RUNNER_MINUTE_CEILING"];
          sys.exit(0 if re.fullmatch(r"[1-9][0-9]{0,4}",value) and int(value)<=12000 else 2)'
      - name: Download retained partition manifests
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight' && github.event.inputs.mode != 'diagnostic-canary'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-manifests-${{ github.event.inputs.preflight_run_id }}
          path: mutation-manifests
          run-id: ${{ github.event.inputs.preflight_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download retained preflight aggregate
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight' && github.event.inputs.mode != 'diagnostic-canary'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-${{ github.event.inputs.preflight_run_id }}
          path: retained-preflight
          run-id: ${{ github.event.inputs.preflight_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download prior calibration stage 1
        if: github.event.inputs.mode == 'calibration' && (github.event.inputs.calibration_stage == '2' || github.event.inputs.calibration_stage == '3')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-shard-${{ github.event.inputs.stage_1_run_id }}-*
          path: prior-calibration/stage-1
          run-id: ${{ github.event.inputs.stage_1_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download prior calibration stage 2
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage == '3'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-shard-${{ github.event.inputs.stage_2_run_id }}-*
          path: prior-calibration/stage-2
          run-id: ${{ github.event.inputs.stage_2_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download prior calibration accounting
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage != '1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-calibration-accounting-${{ github.event.inputs.calibration_stage == '2' && github.event.inputs.stage_1_run_id || github.event.inputs.stage_2_run_id }}
          path: prior-accounting
          run-id: ${{ github.event.inputs.calibration_stage == '2' && github.event.inputs.stage_1_run_id || github.event.inputs.stage_2_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate prior calibration stages before fan-out
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage != '1'
        env:
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
          RUNNER_MINUTE_CEILING: ${{ github.event.inputs.runner_minute_ceiling }}
        run: |
          uv run --no-sync python - <<'PY'
          import json, os, pathlib, sys
          from fettle.staged_preflight import WAVES
          expected = {"stage-1": WAVES["wave-1"]}
          if os.environ["CALIBRATION_STAGE"] == "3":
              expected["stage-2"] = WAVES["wave-2"]
          for directory, indexes in expected.items():
              paths = sorted(pathlib.Path("prior-calibration", directory).rglob("mutation-report.json"))
              if len(paths) != len(indexes):
                  sys.exit(2)
              reports = [json.loads(path.read_text()) for path in paths]
              identity_fields = (
                  "revision", "calibration_id", "preflight_digest",
                  "preflight_corpus_digest", "environment_digest",
              )
              identities = {
                  tuple(report.get(field) for field in identity_fields)
                  for report in reports
              }
              if (sorted(report.get("shard_index") for report in reports) != sorted(indexes)
                      or len(identities) != 1
                      or any(report.get("status") != "completed"
                             or report.get("calibration_id") != os.environ["CALIBRATION_ID"]
                             or report.get("revision") != os.environ["GITHUB_SHA"]
                             for report in reports)):
                  sys.exit(2)
          accounting = json.load(open("prior-accounting/calibration-accounting.json"))
          expected_stage = str(int(os.environ["CALIBRATION_STAGE"]) - 1)
          if (accounting.get("stage") != expected_stage or accounting.get("passed") is not True
                  or accounting.get("ceiling") != int(os.environ["RUNNER_MINUTE_CEILING"])):
              sys.exit(2)
          PY
      - name: Prepare digest-bound partitions
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'preflight' || github.event.inputs.mode == 'diagnostic-canary'
        id: prepare
        run: |
          uv run --no-sync python -m fettle.mutation_test --root . --prepare-manifests mutation-manifests --json > prepare.json
          python -c 'import json,sys; report=json.load(open("prepare.json")); sys.exit(0 if report.get("shard_count")==256 else 2)'
          {
            echo "matrix=$(uv run --no-sync python -c 'import json; print(json.dumps(json.load(open("prepare.json"))["matrix"], separators=(",", ":")))')"
            echo "execution_matrix=$(MODE='${{ github.event.inputs.mode || 'preflight' }}' STAGE='${{ github.event.inputs.calibration_stage }}' uv run --no-sync python -c 'import glob,json,os; from fettle.staged_preflight import WAVES; manifests=[json.load(open(path)) for path in glob.glob("mutation-manifests/partition-*.json")]; archived=(("fettle/mutation_test.py",121,180),("fettle/mutation_test.py",1081,1140),("fettle/mutation_test.py",1141,1200),("fettle/environment.py",121,141),("fettle/policy_layers.py",1,60),("fettle/policy_layers.py",61,120),("fettle/security_review.py",1,60),("fettle/suppressions_v3.py",121,180)); replay=sorted({manifest["shard_index"] for manifest in manifests for item in manifest["ranges"] if any(item["file"] == file and item["start"] <= end and item["end"] >= start for file,start,end in archived)}); mode=os.environ["MODE"]; selected=WAVES["wave-"+os.environ["STAGE"]] if mode=="calibration" else (replay if mode=="replay" else list(range(json.load(open("prepare.json"))["shard_count"]))); print(json.dumps({"shard":selected},separators=(",",":")))')"
            echo "shard_count=$(uv run --no-sync python -c 'import json; print(json.load(open("prepare.json"))["shard_count"])')"
            echo "max_parallel=$(python -c 'print({"1":8,"2":16,"3":32}.get("${{ github.event.inputs.calibration_stage }}",32))')"
          } >> "$GITHUB_OUTPUT"
      - name: Validate diagnostic canary scope
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnostic-canary'
        env:
          DIAGNOSTIC_SHARD: ${{ github.event.inputs.diagnostic_shard }}
        run: >-
          python -c 'import json,os,re,sys; value=os.environ["DIAGNOSTIC_SHARD"];
          count=json.load(open("prepare.json"))["shard_count"];
          sys.exit(0 if re.fullmatch(r"0|[1-9][0-9]*", value) and int(value) < count else 1)'
      - name: Verify retained SHA-bound preflight
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight' && github.event.inputs.mode != 'diagnostic-canary'
        id: reuse
        env:
          MODE: ${{ github.event.inputs.mode }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
        run: |
          uv run --no-sync python -c 'import glob,json,os; from fettle.mutation_test import load_partition_manifest; from fettle.staged_preflight import WAVES; paths=glob.glob("mutation-manifests/partition-*.json"); manifests=[load_partition_manifest(__import__("pathlib").Path(path)) for path in paths]; aggregate=json.load(open("retained-preflight/mutation-preflight.json")); shard_count=len(manifests); assert shard_count==256 and sorted(item["shard_index"] for item in manifests)==list(range(shard_count)), "retained manifests are incomplete"; assert all(item["revision"]==os.environ["GITHUB_SHA"] and item["shard_count"]==shard_count for item in manifests), "retained manifests do not match this commit and topology"; assert aggregate.get("status")=="completed" and aggregate.get("passed") is True, "retained preflight is not successful"; assert aggregate["revision"]==os.environ["GITHUB_SHA"], "retained preflight does not match this commit"; assert aggregate["shard_count"]==shard_count, "retained preflight shard count differs"; assert aggregate["generated"]==aggregate["canonicalized"], "retained preflight details do not reconcile"; assert aggregate["collisions"]==0, "retained preflight contains collisions"; archived=(("fettle/mutation_test.py",121,180),("fettle/mutation_test.py",1081,1140),("fettle/mutation_test.py",1141,1200),("fettle/environment.py",121,141),("fettle/policy_layers.py",1,60),("fettle/policy_layers.py",61,120),("fettle/security_review.py",1,60),("fettle/suppressions_v3.py",121,180)); replay=sorted({manifest["shard_index"] for manifest in manifests for item in manifest["ranges"] if any(item["file"]==file and item["start"]<=end and item["end"]>=start for file,start,end in archived)}); stage=os.environ.get("CALIBRATION_STAGE",""); selected=WAVES["wave-"+stage] if os.environ["MODE"]=="calibration" else replay; outputs={"matrix":{"shard":list(range(shard_count))},"execution_matrix":{"shard":selected},"shard_count":shard_count,"max_parallel":{"1":8,"2":16,"3":32}.get(stage,32)}; open("reuse-outputs.json","w").write(json.dumps(outputs))'
          {
            echo "matrix=$(uv run --no-sync python -c 'import json; print(json.dumps(json.load(open("reuse-outputs.json"))["matrix"], separators=(",", ":")))')"
            echo "execution_matrix=$(uv run --no-sync python -c 'import json; print(json.dumps(json.load(open("reuse-outputs.json"))["execution_matrix"], separators=(",", ":")))')"
            echo "shard_count=$(uv run --no-sync python -c 'import json; print(json.load(open("reuse-outputs.json"))["shard_count"])')"
            echo "max_parallel=$(uv run --no-sync python -c 'import json; print(json.load(open("reuse-outputs.json"))["max_parallel"])')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
          if-no-files-found: error
          retention-days: 90

  preflight:
    if: github.event_name == 'schedule' || github.event.inputs.mode == 'preflight'
    needs: prepare
    name: mutation (detail preflight ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
          uv run --no-sync python -c 'import platform,sys; sys.exit(0 if platform.python_implementation()=="CPython" and platform.python_version()=="3.12.13" else 2)'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
      - name: Bounded mutation-detail preflight
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --preflight-manifest mutation-manifests/partition-${{ matrix.shard }}.json
          --json > mutation-preflight.json
      - name: Retain mutation preflight shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-${{ github.run_id }}-${{ matrix.shard }}
          path: mutation-preflight.json
          if-no-files-found: error
          retention-days: 90

  diagnostic-canary:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnostic-canary'
    needs: prepare
    name: mutation (diagnostic preflight shard)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
          uv run --no-sync python -c 'import platform,sys; sys.exit(0 if platform.python_implementation()=="CPython" and platform.python_version()=="3.12.13" else 2)'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
      - name: Run diagnostic preflight canary
        env:
          DIAGNOSTIC_SHARD: ${{ github.event.inputs.diagnostic_shard }}
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --preflight-manifest "mutation-manifests/partition-${DIAGNOSTIC_SHARD}.json"
          --json > mutation-preflight-diagnostic.json
      - name: Retain diagnostic preflight canary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-diagnostic-${{ github.run_id }}
          path: mutation-preflight-diagnostic.json
          if-no-files-found: error

  preflight-aggregate:
    if: (github.event_name == 'schedule' || github.event.inputs.mode == 'preflight') && always()
    needs: [prepare, preflight]
    name: mutation (complete detail corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
          uv run --no-sync python -c 'import platform,sys; sys.exit(0 if platform.python_implementation()=="CPython" and platform.python_version()=="3.12.13" else 2)'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-${{ github.run_id }}-*
          path: mutation-preflight-shards
      - name: Aggregate complete mutation-detail corpus
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --aggregate-preflight mutation-preflight-shards
          --shard-count ${{ needs.prepare.outputs.shard_count }} --json > mutation-preflight.json
      - name: Retain complete mutation preflight
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-${{ github.run_id }}
          path: mutation-preflight.json
          if-no-files-found: error
          retention-days: 90

  preflight-readback:
    if: (github.event_name == 'schedule' || github.event.inputs.mode == 'preflight') && always()
    needs: preflight-aggregate
    name: mutation (read back detail corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-${{ github.run_id }}
          path: retained-preflight
      - name: Read back complete preflight
        run: >-
          python -c 'import json,sys; report=json.load(open("retained-preflight/mutation-preflight.json"));
          sys.exit(0 if report.get("status")=="completed" and report.get("passed") is True
          and report.get("shard_count")==256 and report.get("generated")==report.get("canonicalized")
          and report.get("collisions")==0 else 2)'

  staged-prepare:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'staged-preflight' || github.event.inputs.mode == 'staged-preflight-recovery')
    name: mutation (freeze staged preflight)
    runs-on: ubuntu-latest
    outputs:
      wave_1: ${{ steps.plan.outputs.wave_1 }}
      wave_2: ${{ steps.plan.outputs.wave_2 }}
      wave_3: ${{ steps.plan.outputs.wave_3 }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Reject rerun attempts
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: test "$RUN_ATTEMPT" = "1"
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Check out frozen executable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0fc41fdfee13e09f4bda3dc5eee177030882aa36
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install frozen candidate
        working-directory: candidate
        run: uv venv --python 3.12.14 && uv pip install --quiet --no-deps -e .
      - name: Bind frozen candidate and orchestration
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
        run: >-
          python -c 'import os,re,subprocess,sys; candidate=os.environ["CANDIDATE_SHA"];
          actual=subprocess.check_output(["git","-C","candidate","rev-parse","HEAD"],text=True).strip();
          control=subprocess.check_output(["git","-C","control","rev-parse","HEAD"],text=True).strip();
          sys.exit(0 if candidate=="0fc41fdfee13e09f4bda3dc5eee177030882aa36"==actual
          and re.fullmatch(r"[0-9a-f]{40}",control) and control==os.environ["GITHUB_SHA"] else 1)'
      - name: Prepare frozen digest-bound partitions
        working-directory: candidate
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --prepare-manifests ../mutation-manifests --json > ../prepare.json
      - name: Download immutable recovery source plan
        if: github.event.inputs.mode == 'staged-preflight-recovery'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-staged-plan-37464324954-1
          path: recovery-source-plan
          run-id: 37464324954
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable recovery source reports
        if: github.event.inputs.mode == 'staged-preflight-recovery'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-1-37464324954-1-*
          path: recovery-source-reports
          run-id: 37464324954
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Retain original attempt accounting input
        if: github.event.inputs.mode == 'staged-preflight-recovery'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --paginate --slurp
          "repos/$GITHUB_REPOSITORY/actions/runs/37464324954/attempts/1/jobs?per_page=100"
          > recovery-source-jobs.json
      - name: Record fixed wave plan
        id: plan
        env:
          ORCHESTRATION_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "staged-preflight-recovery" ]; then
            candidate/.venv/bin/python control/scripts/staged_preflight.py recovery-plan --root candidate \
              --manifests mutation-manifests --source-plan recovery-source-plan/staged-preflight-plan.json \
              --source-reports recovery-source-reports --orchestration-sha "$ORCHESTRATION_SHA" \
              --repository "$GITHUB_REPOSITORY" --workflow "$GITHUB_WORKFLOW" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" --output staged-preflight-plan.json
          else
            candidate/.venv/bin/python control/scripts/staged_preflight.py plan --root candidate --manifests mutation-manifests \
              --orchestration-sha "$ORCHESTRATION_SHA" --repository "$GITHUB_REPOSITORY" \
              --workflow "$GITHUB_WORKFLOW" --workflow-ref "$GITHUB_WORKFLOW_REF" --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" --output staged-preflight-plan.json
          fi
          {
            echo "wave_1=$(python -c 'import json; print(json.dumps({"shard":json.load(open("staged-preflight-plan.json"))["waves"]["wave-1"]["shards"]},separators=(",",":")))')"
            echo "wave_2=$(python -c 'import json; print(json.dumps({"shard":json.load(open("staged-preflight-plan.json"))["waves"]["wave-2"]["shards"]},separators=(",",":")))')"
            echo "wave_3=$(python -c 'import json; print(json.dumps({"shard":json.load(open("staged-preflight-plan.json"))["waves"]["wave-3"]["shards"]},separators=(",",":")))')"
            echo "shard_count=256"
          } >> "$GITHUB_OUTPUT"
      - name: Retain frozen topology and plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-staged-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mutation-manifests
            staged-preflight-plan.json
            recovery-source-reports
            recovery-source-jobs.json
          retention-days: 90
          if-no-files-found: error

  staged-wave-1:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'staged-preflight'
    needs: staged-prepare
    name: mutation (staged preflight wave 1 shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PREFLIGHT_WAVE: "1"
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix: ${{ fromJSON(needs.staged-prepare.outputs.wave_1) }}
    steps: &staged_preflight_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0fc41fdfee13e09f4bda3dc5eee177030882aa36
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.14
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-staged-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - name: Execute frozen preflight shard
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --preflight-manifest staged-plan/mutation-manifests/partition-${{ matrix.shard }}.json
          --json > mutation-preflight.json
      - name: Retain staged preflight shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-wave-${{ env.PREFLIGHT_WAVE }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: mutation-preflight.json
          retention-days: 90
          if-no-files-found: error

  staged-wave-1-gate:
    if: always() && github.event.inputs.mode == 'staged-preflight'
    needs: [staged-prepare, staged-wave-1]
    name: mutation (validate staged preflight wave 1)
    runs-on: ubuntu-latest
    steps:
      - &checkout_control
        name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - &checkout_candidate
        name: Check out frozen executable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0fc41fdfee13e09f4bda3dc5eee177030882aa36
          path: candidate
      - &setup_staged_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - &setup_staged_uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - &install_staged_candidate
        name: Install frozen candidate for validation
        working-directory: candidate
        run: uv venv --python 3.12.14 && uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-staged-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-1-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: staged-reports
      - name: Validate wave 1 evidence
        run: >-
          candidate/.venv/bin/python control/scripts/staged_preflight.py validate-wave --root candidate
          --manifests staged-plan/mutation-manifests --plan staged-plan/staged-preflight-plan.json
          --reports staged-reports --wave wave-1 --repository "$GITHUB_REPOSITORY"
          --workflow "$GITHUB_WORKFLOW" --workflow-ref "$GITHUB_WORKFLOW_REF"
          --orchestration-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output wave-1-validation.json
      - name: Enforce remaining operational budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs.json
          candidate/.venv/bin/python control/scripts/staged_preflight.py budget-gate --jobs jobs.json \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --next-wave wave-2 --output wave-1-budget.json
      - name: Retain wave 1 validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-wave-1-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            wave-1-validation.json
            wave-1-budget.json
            jobs.json
          retention-days: 90
          if-no-files-found: error

  staged-recovery-gate:
    if: always() && github.event.inputs.mode == 'staged-preflight-recovery'
    needs: [staged-prepare]
    name: mutation (validate staged preflight recovery)
    runs-on: ubuntu-latest
    steps:
