name: Mutation evidence

on:
  pull_request:
    paths:
      - "fettle/**/*.py"
      - "tests/**/*.py"
      - ".fettle.toml"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  changed:
    if: github.event_name == 'pull_request'
    name: mutation (changed, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned mutation tools
        run: >-
          python -m pip install --quiet -e ".[all]"
          pytest==9.1.1 pytest-testmon==2.2.0 mutmut==2.5.1 whatthepatch==1.0.7
      - name: Restore non-authoritative mutation cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .fettle/mutation-cache
          key: mutation-native-${{ runner.os }}-py312-${{ github.sha }}
          restore-keys: |
            mutation-native-${{ runner.os }}-py312-
      - name: Initialize fail-closed timeout evidence
        run: >-
          python -m fettle.mutation_test
          --initialize-timeout-report mutation-report.json --timeout 600
      - name: Changed-scope mutation evidence
        timeout-minutes: 10
        run: >-
          fettle mutation run --changed --base origin/${{ github.base_ref }}
          --json --output mutation-report.json
      - name: Save non-authoritative mutation cache
        if: always() && hashFiles('.fettle/mutation-cache/identity.json') != ''
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .fettle/mutation-cache
          key: mutation-native-${{ runner.os }}-py312-${{ github.sha }}
      - name: Mutation summary
        if: always() && hashFiles('mutation-report.json') != ''
        run: >-
          python -m fettle.mutation_test --github-summary mutation-report.json
          --artifact-name mutation-evidence-${{ github.run_id }}
          --artifact-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-evidence-${{ github.run_id }}
          path: mutation-report.json
          if-no-files-found: error

  prepare:
    if: github.event_name != 'pull_request'
    name: mutation (prepare partitions)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      shard_count: ${{ steps.prepare.outputs.shard_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -e .
      - name: Validate effective configuration
        run: fettle config --validate
      - name: Prepare digest-bound partitions
        id: prepare
        run: |
          python -m fettle.mutation_test --root . --prepare-manifests mutation-manifests --json > prepare.json
          echo "matrix=$(python -c 'import json; print(json.dumps(json.load(open("prepare.json"))["matrix"], separators=(",", ":")))')" >> "$GITHUB_OUTPUT"
          echo "shard_count=$(python -c 'import json; print(json.load(open("prepare.json"))["shard_count"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
          if-no-files-found: error

  full-shard:
    if: github.event_name != 'pull_request'
    needs: prepare
    name: mutation (full shard ${{ matrix.shard }}, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned mutation tools
        run: >-
          python -m pip install --quiet -e ".[all]"
          pytest==9.1.1 pytest-testmon==2.2.0 mutmut==2.5.1 whatthepatch==1.0.7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
      - name: Full mutation shard evidence
        run: >-
          fettle mutation run --all
          --manifest mutation-manifests/partition-${{ matrix.shard }}.json
          --json --output mutation-report.json
      - name: Retain mutation shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: mutation-report.json
          if-no-files-found: error

  aggregate:
    if: github.event_name != 'pull_request' && always()
    name: mutation (full aggregate, advisory)
    needs: [prepare, full-shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-shard-${{ github.run_id }}-*
          path: mutation-shards
          merge-multiple: true
      - name: Validate and aggregate full mutation evidence
        run: >-
          python -m fettle.mutation_test --root . --aggregate mutation-shards
          --shard-count ${{ needs.prepare.outputs.shard_count }} --json > mutation-report.json
      - name: Mutation summary
        if: always() && hashFiles('mutation-report.json') != ''
        run: >-
          python -c "import json,os,pathlib; r=json.load(open('mutation-report.json'));
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('## Full mutation evidence\n\nStatus: **%s**  \nScore: **%s**  \nKilled: **%s**  \nSurvived: **%s**\n'
          % (r.get('status'), r.get('score'), r.get('killed', 0), r.get('survived', 0)))"
      - name: Retain full mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-evidence-${{ github.run_id }}
          path: mutation-report.json
          if-no-files-found: error
