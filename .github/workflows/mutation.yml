name: Mutation evidence

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Bounded P62 stage to execute"
        required: true
        default: preflight
        type: choice
        options:
          - binding-probe
          - diagnostic-canary
          - staged-preflight
          - preflight
          - replay
          - calibration
          - finalize
      preflight_run_id:
        description: "Successful preflight run on this commit (required for replay/calibration)"
        required: false
        type: string
      calibration_id:
        description: "Unique logical calibration ID (required for calibration)"
        required: false
        type: string
      calibration_stage:
        description: "Calibration stage to execute (1, 2, or 3)"
        required: false
        type: string
      stage_1_run_id:
        description: "Terminal stage 1 run (required for stages 2 and 3)"
        required: false
        type: string
      stage_2_run_id:
        description: "Terminal stage 2 run (required for stage 3)"
        required: false
        type: string
      executable_candidate_sha:
        description: "Frozen executable SHA E (required for finalize)"
        required: false
        type: string
      calibration_run_id:
        description: "Successful stage 3 calibration run for E (required for finalize)"
        required: false
        type: string
      runner_minute_ceiling:
        description: "Separately approved cumulative calibration ceiling"
        required: false
        type: string
      resume_run_id:
        description: "Prior run of this replay/calibration to resume"
        required: false
        type: string
      candidate_sha:
        description: "Exact 40-character candidate commit to qualify"
        required: true
        type: string
      diagnostic_shard:
        description: "Single shard index for diagnostic-canary mode"
        required: false
        type: string

concurrency:
  group: mutation-authoritative-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    if: github.event_name == 'schedule' || (github.event.inputs.mode != 'binding-probe' && github.event.inputs.mode != 'staged-preflight' && github.event.inputs.mode != 'finalize')
    name: mutation (prepare partitions)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix || steps.reuse.outputs.matrix }}
      execution_matrix: ${{ steps.continuation.outputs.execution_matrix || steps.prepare.outputs.execution_matrix || steps.reuse.outputs.execution_matrix }}
      shard_count: ${{ steps.prepare.outputs.shard_count || steps.reuse.outputs.shard_count }}
      max_parallel: ${{ steps.prepare.outputs.max_parallel || steps.reuse.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - run: uv venv --python 3.12.13 && uv pip install --quiet --no-deps -e .
      - name: Validate effective configuration
        run: uv run --no-sync fettle config --validate
      - name: Bind dispatch to exact candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
        run: >-
          python -c 'import os,re,sys; candidate=os.environ["CANDIDATE_SHA"];
          sys.exit(0 if re.fullmatch(r"[0-9a-f]{40}", candidate) and candidate == os.environ["GITHUB_SHA"] else 1)'
      - name: Require retained preflight run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight' && github.event.inputs.mode != 'diagnostic-canary'
        env:
          PREFLIGHT_RUN_ID: ${{ github.event.inputs.preflight_run_id }}
        run: test -n "$PREFLIGHT_RUN_ID" && test "$PREFLIGHT_RUN_ID" -eq "$PREFLIGHT_RUN_ID"
      - name: Require numeric resume run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.resume_run_id != ''
        env:
          RESUME_RUN_ID: ${{ github.event.inputs.resume_run_id }}
        run: test "$RESUME_RUN_ID" -eq "$RESUME_RUN_ID"
      - name: Require calibration identity
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'calibration' || github.event.inputs.mode == 'finalize')
        env:
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
        run: >-
          python -c 'import os,re,sys; value=os.environ["CALIBRATION_ID"];
          sys.exit(0 if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,63}", value) else 1)'
      - name: Bind sequential calibration stage
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'calibration'
        env:
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
          STAGE_1_RUN_ID: ${{ github.event.inputs.stage_1_run_id }}
          STAGE_2_RUN_ID: ${{ github.event.inputs.stage_2_run_id }}
        run: >-
          python -c 'import os,re,sys; stage=os.environ["CALIBRATION_STAGE"];
          one=os.environ["STAGE_1_RUN_ID"]; two=os.environ["STAGE_2_RUN_ID"];
          numeric=lambda value: bool(re.fullmatch(r"[1-9][0-9]*",value));
          valid=(stage=="1" and not one and not two) or (stage=="2" and numeric(one) and not two)
          or (stage=="3" and numeric(one) and numeric(two) and one!=two);
          sys.exit(0 if valid else 1)'
      - name: Require separately approved calibration ceiling
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'calibration'
        env:
          RUNNER_MINUTE_CEILING: ${{ github.event.inputs.runner_minute_ceiling }}
        run: >-
          python -c 'import os,re,sys; value=os.environ["RUNNER_MINUTE_CEILING"];
          sys.exit(0 if re.fullmatch(r"[1-9][0-9]{0,4}",value) and int(value)<=12000 else 2)'
      - name: Download retained partition manifests
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight' && github.event.inputs.mode != 'diagnostic-canary'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-manifests-${{ github.event.inputs.preflight_run_id }}
          path: mutation-manifests
          run-id: ${{ github.event.inputs.preflight_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download retained preflight aggregate
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight' && github.event.inputs.mode != 'diagnostic-canary'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-${{ github.event.inputs.preflight_run_id }}
          path: retained-preflight
          run-id: ${{ github.event.inputs.preflight_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download prior calibration stage 1
        if: github.event.inputs.mode == 'calibration' && (github.event.inputs.calibration_stage == '2' || github.event.inputs.calibration_stage == '3')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-calibration-stage-${{ github.event.inputs.stage_1_run_id }}
          path: prior-calibration/stage-1
          run-id: ${{ github.event.inputs.stage_1_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download prior calibration stage 2
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage == '3'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-calibration-stage-${{ github.event.inputs.stage_2_run_id }}
          path: prior-calibration/stage-2
          run-id: ${{ github.event.inputs.stage_2_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download prior calibration accounting
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage != '1'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-calibration-accounting-${{ github.event.inputs.calibration_stage == '2' && github.event.inputs.stage_1_run_id || github.event.inputs.stage_2_run_id }}
          path: prior-accounting
          run-id: ${{ github.event.inputs.calibration_stage == '2' && github.event.inputs.stage_1_run_id || github.event.inputs.stage_2_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect selected calibration continuation evidence
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ github.event.inputs.resume_run_id }}
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
        run: |
          mkdir -p resume-checkpoints resume-accounting resume-reports
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID/attempts/1/jobs?per_page=100" > resume-jobs.json
          gh run download "$RESUME_RUN_ID" --name "mutation-manifests-$RESUME_RUN_ID" --dir resume-source
          gh run download "$RESUME_RUN_ID" --pattern "mutation-checkpoint-$CALIBRATION_ID-*" --dir resume-checkpoints || true
          gh run download "$RESUME_RUN_ID" --name "mutation-calibration-accounting-$RESUME_RUN_ID" --dir resume-accounting || {
            gh run download "$RESUME_RUN_ID" --name "mutation-calibration-monitor-$RESUME_RUN_ID" --dir resume-accounting
            cp resume-accounting/calibration-monitor-budget.json resume-accounting/calibration-accounting.json
          }
          gh run download "$RESUME_RUN_ID" --name "mutation-calibration-stage-$RESUME_RUN_ID" --dir resume-reports || \
            gh run download "$RESUME_RUN_ID" --pattern "mutation-shard-$RESUME_RUN_ID-*" --dir resume-reports || true
      - name: Validate prior calibration stages before fan-out
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage != '1'
        env:
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
          RUNNER_MINUTE_CEILING: ${{ github.event.inputs.runner_minute_ceiling }}
        run: |
          uv run --no-sync python - <<'PY'
          import json, os, pathlib, sys
          from fettle.staged_preflight import WAVES
          expected = {"stage-1": WAVES["wave-1"]}
          if os.environ["CALIBRATION_STAGE"] == "3":
              expected["stage-2"] = WAVES["wave-2"]
          prior_identity = None
          for directory, indexes in expected.items():
              paths = sorted(pathlib.Path("prior-calibration", directory).rglob("mutation-report.json"))
              if len(paths) != len(indexes):
                  sys.exit(2)
              reports = [json.loads(path.read_text()) for path in paths]
              identity_fields = (
                  "revision", "calibration_id", "preflight_digest",
                  "preflight_corpus_digest", "environment_digest",
              )
              identities = {
                  tuple(report.get(field) for field in identity_fields)
                  for report in reports
              }
              if (sorted(report.get("shard_index") for report in reports) != sorted(indexes)
                      or len(identities) != 1
                      or any(report.get("status") != "completed"
                             or report.get("calibration_id") != os.environ["CALIBRATION_ID"]
                             or report.get("revision") != os.environ["GITHUB_SHA"]
                             for report in reports)):
                  sys.exit(2)
              identity = next(iter(identities))
              if prior_identity is not None and identity != prior_identity:
                  sys.exit(2)
              prior_identity = identity
          accounting = json.load(open("prior-accounting/calibration-accounting.json"))
          expected_stage = str(int(os.environ["CALIBRATION_STAGE"]) - 1)
          if (accounting.get("stage") != expected_stage or accounting.get("passed") is not True
                  or accounting.get("ceiling") != int(os.environ["RUNNER_MINUTE_CEILING"])
                  or accounting.get("calibration_id") != os.environ["CALIBRATION_ID"]):
              sys.exit(2)
          PY
      - name: Prepare digest-bound partitions
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'preflight' || github.event.inputs.mode == 'diagnostic-canary'
        id: prepare
        run: |
          uv run --no-sync python -m fettle.mutation_test --root . --prepare-manifests mutation-manifests --json > prepare.json
          python -c 'import json,sys; report=json.load(open("prepare.json")); sys.exit(0 if report.get("shard_count")==256 else 2)'
          {
            echo "matrix=$(uv run --no-sync python -c 'import json; print(json.dumps(json.load(open("prepare.json"))["matrix"], separators=(",", ":")))')"
            echo "execution_matrix=$(MODE='${{ github.event.inputs.mode || 'preflight' }}' STAGE='${{ github.event.inputs.calibration_stage }}' uv run --no-sync python -c 'import glob,json,os; from fettle.staged_preflight import WAVES; manifests=[json.load(open(path)) for path in glob.glob("mutation-manifests/partition-*.json")]; archived=(("fettle/mutation_test.py",121,180),("fettle/mutation_test.py",1081,1140),("fettle/mutation_test.py",1141,1200),("fettle/environment.py",121,141),("fettle/policy_layers.py",1,60),("fettle/policy_layers.py",61,120),("fettle/security_review.py",1,60),("fettle/suppressions_v3.py",121,180)); replay=sorted({manifest["shard_index"] for manifest in manifests for item in manifest["ranges"] if any(item["file"] == file and item["start"] <= end and item["end"] >= start for file,start,end in archived)}); mode=os.environ["MODE"]; selected=WAVES["wave-"+os.environ["STAGE"]] if mode=="calibration" else (replay if mode=="replay" else list(range(json.load(open("prepare.json"))["shard_count"]))); print(json.dumps({"shard":selected},separators=(",",":")))')"
            echo "shard_count=$(uv run --no-sync python -c 'import json; print(json.load(open("prepare.json"))["shard_count"])')"
            echo "max_parallel=$(python -c 'print({"1":8,"2":16,"3":32}.get("${{ github.event.inputs.calibration_stage }}",32))')"
          } >> "$GITHUB_OUTPUT"
      - name: Validate diagnostic canary scope
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnostic-canary'
        env:
          DIAGNOSTIC_SHARD: ${{ github.event.inputs.diagnostic_shard }}
        run: >-
          python -c 'import json,os,re,sys; value=os.environ["DIAGNOSTIC_SHARD"];
          count=json.load(open("prepare.json"))["shard_count"];
          sys.exit(0 if re.fullmatch(r"0|[1-9][0-9]*", value) and int(value) < count else 1)'
      - name: Verify retained SHA-bound preflight
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight' && github.event.inputs.mode != 'diagnostic-canary'
        id: reuse
        env:
          MODE: ${{ github.event.inputs.mode }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
          PREFLIGHT_RUN_ID: ${{ github.event.inputs.preflight_run_id }}
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          aggregate = Path("retained-preflight/mutation-preflight.json")
          preflight_attestation = Path("retained-preflight/preflight-publication.json")
          manifest_attestation = Path("mutation-manifests/preflight-publication.json")
          preflight_completion = Path("retained-preflight/staged-preflight-continuation.json")
          manifest_completion = Path("mutation-manifests/staged-preflight-continuation.json")
          assert preflight_attestation.is_file() and manifest_attestation.is_file()
          assert preflight_attestation.read_bytes() == manifest_attestation.read_bytes()
          assert preflight_completion.is_file() and manifest_completion.is_file()
          assert preflight_completion.read_bytes() == manifest_completion.read_bytes()
          publication = json.loads(preflight_attestation.read_text())
          completion = json.loads(preflight_completion.read_text())
          manifests = sorted(Path("mutation-manifests").glob("partition-*.json"))
          topology = hashlib.sha256(b"".join(path.read_bytes() for path in manifests)).hexdigest()
          assert publication.get("kind") == "mutation_preflight_publication"
          assert publication.get("candidate_sha") == os.environ["GITHUB_SHA"]
          assert publication.get("publication_run_id") == os.environ["PREFLIGHT_RUN_ID"]
          assert publication.get("publication_run_attempt") == "1"
          assert str(publication.get("source_run_id", "")).isdigit()
          assert publication.get("aggregate_sha256") == hashlib.sha256(aggregate.read_bytes()).hexdigest()
          assert publication.get("completion_sha256") == hashlib.sha256(preflight_completion.read_bytes()).hexdigest()
          assert publication.get("manifest_count") == len(manifests) == 256
          assert publication.get("manifest_topology_sha256") == topology
          assert completion.get("candidate_sha") == os.environ["GITHUB_SHA"]
          assert completion.get("source", {}).get("run_id") == publication["source_run_id"]
          PY
          uv run --no-sync python -c 'import glob,json,os; from fettle.mutation_test import load_partition_manifest; from fettle.staged_preflight import WAVES; paths=glob.glob("mutation-manifests/partition-*.json"); manifests=[load_partition_manifest(__import__("pathlib").Path(path)) for path in paths]; aggregate=json.load(open("retained-preflight/mutation-preflight.json")); shard_count=len(manifests); assert shard_count==256 and sorted(item["shard_index"] for item in manifests)==list(range(shard_count)), "retained manifests are incomplete"; assert all(item["revision"]==os.environ["GITHUB_SHA"] and item["shard_count"]==shard_count for item in manifests), "retained manifests do not match this commit and topology"; assert aggregate.get("status")=="completed" and aggregate.get("passed") is True, "retained preflight is not successful"; assert aggregate["revision"]==os.environ["GITHUB_SHA"], "retained preflight does not match this commit"; assert aggregate["shard_count"]==shard_count, "retained preflight shard count differs"; assert aggregate["generated"]==aggregate["canonicalized"], "retained preflight details do not reconcile"; assert aggregate["collisions"]==0, "retained preflight contains collisions"; archived=(("fettle/mutation_test.py",121,180),("fettle/mutation_test.py",1081,1140),("fettle/mutation_test.py",1141,1200),("fettle/environment.py",121,141),("fettle/policy_layers.py",1,60),("fettle/policy_layers.py",61,120),("fettle/security_review.py",1,60),("fettle/suppressions_v3.py",121,180)); replay=sorted({manifest["shard_index"] for manifest in manifests for item in manifest["ranges"] if any(item["file"]==file and item["start"]<=end and item["end"]>=start for file,start,end in archived)}); stage=os.environ.get("CALIBRATION_STAGE",""); selected=WAVES["wave-"+stage] if os.environ["MODE"]=="calibration" else replay; outputs={"matrix":{"shard":list(range(shard_count))},"execution_matrix":{"shard":selected},"shard_count":shard_count,"max_parallel":{"1":8,"2":16,"3":32}.get(stage,32)}; open("reuse-outputs.json","w").write(json.dumps(outputs))'
          {
            echo "matrix=$(uv run --no-sync python -c 'import json; print(json.dumps(json.load(open("reuse-outputs.json"))["matrix"], separators=(",", ":")))')"
            echo "execution_matrix=$(uv run --no-sync python -c 'import json; print(json.dumps(json.load(open("reuse-outputs.json"))["execution_matrix"], separators=(",", ":")))')"
            echo "shard_count=$(uv run --no-sync python -c 'import json; print(json.load(open("reuse-outputs.json"))["shard_count"])')"
            echo "max_parallel=$(uv run --no-sync python -c 'import json; print(json.load(open("reuse-outputs.json"))["max_parallel"])')"
          } >> "$GITHUB_OUTPUT"
      - name: Plan provenance-bound sparse continuation
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.resume_run_id != ''
        id: continuation
        env:
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
          RESUME_RUN_ID: ${{ github.event.inputs.resume_run_id }}
        run: |
          uv run --no-sync python -m fettle.staged_preflight plan-calibration-continuation \
            --provenance resume-source/calibration-source-provenance.json \
            --jobs resume-jobs.json \
            --checkpoints resume-checkpoints --reports resume-reports \
            --manifests mutation-manifests --stage "$CALIBRATION_STAGE" \
            --calibration-id "$CALIBRATION_ID" --run-id "$RESUME_RUN_ID" \
            --run-attempt 1 --revision "$GITHUB_SHA" --output calibration-continuation.json
          echo "execution_matrix=$(python -c 'import json; print(json.dumps(json.load(open("calibration-continuation.json"))["matrix"],separators=(",",":")))')" >> "$GITHUB_OUTPUT"
      - name: Record calibration source provenance
        if: github.event.inputs.mode == 'calibration'
        env:
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
          PREFLIGHT_RUN_ID: ${{ github.event.inputs.preflight_run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          record = {
              "schema_version": "1", "kind": "calibration_source",
              "mode": "calibration", "revision": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "calibration_id": os.environ["CALIBRATION_ID"],
              "calibration_stage": os.environ["CALIBRATION_STAGE"],
              "preflight_run_id": os.environ["PREFLIGHT_RUN_ID"],
          }
          Path("mutation-manifests/calibration-source-provenance.json").write_text(
              json.dumps(record, indent=2) + "\n"
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
          if-no-files-found: error
          retention-days: 90
      - name: Retain calibration resume bundle
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.resume_run_id != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calibration-resume-bundle-${{ github.run_id }}
          path: |
            resume-checkpoints
            resume-accounting
            resume-reports
            resume-source/calibration-source-provenance.json
            resume-jobs.json
            calibration-continuation.json
          if-no-files-found: error
          retention-days: 90

  preflight:
    if: github.event_name == 'schedule' || github.event.inputs.mode == 'preflight'
    needs: prepare
    name: mutation (detail preflight ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
          uv run --no-sync python -c 'import platform,sys; sys.exit(0 if platform.python_implementation()=="CPython" and platform.python_version()=="3.12.13" else 2)'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
      - name: Bounded mutation-detail preflight
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --preflight-manifest mutation-manifests/partition-${{ matrix.shard }}.json
          --json > mutation-preflight.json
      - name: Retain mutation preflight shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-${{ github.run_id }}-${{ matrix.shard }}
          path: mutation-preflight.json
          if-no-files-found: error
          retention-days: 90

  diagnostic-canary:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnostic-canary'
    needs: prepare
    name: mutation (diagnostic preflight shard)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
          uv run --no-sync python -c 'import platform,sys; sys.exit(0 if platform.python_implementation()=="CPython" and platform.python_version()=="3.12.13" else 2)'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
      - name: Run diagnostic preflight canary
        env:
          DIAGNOSTIC_SHARD: ${{ github.event.inputs.diagnostic_shard }}
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --preflight-manifest "mutation-manifests/partition-${DIAGNOSTIC_SHARD}.json"
          --json > mutation-preflight-diagnostic.json
      - name: Retain diagnostic preflight canary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-diagnostic-${{ github.run_id }}
          path: mutation-preflight-diagnostic.json
          if-no-files-found: error

  preflight-aggregate:
    if: (github.event_name == 'schedule' || github.event.inputs.mode == 'preflight') && always()
    needs: [prepare, preflight]
    name: mutation (complete detail corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
          uv run --no-sync python -c 'import platform,sys; sys.exit(0 if platform.python_implementation()=="CPython" and platform.python_version()=="3.12.13" else 2)'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-${{ github.run_id }}-*
          path: mutation-preflight-shards
      - name: Aggregate complete mutation-detail corpus
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --aggregate-preflight mutation-preflight-shards
          --shard-count ${{ needs.prepare.outputs.shard_count }} --json > mutation-preflight.json
      - name: Retain complete mutation preflight
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-${{ github.run_id }}
          path: mutation-preflight.json
          if-no-files-found: error
          retention-days: 90

  preflight-readback:
    if: (github.event_name == 'schedule' || github.event.inputs.mode == 'preflight') && always()
    needs: preflight-aggregate
    name: mutation (read back detail corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-${{ github.run_id }}
          path: retained-preflight
      - name: Read back complete preflight
        run: >-
          python -c 'import json,sys; report=json.load(open("retained-preflight/mutation-preflight.json"));
          sys.exit(0 if report.get("status")=="completed" and report.get("passed") is True
          and report.get("shard_count")==256 and report.get("generated")==report.get("canonicalized")
          and report.get("collisions")==0 else 2)'

  staged-prepare:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'staged-preflight'
    name: mutation (freeze staged preflight)
    runs-on: ubuntu-latest
    outputs:
      wave_1: ${{ steps.plan.outputs.wave_1 }}
      wave_2: ${{ steps.plan.outputs.wave_2 }}
      wave_3: ${{ steps.plan.outputs.wave_3 }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Reject rerun attempts
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: test "$RUN_ATTEMPT" = "1"
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Check out frozen executable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.candidate_sha }}
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install frozen candidate
        working-directory: candidate
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --no-deps -e .
          uv run --no-sync python -c 'import platform,sys; sys.exit(0 if platform.python_implementation()=="CPython" and platform.python_version()=="3.12.13" else 2)'
      - name: Bind frozen candidate and orchestration
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
        run: >-
          python -c 'import os,re,subprocess,sys; candidate=os.environ["CANDIDATE_SHA"];
          actual=subprocess.check_output(["git","-C","candidate","rev-parse","HEAD"],text=True).strip();
          control=subprocess.check_output(["git","-C","control","rev-parse","HEAD"],text=True).strip();
          sys.exit(0 if candidate==actual==control==os.environ["GITHUB_SHA"]
          and re.fullmatch(r"[0-9a-f]{40}",control) else 1)'
      - name: Prepare frozen digest-bound partitions
        working-directory: candidate
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --prepare-manifests ../mutation-manifests --json > ../prepare.json
      - name: Record fixed wave plan
        id: plan
        env:
          ORCHESTRATION_SHA: ${{ github.sha }}
        run: |
          candidate/.venv/bin/python control/scripts/staged_preflight.py plan --root candidate \
            --manifests mutation-manifests --candidate-sha "${{ github.event.inputs.candidate_sha }}" \
            --orchestration-sha "$ORCHESTRATION_SHA" --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" --workflow-ref "$GITHUB_WORKFLOW_REF" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --output staged-preflight-plan.json
          {
            echo "wave_1=$(python -c 'import json; print(json.dumps({"shard":json.load(open("staged-preflight-plan.json"))["waves"]["wave-1"]["shards"]},separators=(",",":")))')"
            echo "wave_2=$(python -c 'import json; print(json.dumps({"shard":json.load(open("staged-preflight-plan.json"))["waves"]["wave-2"]["shards"]},separators=(",",":")))')"
            echo "wave_3=$(python -c 'import json; print(json.dumps({"shard":json.load(open("staged-preflight-plan.json"))["waves"]["wave-3"]["shards"]},separators=(",",":")))')"
            echo "shard_count=256"
          } >> "$GITHUB_OUTPUT"
      - name: Retain frozen topology and plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-staged-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mutation-manifests
            staged-preflight-plan.json
          retention-days: 90
          if-no-files-found: error

  staged-wave-1:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'staged-preflight'
    needs: staged-prepare
    name: mutation (staged preflight wave 1 shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PREFLIGHT_WAVE: "1"
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix: ${{ fromJSON(needs.staged-prepare.outputs.wave_1) }}
    steps: &staged_preflight_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.candidate_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-staged-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - name: Execute frozen preflight shard
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --preflight-manifest staged-plan/mutation-manifests/partition-${{ matrix.shard }}.json
          --json > mutation-preflight.json
      - name: Retain staged preflight shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-wave-${{ env.PREFLIGHT_WAVE }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: mutation-preflight.json
          retention-days: 90
          if-no-files-found: error

  staged-wave-1-gate:
    if: always() && github.event.inputs.mode == 'staged-preflight'
    needs: [staged-prepare, staged-wave-1]
    name: mutation (validate staged preflight wave 1)
    runs-on: ubuntu-latest
    steps:
      - &checkout_control
        name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - &checkout_candidate
        name: Check out frozen executable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.candidate_sha }}
          path: candidate
      - &setup_staged_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - &setup_staged_uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - &install_staged_candidate
        name: Install frozen candidate for validation
        working-directory: candidate
        run: uv venv --python 3.12.13 && uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-staged-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-1-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: staged-reports
      - name: Validate wave 1 evidence
        run: >-
          candidate/.venv/bin/python control/scripts/staged_preflight.py validate-wave --root candidate
          --manifests staged-plan/mutation-manifests --plan staged-plan/staged-preflight-plan.json
          --reports staged-reports --wave wave-1 --repository "$GITHUB_REPOSITORY"
          --workflow "$GITHUB_WORKFLOW" --workflow-ref "$GITHUB_WORKFLOW_REF"
          --orchestration-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output wave-1-validation.json
      - name: Enforce remaining operational budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs.json
          candidate/.venv/bin/python control/scripts/staged_preflight.py budget-gate --jobs jobs.json \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --next-wave wave-2 --output wave-1-budget.json
      - name: Retain wave 1 validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-wave-1-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            wave-1-validation.json
            wave-1-budget.json
            jobs.json
          retention-days: 90
          if-no-files-found: error

  staged-wave-2:
    if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'staged-preflight' && needs.staged-wave-1-gate.result == 'success'
    needs: [staged-prepare, staged-wave-1-gate]
    name: mutation (staged preflight wave 2 shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PREFLIGHT_WAVE: "2"
    strategy:
      fail-fast: true
      max-parallel: 4
      matrix: ${{ fromJSON(needs.staged-prepare.outputs.wave_2) }}
    steps: *staged_preflight_steps

  staged-wave-2-gate:
    if: always() && github.event.inputs.mode == 'staged-preflight'
    needs: [staged-prepare, staged-wave-2]
    name: mutation (validate staged preflight wave 2)
    runs-on: ubuntu-latest
    steps:
      - *checkout_control
      - *checkout_candidate
      - *setup_staged_python
      - *setup_staged_uv
      - *install_staged_candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-staged-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-2-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: staged-reports
      - name: Validate wave 2 evidence
        run: >-
          candidate/.venv/bin/python control/scripts/staged_preflight.py validate-wave --root candidate
          --manifests staged-plan/mutation-manifests --plan staged-plan/staged-preflight-plan.json
          --reports staged-reports --wave wave-2 --repository "$GITHUB_REPOSITORY"
          --workflow "$GITHUB_WORKFLOW" --workflow-ref "$GITHUB_WORKFLOW_REF"
          --orchestration-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output wave-2-validation.json
      - name: Enforce remaining operational budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs.json
          candidate/.venv/bin/python control/scripts/staged_preflight.py budget-gate --jobs jobs.json \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --next-wave wave-3 --output wave-2-budget.json
      - name: Retain wave 2 validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-wave-2-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            wave-2-validation.json
            wave-2-budget.json
            jobs.json
          retention-days: 90
          if-no-files-found: error

  staged-monitor:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'staged-preflight'
    needs: staged-wave-1-gate
    name: mutation (monitor staged preflight budget)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Stop on failure or exhausted execution budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs.json
            failed=$(jq '[.[].jobs[] | select(.name | startswith("mutation (staged preflight wave 2 shard ")) | select(.status == "completed" and .conclusion != "success")] | length' jobs.json)
            succeeded=$(jq '[.[].jobs[] | select(.name | startswith("mutation (staged preflight wave 2 shard ")) | select(.status == "completed" and .conclusion == "success")] | length' jobs.json)
            if [ "$failed" -ne 0 ]; then
              echo "Wave 2 shard failure detected; cancelling run"
              gh run cancel "$GITHUB_RUN_ID"
              exit 2
            fi
            if ! python control/scripts/staged_preflight.py budget-gate --jobs jobs.json \
              --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --next-wave complete --output monitor-budget.json; then
              echo "Operational execution cutoff reached or accounting became indeterminate; cancelling run"
              gh run cancel "$GITHUB_RUN_ID"
              exit 2
            fi
            if [ "$succeeded" -eq 32 ]; then
              break
            fi
            sleep 60
          done
      - name: Retain monitor accounting
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            jobs.json
            monitor-budget.json
          retention-days: 90
          if-no-files-found: error

  staged-dispatch-continuation:
    if: always() && github.event.inputs.mode == 'staged-preflight'
    needs: [staged-prepare, staged-wave-2-gate, staged-monitor]
    name: mutation (dispatch staged preflight continuation)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Require successful first-run waves
        run: test "${{ needs.staged-wave-2-gate.result }}" = "success" && test "${{ needs.staged-monitor.result }}" = "success"
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Reconcile continuation launch budget and inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs.json
          python control/scripts/staged_preflight.py budget-gate --jobs jobs.json \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --next-wave wave-3 --output continuation-launch-budget.json
      - name: Download immutable first-run plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-staged-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-plan
      - name: Dispatch immutable continuation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(shasum -a 256 source-plan/staged-preflight-plan.json | cut -d ' ' -f 1)
          gh workflow run staged-preflight-continuation.yml --ref "$GITHUB_REF_NAME" \
            -f candidate_sha="$GITHUB_SHA" -f source_run_id="$GITHUB_RUN_ID" \
            -f source_orchestration_sha="$GITHUB_SHA" -f source_plan_sha256="$digest" \
            -f source_workflow_ref="$GITHUB_WORKFLOW_REF"
      - name: Retain handoff evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            jobs.json
            continuation-launch-budget.json
            source-plan/staged-preflight-plan.json
          retention-days: 90
          if-no-files-found: error

  calibration-launch-gate:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight' && github.event.inputs.mode != 'diagnostic-canary' && github.event.inputs.mode != 'staged-preflight' && github.event.inputs.mode != 'finalize'
    needs: prepare
    name: mutation (calibration launch gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Reconcile usage before shard launch
        if: github.event.inputs.mode == 'calibration'
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ github.event.inputs.resume_run_id }}
          PRIOR_RUN_ID: ${{ github.event.inputs.calibration_stage == '2' && github.event.inputs.stage_1_run_id || github.event.inputs.stage_2_run_id }}
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
          RUNNER_MINUTE_CEILING: ${{ github.event.inputs.runner_minute_ceiling }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs-current.json
          base_run_id="${RESUME_RUN_ID:-$PRIOR_RUN_ID}"
          base=0
          if [[ -n "$base_run_id" ]]; then
            gh run download "$base_run_id" --name "mutation-calibration-accounting-$base_run_id" --dir prior-accounting || {
              gh run download "$base_run_id" --name "mutation-calibration-monitor-$base_run_id" --dir prior-accounting
              cp prior-accounting/calibration-monitor-budget.json prior-accounting/calibration-accounting.json
            }
            export BASE_RUN_ID="$base_run_id"
            base=$(python -c 'import json,os,sys; report=json.load(open("prior-accounting/calibration-accounting.json")); sources=report.get("sources",[report]); expected_stage=os.environ["CALIBRATION_STAGE"] if os.environ["RESUME_RUN_ID"] else str(int(os.environ["CALIBRATION_STAGE"])-1); valid=report.get("calibration_id")==os.environ["CALIBRATION_ID"] and report.get("stage")==expected_stage and report.get("ceiling")==int(os.environ["RUNNER_MINUTE_CEILING"]) and sources and sources[-1].get("expected_run_id")==os.environ["BASE_RUN_ID"] and isinstance(report.get("charged_runner_minutes"),(int,float)); sys.exit(2) if not valid else None; print(report["charged_runner_minutes"])')
          fi
          export BASE_USAGE="$base"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from fettle.staged_preflight import account_runner_minutes
          current = account_runner_minutes(Path("jobs-current.json"), expected_run_id=os.environ["GITHUB_RUN_ID"], expected_run_attempt=os.environ["GITHUB_RUN_ATTEMPT"])
          current["prior_runner_minutes"] = float(os.environ["BASE_USAGE"])
          current["estimated_runner_minutes"] = round(current["estimated_runner_minutes"] + current["prior_runner_minutes"], 2)
          Path("launch-accounting.json").write_text(json.dumps(current, indent=2) + "\n")
          PY
      - name: Enforce launch cutoff and cancellation reserve
        if: github.event.inputs.mode == 'calibration'
        run: >-
          python -m fettle.staged_preflight calibration-budget --accounting launch-accounting.json
          --ceiling ${{ github.event.inputs.runner_minute_ceiling }} --cancellation-reserve 1200
          --output calibration-launch-budget.json
      - name: Retain launch accounting
        if: github.event.inputs.mode == 'calibration'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-calibration-launch-${{ github.run_id }}
          path: |
            jobs-current.json
            launch-accounting.json
            calibration-launch-budget.json
          if-no-files-found: error
          retention-days: 90

  full-shard:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight' && github.event.inputs.mode != 'diagnostic-canary' && github.event.inputs.mode != 'staged-preflight' && github.event.inputs.mode != 'finalize'
    needs: [prepare, calibration-launch-gate]
    name: mutation (full shard ${{ matrix.shard }}, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.execution_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
          uv run --no-sync python -c 'import platform,sys; sys.exit(0 if platform.python_implementation()=="CPython" and platform.python_version()=="3.12.13" else 2)'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
      - name: Download retained preflight aggregate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-${{ github.event.inputs.preflight_run_id }}
          path: retained-preflight
          run-id: ${{ github.event.inputs.preflight_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download same-execution checkpoints
        if: github.event.inputs.mode == 'replay' && github.event.inputs.resume_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-checkpoint-${{ github.event.inputs.mode == 'replay' && format('replay-{0}', github.event.inputs.resume_run_id) || github.event.inputs.calibration_id }}-${{ matrix.shard }}
          path: resume-checkpoints
          run-id: ${{ github.event.inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download selected calibration resume bundle
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.resume_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: calibration-resume-bundle-${{ github.run_id }}
          path: calibration-resume
      - name: Full mutation shard evidence
        if: github.event.inputs.mode == 'replay'
        env:
          RESUME_RUN_ID: ${{ github.event.inputs.resume_run_id }}
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --resume-manifest mutation-manifests/partition-${{ matrix.shard }}.json
          --retained-preflight retained-preflight/mutation-preflight.json
          --calibration-id "replay-${RESUME_RUN_ID:-${{ github.run_id }}}"
          --checkpoint-output mutation-checkpoint.json
          ${{ github.event.inputs.resume_run_id != '' && '--resume-checkpoints resume-checkpoints' || '' }}
          --timeout 1740 --json > mutation-report.json
      - name: Resumable calibration shard evidence
        if: github.event.inputs.mode == 'calibration'
        timeout-minutes: 30
        env:
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
          HAS_RESUME: ${{ github.event.inputs.resume_run_id != '' }}
        run: |
          args=(
            --root .
            --resume-manifest mutation-manifests/partition-${{ matrix.shard }}.json
            --retained-preflight retained-preflight/mutation-preflight.json
            --calibration-id "$CALIBRATION_ID"
            --checkpoint-output mutation-checkpoint.json
            --timeout 1740 --json
          )
          if [[ "$HAS_RESUME" == "true" ]]; then
            args+=(--resume-checkpoints "calibration-resume/resume-checkpoints/mutation-checkpoint-$CALIBRATION_ID-${{ matrix.shard }}")
          fi
          uv run --no-sync python -m fettle.mutation_test "${args[@]}" > mutation-report.json
      - name: Retain resumable execution checkpoint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-checkpoint-${{ github.event.inputs.mode == 'replay' && format('replay-{0}', github.event.inputs.resume_run_id || github.run_id) || github.event.inputs.calibration_id }}-${{ matrix.shard }}
          path: mutation-checkpoint.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain mutation shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: mutation-report.json
          if-no-files-found: error
          retention-days: 90

  calibration-monitor:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'calibration'
    needs: [prepare, calibration-launch-gate]
    name: mutation (monitor calibration budget)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-calibration-launch-${{ github.run_id }}
          path: calibration-launch
      - name: Monitor active usage and request bounded cancellation
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_MINUTE_CEILING: ${{ github.event.inputs.runner_minute_ceiling }}
          EXPECTED_SHARDS: ${{ needs.prepare.outputs.execution_matrix }}
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
        run: |
          while true; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs-monitor.json
            python -c 'import json,os,pathlib; from fettle.staged_preflight import account_runner_minutes,evaluate_calibration_budget; usage=account_runner_minutes(pathlib.Path("jobs-monitor.json"),expected_run_id=os.environ["GITHUB_RUN_ID"],expected_run_attempt=os.environ["GITHUB_RUN_ATTEMPT"]); launch=json.load(open("calibration-launch/launch-accounting.json")); usage.update({"stage":os.environ["CALIBRATION_STAGE"],"calibration_id":os.environ["CALIBRATION_ID"],"prior_runner_minutes":launch["prior_runner_minutes"]}); usage["estimated_runner_minutes"]=round(usage["estimated_runner_minutes"]+usage["prior_runner_minutes"],2); result=evaluate_calibration_budget(usage,ceiling=int(os.environ["RUNNER_MINUTE_CEILING"]),cancellation_reserve=1200); pathlib.Path("calibration-monitor-budget.json").write_text(json.dumps(result,indent=2)+"\n")'
            passed=$(jq -r '.passed' calibration-monitor-budget.json)
            [[ "$passed" == "false" ]] && break
            expected=$(jq '.shard | length' <<< "$EXPECTED_SHARDS")
            terminal=$(jq '[.[].jobs[] | select(.name | startswith("mutation (full shard ")) | select(.status == "completed")] | length' jobs-monitor.json)
            [[ "$terminal" -eq "$expected" ]] && break
            sleep 60
          done
      - name: Retain monitor accounting before cancellation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-calibration-monitor-${{ github.run_id }}
          path: |
            jobs-monitor.json
            calibration-monitor-budget.json
          if-no-files-found: error
          retention-days: 90
      - name: Request run cancellation at cutoff
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(jq -r '.passed' calibration-monitor-budget.json)
          if [[ "$passed" == "false" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
            exit 2
          fi

  calibration-accounting:
    if: always() && github.event.inputs.mode == 'calibration'
    needs: [prepare, full-shard, calibration-monitor]
    name: mutation (calibration accounting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Collect cumulative job accounting
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ github.event.inputs.resume_run_id }}
          PRIOR_RUN_ID: ${{ github.event.inputs.calibration_stage == '2' && github.event.inputs.stage_1_run_id || github.event.inputs.stage_2_run_id }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
          RUNNER_MINUTE_CEILING: ${{ github.event.inputs.runner_minute_ceiling }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs-current.json
          base_run_id="${RESUME_RUN_ID:-$PRIOR_RUN_ID}"
          if [[ -n "$base_run_id" ]]; then
            gh run download "$base_run_id" --name "mutation-calibration-accounting-$base_run_id" --dir prior-accounting || {
              gh run download "$base_run_id" --name "mutation-calibration-monitor-$base_run_id" --dir prior-accounting
              cp prior-accounting/calibration-monitor-budget.json prior-accounting/calibration-accounting.json
            }
          fi
          python - <<'PY'
          import json, os, pathlib, sys
          from fettle.staged_preflight import account_runner_minutes, evaluate_calibration_budget
          current = account_runner_minutes(pathlib.Path("jobs-current.json"), expected_run_id=os.environ["GITHUB_RUN_ID"], expected_run_attempt=os.environ["GITHUB_RUN_ATTEMPT"])
          records = [current]
          total = current["estimated_runner_minutes"]
          prior = pathlib.Path("prior-accounting/calibration-accounting.json")
          if prior.exists():
              retained = json.loads(prior.read_text())
              base_run_id = os.environ["RESUME_RUN_ID"] or os.environ["PRIOR_RUN_ID"]
              expected_stage = (os.environ["CALIBRATION_STAGE"] if os.environ["RESUME_RUN_ID"]
                                else str(int(os.environ["CALIBRATION_STAGE"]) - 1))
              sources = retained.get("sources", [retained])
              if (retained.get("calibration_id") != os.environ["CALIBRATION_ID"]
                      or retained.get("stage") != expected_stage
                      or retained.get("ceiling") != int(os.environ["RUNNER_MINUTE_CEILING"])
                      or not sources or sources[-1].get("expected_run_id") != base_run_id
                      or not isinstance(retained.get("charged_runner_minutes"), (int, float))):
                  raise ValueError("prior cumulative accounting is incompatible")
              total = round(total + retained["charged_runner_minutes"], 2)
              records.insert(0, retained)
          result = evaluate_calibration_budget(
              {"schema_version": "1", "stage": os.environ["CALIBRATION_STAGE"],
               "calibration_id": os.environ.get("CALIBRATION_ID"),
               "estimated_runner_minutes": total, "included_jobs": current["included_jobs"],
               "sources": records},
              ceiling=int(os.environ["RUNNER_MINUTE_CEILING"]), cancellation_reserve=1200,
          )
          assert result["billing_authority"] is False
          pathlib.Path("calibration-accounting.json").write_text(json.dumps(result, indent=2)+"\n")
          sys.exit(0 if result["passed"] else 2)
          PY
      - name: Retain calibration accounting
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-calibration-accounting-${{ github.run_id }}
          path: |
            calibration-accounting.json
            jobs-*.json
          retention-days: 90
          if-no-files-found: error

  aggregate:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'staged-preflight' && always()
    name: mutation (assemble evidence)
    needs: [prepare, full-shard, calibration-accounting]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
          uv run --no-sync python -c 'import platform,sys; sys.exit(0 if platform.python_implementation()=="CPython" and platform.python_version()=="3.12.13" else 2)'
      - name: Bind authoritative check to exact candidate
        if: github.event.inputs.mode != 'finalize'
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
        run: >-
          python -c 'import os,re,sys; candidate=os.environ["CANDIDATE_SHA"];
          sys.exit(0 if re.fullmatch(r"[0-9a-f]{40}", candidate) and candidate == os.environ["GITHUB_SHA"] else 1)'
      - name: Prove evidence-only finalization head
        if: github.event.inputs.mode == 'finalize'
        env:
          EXECUTABLE_CANDIDATE_SHA: ${{ github.event.inputs.executable_candidate_sha }}
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
          CALIBRATION_RUN_ID: ${{ github.event.inputs.calibration_run_id }}
        run: |
          python - <<'PY'
          import os, re, subprocess, sys
          executable = os.environ["EXECUTABLE_CANDIDATE_SHA"]
          head = os.environ["CANDIDATE_SHA"]
          run_id = os.environ["CALIBRATION_RUN_ID"]
          allowed = {
              "docs/audit-hardening-worklog.md",
              "docs/completion/audit-hardening.json",
              "docs/completion/evidence/audit-hardening.json",
              "docs/final-candidate-readiness.md",
          }
          if not (re.fullmatch(r"[0-9a-f]{40}", executable)
                  and head == os.environ["GITHUB_SHA"]
                  and re.fullmatch(r"[1-9][0-9]*", run_id)):
              sys.exit(2)
          subprocess.run(["git", "merge-base", "--is-ancestor", executable, head], check=True)
          raw = subprocess.check_output(
              ["git", "diff", "--raw", "--no-abbrev", executable, head], text=True,
          ).splitlines()
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--no-renames", executable, head], text=True,
          ).splitlines()
          if not changed or set(changed) - allowed or len(changed) != len(set(changed)):
              sys.exit(2)
          for line in raw:
              metadata, path = line.split("\t", 1)
              fields = metadata.split()
              if path not in allowed or fields[0] != ":100644" or fields[1] != "100644" or fields[-1] != "M":
                  sys.exit(2)
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event.inputs.mode == 'calibration'
        with:
          pattern: mutation-shard-${{ github.run_id }}-*
          path: calibration-shards/current
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.resume_run_id != ''
        with:
          name: calibration-resume-bundle-${{ github.run_id }}
          path: calibration-resume
      - name: Download stage 1 mutation evidence
        if: github.event.inputs.mode == 'calibration' && (github.event.inputs.calibration_stage == '2' || github.event.inputs.calibration_stage == '3')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-calibration-stage-${{ github.event.inputs.stage_1_run_id }}
          path: calibration-shards/stage-1
          run-id: ${{ github.event.inputs.stage_1_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download stage 2 mutation evidence
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage == '3'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-calibration-stage-${{ github.event.inputs.stage_2_run_id }}
          path: calibration-shards/stage-2
          run-id: ${{ github.event.inputs.stage_2_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download current-run partition manifests
        if: github.event.inputs.mode == 'calibration'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
      - name: Download retained preflight aggregate
        if: github.event.inputs.mode == 'calibration'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-${{ github.event.inputs.preflight_run_id }}
          path: retained-preflight
          run-id: ${{ github.event.inputs.preflight_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate and aggregate full mutation evidence
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage == '3'
        env:
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
        run: |
          if [[ -d calibration-resume/resume-reports ]]; then
            cp -R calibration-resume/resume-reports/. calibration-shards/resume/
          fi
          uv run --no-sync python -m fettle.mutation_test --root . --aggregate calibration-shards \
            --aggregate-scope mutation-manifests \
            --aggregate-preflight-evidence retained-preflight/mutation-preflight.json \
            --calibration-id "$CALIBRATION_ID" \
            --shard-count ${{ needs.prepare.outputs.shard_count }} --json > mutation-report.json
      - name: Consolidate current calibration stage reports
        if: github.event.inputs.mode == 'calibration'
        env:
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
        run: |
          if [[ -d calibration-resume/resume-reports ]]; then
            cp -R calibration-resume/resume-reports/. calibration-shards/resume/
          fi
          uv run --no-sync python - <<'PY'
          import json, os
          from pathlib import Path
          from fettle.mutation_test import select_shard_subset_attempts
          from fettle.staged_preflight import WAVES
          expected = WAVES["wave-" + os.environ["CALIBRATION_STAGE"]]
          reports = [json.loads(path.read_text()) for path in Path("calibration-shards").rglob("mutation-report.json")]
          attempts = [report for report in reports if report.get("shard_index") in expected]
          selected = select_shard_subset_attempts(attempts, 256, expected)
          output = Path("calibration-stage-reports")
          output.mkdir()
          for report in selected:
              target = output / str(report["shard_index"])
              target.mkdir()
              target.joinpath("mutation-report.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - name: Retain cumulative calibration stage
        if: github.event.inputs.mode == 'calibration'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-calibration-stage-${{ github.run_id }}
          path: calibration-stage-reports
          if-no-files-found: error
          retention-days: 90
      - name: Record non-qualifying authoritative probe
        if: github.event.inputs.mode != 'calibration' && github.event.inputs.mode != 'finalize'
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
          MODE: ${{ github.event.inputs.mode }}
        run: >-
          python -c 'import json,os; mode=os.environ["MODE"];
          json.dump({"status":"unknown","message":mode+" does not constitute mutation qualification","revision":os.environ["CANDIDATE_SHA"],"score":None,"passed":False,"qualification_executed":False},open("mutation-report.json","w"),separators=(",",":"))'
      - name: Record incomplete calibration stage
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage != '3'
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
        run: >-
          python -c 'import json,os;
          json.dump({"status":"unknown","message":"calibration stage "+os.environ["CALIBRATION_STAGE"]+" retained; all three stages are required","revision":os.environ["CANDIDATE_SHA"],"score":None,"passed":False,"qualification_executed":False},open("mutation-report.json","w"),separators=(",",":"))'
      - name: Download frozen-candidate calibration
        if: github.event.inputs.mode == 'finalize'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-evidence-${{ github.event.inputs.calibration_run_id }}
          path: frozen-calibration
          run-id: ${{ github.event.inputs.calibration_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download frozen-candidate accounting
        if: github.event.inputs.mode == 'finalize'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-calibration-accounting-${{ github.event.inputs.calibration_run_id }}
          path: frozen-accounting
          run-id: ${{ github.event.inputs.calibration_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate frozen-candidate calibration
        if: github.event.inputs.mode == 'finalize'
        env:
          EXECUTABLE_CANDIDATE_SHA: ${{ github.event.inputs.executable_candidate_sha }}
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
        run: >-
          python -c 'import hashlib,json,os,pathlib,shutil,sys; path=pathlib.Path("frozen-calibration/mutation-report.json");
          checksum=pathlib.Path("frozen-calibration/mutation-report.sha256").read_text().split()[0];
          report=json.loads(path.read_text()); accounting=json.load(open("frozen-accounting/calibration-accounting.json"));
          valid=report.get("status")=="completed" and report.get("passed") is True
          and report.get("revision")==os.environ["EXECUTABLE_CANDIDATE_SHA"]
          and report.get("calibration_id")==os.environ["CALIBRATION_ID"]
          and accounting.get("stage")=="3" and accounting.get("passed") is True
          and accounting.get("calibration_id")==os.environ["CALIBRATION_ID"]
          and hashlib.sha256(path.read_bytes()).hexdigest()==checksum;
          shutil.copyfile(path,"mutation-report.json"); sys.exit(0 if valid else 2)'
      - name: Mutation summary
        if: always() && hashFiles('mutation-report.json') != ''
        run: >-
          uv run --no-sync python -c "import json,os,pathlib; r=json.load(open('mutation-report.json'));
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('## Full mutation evidence\n\nStatus: **%s**  \nScore: **%s**  \nKilled: **%s**  \nSurvived: **%s**\n'
          % (r.get('status'), r.get('score'), r.get('killed', 0), r.get('survived', 0)))"
      - name: Record evidence checksum
        if: always() && hashFiles('mutation-report.json') != ''
        run: shasum -a 256 mutation-report.json > mutation-report.sha256
      - name: Retain full mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-evidence-${{ github.run_id }}
          path: |
            mutation-report.json
            mutation-report.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Enforce mutation evidence result
        if: always() && !(github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage != '3')
        run: >-
          uv run --no-sync python -c "import json,sys;
          report=json.load(open('mutation-report.json'));
          sys.exit(0 if report.get('passed') is True else 2)"

  evidence-readback:
    if: >-
      always() && github.event_name == 'workflow_dispatch'
      && !(github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage != '3')
      && github.event.inputs.mode != 'staged-preflight'
    needs: aggregate
    name: mutation evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-evidence-${{ github.run_id }}
          path: retained-evidence
      - name: Independently read back authoritative evidence
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys
          report_path = pathlib.Path("retained-evidence/mutation-report.json")
          checksum_path = pathlib.Path("retained-evidence/mutation-report.sha256")
          try:
              report = json.loads(report_path.read_text())
              expected = checksum_path.read_text().split()[0]
              actual = hashlib.sha256(report_path.read_bytes()).hexdigest()
          except (OSError, UnicodeError, ValueError, json.JSONDecodeError, IndexError):
              sys.exit(2)
          sys.exit(0 if expected == actual and report.get("status") == "completed"
                   and report.get("passed") is True else 2)
          PY
