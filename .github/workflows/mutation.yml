name: Mutation evidence

on:
  pull_request:
    paths:
      - "fettle/**/*.py"
      - "tests/**/*.py"
      - ".fettle.toml"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Bounded P62 stage to execute"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - replay
          - calibration

jobs:
  changed:
    if: github.event_name == 'pull_request'
    name: mutation (changed, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install pinned mutation tools
        run: >-
          uv venv --python 3.12 && uv pip install --quiet -e ".[all]"
          pytest==9.1.1 pytest-testmon==2.2.0 mutmut==2.5.1 whatthepatch==1.0.7
      - name: Restore non-authoritative mutation cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .fettle/mutation-cache
          key: mutation-native-${{ runner.os }}-py312-${{ github.sha }}
          restore-keys: |
            mutation-native-${{ runner.os }}-py312-
      - name: Initialize fail-closed timeout evidence
        run: >-
          uv run --no-sync python -m fettle.mutation_test
          --initialize-timeout-report mutation-report.json --timeout 600
      - name: Changed-scope mutation evidence
        timeout-minutes: 10
        run: >-
          uv run --no-sync fettle mutation run --changed --base origin/${{ github.base_ref }}
          --json --output mutation-report.json
      - name: Save non-authoritative mutation cache
        if: always() && hashFiles('.fettle/mutation-cache/identity.json') != ''
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .fettle/mutation-cache
          key: mutation-native-${{ runner.os }}-py312-${{ github.sha }}
      - name: Mutation summary
        if: always() && hashFiles('mutation-report.json') != ''
        run: >-
          uv run --no-sync python -m fettle.mutation_test --github-summary mutation-report.json
          --artifact-name mutation-evidence-${{ github.run_id }}
          --artifact-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-evidence-${{ github.run_id }}
          path: mutation-report.json
          if-no-files-found: error

  prepare:
    if: github.event_name != 'pull_request'
    name: mutation (prepare partitions)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      execution_matrix: ${{ steps.prepare.outputs.execution_matrix }}
      shard_count: ${{ steps.prepare.outputs.shard_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv venv --python 3.12 && uv pip install --quiet -e .
      - name: Validate effective configuration
        run: uv run --no-sync fettle config --validate
      - name: Prepare digest-bound partitions
        id: prepare
        run: |
          uv run --no-sync python -m fettle.mutation_test --root . --prepare-manifests mutation-manifests --json > prepare.json
          {
            echo "matrix=$(uv run --no-sync python -c 'import json; print(json.dumps(json.load(open("prepare.json"))["matrix"], separators=(",", ":")))')"
            echo "execution_matrix=$(MODE='${{ github.event.inputs.mode || 'calibration' }}' uv run --no-sync python -c 'import glob,json,os; manifests=[json.load(open(path)) for path in glob.glob("mutation-manifests/partition-*.json")]; archived=(("fettle/mutation_test.py",121,180),("fettle/mutation_test.py",1081,1140),("fettle/mutation_test.py",1141,1200),("fettle/environment.py",121,141),("fettle/policy_layers.py",1,60),("fettle/policy_layers.py",61,120),("fettle/security_review.py",1,60),("fettle/suppressions_v3.py",121,180)); replay=sorted({manifest["shard_index"] for manifest in manifests for item in manifest["ranges"] if any(item["file"] == file and item["start"] <= end and item["end"] >= start for file,start,end in archived)}); print(json.dumps({"shard": replay if os.environ["MODE"] == "replay" else list(range(json.load(open("prepare.json"))["shard_count"]))}, separators=(",", ":")))')"
            echo "shard_count=$(uv run --no-sync python -c 'import json; print(json.load(open("prepare.json"))["shard_count"])')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
          if-no-files-found: error

  preflight:
    if: github.event_name != 'pull_request'
    needs: prepare
    name: mutation (detail preflight ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install pinned mutation tools
        run: >-
          uv venv --python 3.12 && uv pip install --quiet -e ".[all]"
          pytest==9.1.1 pytest-testmon==2.2.0 mutmut==2.5.1 whatthepatch==1.0.7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
      - name: Bounded mutation-detail preflight
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --preflight-manifest mutation-manifests/partition-${{ matrix.shard }}.json
          --json > mutation-preflight.json
      - name: Retain mutation preflight shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-preflight-${{ github.run_id }}-${{ matrix.shard }}
          path: mutation-preflight.json
          if-no-files-found: error

  preflight-aggregate:
    if: github.event_name != 'pull_request' && always()
    needs: [prepare, preflight]
    name: mutation (complete detail corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv venv --python 3.12 && uv pip install --quiet -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-preflight-${{ github.run_id }}-*
          path: mutation-preflight-shards
      - name: Aggregate complete mutation-detail corpus
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --aggregate-preflight mutation-preflight-shards
          --shard-count ${{ needs.prepare.outputs.shard_count }} --json > mutation-preflight.json
      - name: Retain complete mutation preflight
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-preflight-${{ github.run_id }}
          path: mutation-preflight.json
          if-no-files-found: error

  full-shard:
    if: github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.event.inputs.mode != 'preflight')
    needs: [prepare, preflight-aggregate]
    name: mutation (full shard ${{ matrix.shard }}, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.execution_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install pinned mutation tools
        run: >-
          uv venv --python 3.12 && uv pip install --quiet -e ".[all]"
          pytest==9.1.1 pytest-testmon==2.2.0 mutmut==2.5.1 whatthepatch==1.0.7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
      - name: Full mutation shard evidence
        run: >-
          uv run --no-sync fettle mutation run --all
          --manifest mutation-manifests/partition-${{ matrix.shard }}.json
          --json --output mutation-report.json
      - name: Retain mutation shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: mutation-report.json
          if-no-files-found: error

  aggregate:
    if: github.event_name != 'pull_request' && (github.event_name == 'schedule' || github.event.inputs.mode == 'calibration') && always()
    name: mutation (full aggregate, advisory)
    needs: [prepare, full-shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv venv --python 3.12 && uv pip install --quiet -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-shard-${{ github.run_id }}-*
          path: mutation-shards
      - name: Validate and aggregate full mutation evidence
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root . --aggregate mutation-shards
          --shard-count ${{ needs.prepare.outputs.shard_count }} --json > mutation-report.json
      - name: Mutation summary
        if: always() && hashFiles('mutation-report.json') != ''
        run: >-
          uv run --no-sync python -c "import json,os,pathlib; r=json.load(open('mutation-report.json'));
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('## Full mutation evidence\n\nStatus: **%s**  \nScore: **%s**  \nKilled: **%s**  \nSurvived: **%s**\n'
          % (r.get('status'), r.get('score'), r.get('killed', 0), r.get('survived', 0)))"
      - name: Retain full mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-evidence-${{ github.run_id }}
          path: mutation-report.json
          if-no-files-found: error
