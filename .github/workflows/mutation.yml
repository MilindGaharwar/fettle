          candidate/.venv/bin/python control/scripts/staged_preflight.py budget-gate --jobs jobs.json \
            ${{ github.event.inputs.mode == 'staged-preflight-recovery' && '--prior-jobs staged-plan/recovery-source-jobs.json --prior-run-id 37464324954 --prior-run-attempt 1' || '' }} \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --next-wave wave-3 --output wave-2-budget.json
      - name: Retain wave 2 validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-wave-2-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            wave-2-validation.json
            wave-2-budget.json
            jobs.json
          retention-days: 90
          if-no-files-found: error

  staged-wave-3:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'staged-preflight' || github.event.inputs.mode == 'staged-preflight-recovery')
    needs: [staged-prepare, staged-wave-2-gate]
    name: mutation (staged preflight wave 3 shard ${{ matrix.shard }})
