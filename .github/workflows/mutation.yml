          candidate/.venv/bin/python control/scripts/staged_preflight.py budget-gate --jobs jobs.json \
            --prior-jobs staged-plan/recovery-source-jobs.json --prior-run-id 37464324954 \
            --prior-run-attempt 1 \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --next-wave wave-2 --output recovery-budget.json
      - name: Retain recovery validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-recovery-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-budget.json
            jobs.json
          retention-days: 90
