          if-no-files-found: error

  staged-preflight-aggregate:
    if: github.event.inputs.mode == 'staged-preflight' || github.event.inputs.mode == 'staged-preflight-recovery'
    needs: [staged-prepare, staged-wave-3-gate]
    name: mutation (complete staged preflight corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0fc41fdfee13e09f4bda3dc5eee177030882aa36
      - name: Check out recovery orchestration
        if: github.event.inputs.mode == 'staged-preflight-recovery'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.14
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-staged-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-*-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: staged-reports
      - name: Aggregate complete frozen-candidate corpus
        run: |
          if [ "${{ github.event.inputs.mode }}" = "staged-preflight-recovery" ]; then
            cp -R staged-plan/recovery-source-reports/. staged-reports/
          fi
          uv run --no-sync python -m fettle.mutation_test --root . \
            --aggregate-preflight staged-reports --shard-count 256 --json > mutation-preflight.json
      - name: Record linked recovery origins
        if: github.event.inputs.mode == 'staged-preflight-recovery'
        run: >-
          .venv/bin/python control/scripts/staged_preflight.py recovery-record
          --plan staged-plan/staged-preflight-plan.json --reports staged-reports
          --aggregate mutation-preflight.json --output staged-preflight-recovery.json
      - name: Retain complete staged preflight
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-${{ github.run_id }}
          path: mutation-preflight.json
          retention-days: 90
          if-no-files-found: error
      - name: Retain linked recovery record
        if: github.event.inputs.mode == 'staged-preflight-recovery' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-preflight-recovery.json
