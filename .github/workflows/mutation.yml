    name: mutation (require stage 3 observer after admission 1)
    runs-on: ubuntu-latest
    permissions: &stage3_observer_liveness_permissions
      actions: write
      contents: read
    steps: &stage3_observer_liveness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Require live observer before next batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > observer-live-jobs.json
          state=$(python - <<'PY'
          from pathlib import Path
          from fettle.staged_preflight import load_api_jobs_pages
          jobs = load_api_jobs_pages(Path("observer-live-jobs.json"))
          matches = [job for job in jobs if job.get("name") == "mutation (monitor calibration budget)"]
          if len(matches) != 1 or not isinstance(matches[0].get("status"), str):
              raise SystemExit("monitor identity or state is malformed")
          print(matches[0]["status"])
          PY
          )
          if [[ "$state" != "in_progress" ]]; then
            exit 2
          fi

  calibration-stage-3-observer-watchdog:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage == '3'
    needs: calibration-stage-3-observer-ready
    name: mutation (watch stage 3 observer)
    runs-on: ubuntu-latest
    timeout-minutes: 335
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Cancel if observer is lost before valid completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          terminal_deadline=0
          while true; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > observer-watchdog-jobs.json
            state=$(python - <<'PY'
          from pathlib import Path
          from fettle.staged_preflight import load_api_jobs_pages
          jobs = load_api_jobs_pages(Path("observer-watchdog-jobs.json"))
          matches = [job for job in jobs if job.get("name") == "mutation (monitor calibration budget)"]
          if len(matches) != 1 or not isinstance(matches[0].get("status"), str):
              raise SystemExit("monitor identity or state is malformed")
          print(matches[0]["status"])
          PY
            )
            [[ "$state" == "in_progress" ]] && { sleep 60; continue; }
            if [[ "$state" == "completed" ]]; then
              (( terminal_deadline == 0 )) && terminal_deadline=$((SECONDS + 300))
              rm -rf observer-terminal
              if gh run download "$GITHUB_RUN_ID" --name "mutation-calibration-monitor-$GITHUB_RUN_ID" --dir observer-terminal 2>/dev/null; then
                if jq -e '.action == "complete" and .passed == true and (.terminal_shards | sort) == (.expected_shards | sort)' observer-terminal/calibration-monitor-lifecycle.json >/dev/null; then
                  exit 0
                fi
              fi
              (( SECONDS < terminal_deadline )) && { sleep 15; continue; }
            fi
            exit 2
          done

  calibration-stage-3-observer-live-3:
    if: always() && github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage == '3'
    needs: calibration-stage-3-admit-3
    name: mutation (require stage 3 observer after admission 2)
