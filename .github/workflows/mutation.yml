name: Mutation evidence

on:
  pull_request:
    paths:
      - "fettle/**/*.py"
      - "tests/**/*.py"
      - ".fettle.toml"
      - ".github/workflows/mutation.yml"
      - "requirements-mutation.in"
      - "requirements-mutation.txt"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Bounded P62 stage to execute"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - replay
          - calibration
      preflight_run_id:
        description: "Successful preflight run on this commit (required for replay/calibration)"
        required: false
        type: string
      calibration_id:
        description: "Unique logical calibration ID (required for calibration)"
        required: false
        type: string
      resume_run_id:
        description: "Prior run of this replay/calibration to resume"
        required: false
        type: string

concurrency:
  group: mutation-authoritative-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  changed-prepare:
    if: github.event_name == 'pull_request'
    name: mutation (prepare changed scope)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      shard_count: ${{ steps.prepare.outputs.shard_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv venv --python 3.12 && uv pip install --quiet --no-deps -e .
      - name: Prepare bounded changed-scope partitions
        id: prepare
        run: |
          uv run --no-sync python -m fettle.mutation_test --root . --base origin/${{ github.base_ref }} --prepare-changed-manifests mutation-changed-manifests --json > prepare-changed.json
          {
            echo "matrix=$(uv run --no-sync python -c 'import json; print(json.dumps(json.load(open("prepare-changed.json"))["matrix"], separators=(",", ":")))')"
            echo "shard_count=$(uv run --no-sync python -c 'import json; print(json.load(open("prepare-changed.json"))["shard_count"])')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.prepare.outputs.shard_count != '0'
        with:
          name: mutation-changed-manifests-${{ github.run_id }}
          path: mutation-changed-manifests
          if-no-files-found: error

  changed-shard:
    if: github.event_name == 'pull_request' && needs.changed-prepare.outputs.shard_count != '0'
    needs: changed-prepare
    name: mutation (changed shard ${{ matrix.shard }}, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changed-prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mutation-changed-manifests-${{ github.run_id }}
          path: mutation-changed-manifests
      - name: Initialize fail-closed timeout evidence
        run: >-
          uv run --no-sync python -m fettle.mutation_test
          --initialize-timeout-report mutation-report.json --timeout 1800
      - name: Bounded changed-scope mutation evidence
        timeout-minutes: 30
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --manifest mutation-changed-manifests/partition-${{ matrix.shard }}.json
          --manifest-scope mutation-changed-manifests
          --shard-count ${{ needs.changed-prepare.outputs.shard_count }} --timeout 1740
          --json > mutation-report.json
      - name: Retain changed-scope shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-changed-${{ github.run_id }}-${{ matrix.shard }}
          path: mutation-report.json
          if-no-files-found: error

  changed:
    if: github.event_name == 'pull_request' && always()
    needs: [changed-prepare, changed-shard]
    name: mutation (changed, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - name: Initialize fail-closed aggregate evidence
        run: uv run --no-sync python -m fettle.mutation_test --initialize-timeout-report mutation-report.json --timeout 1800
      - name: Reject incomplete changed-scope preparation
        if: needs.changed-prepare.result != 'success'
        run: exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.changed-prepare.outputs.shard_count != '0'
        with:
          pattern: mutation-changed-${{ github.run_id }}-*
          path: mutation-changed-shards
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.changed-prepare.outputs.shard_count != '0'
        with:
          name: mutation-changed-manifests-${{ github.run_id }}
          path: mutation-changed-manifests
      - name: Aggregate complete changed-scope evidence
        if: needs.changed-prepare.outputs.shard_count != '0'
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --aggregate mutation-changed-shards --aggregate-scope mutation-changed-manifests
          --base origin/${{ github.base_ref }}
          --shard-count ${{ needs.changed-prepare.outputs.shard_count }} --json > mutation-report.json
      - name: Record non-applicable changed scope
        if: needs.changed-prepare.outputs.shard_count == '0'
        run: >-
          uv run --no-sync fettle mutation run --changed --base origin/${{ github.base_ref }}
          --json --output mutation-report.json
      - name: Mutation summary
        if: always()
        run: >-
          uv run --no-sync python -m fettle.mutation_test --github-summary mutation-report.json
          --artifact-name mutation-evidence-${{ github.run_id }}
          --artifact-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-evidence-${{ github.run_id }}
          path: mutation-report.json
          if-no-files-found: error

  prepare:
    if: github.event_name != 'pull_request'
    name: mutation (prepare partitions)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix || steps.reuse.outputs.matrix }}
      execution_matrix: ${{ steps.prepare.outputs.execution_matrix || steps.reuse.outputs.execution_matrix }}
      shard_count: ${{ steps.prepare.outputs.shard_count || steps.reuse.outputs.shard_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv venv --python 3.12 && uv pip install --quiet -e .
      - name: Validate effective configuration
        run: uv run --no-sync fettle config --validate
      - name: Require retained preflight run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight'
        env:
          PREFLIGHT_RUN_ID: ${{ github.event.inputs.preflight_run_id }}
        run: test -n "$PREFLIGHT_RUN_ID" && test "$PREFLIGHT_RUN_ID" -eq "$PREFLIGHT_RUN_ID"
      - name: Require calibration identity
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'calibration'
        env:
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
        run: >-
          python -c 'import os,re,sys; value=os.environ["CALIBRATION_ID"];
          sys.exit(0 if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,63}", value) else 1)'
      - name: Download retained partition manifests
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mutation-manifests-${{ github.event.inputs.preflight_run_id }}
          path: mutation-manifests
          run-id: ${{ github.event.inputs.preflight_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download retained preflight aggregate
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mutation-preflight-${{ github.event.inputs.preflight_run_id }}
          path: retained-preflight
          run-id: ${{ github.event.inputs.preflight_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare digest-bound partitions
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'preflight'
        id: prepare
        run: |
          uv run --no-sync python -m fettle.mutation_test --root . --prepare-manifests mutation-manifests --json > prepare.json
          {
            echo "matrix=$(uv run --no-sync python -c 'import json; print(json.dumps(json.load(open("prepare.json"))["matrix"], separators=(",", ":")))')"
            echo "execution_matrix=$(MODE='${{ github.event.inputs.mode || 'preflight' }}' uv run --no-sync python -c 'import glob,json,os; manifests=[json.load(open(path)) for path in glob.glob("mutation-manifests/partition-*.json")]; archived=(("fettle/mutation_test.py",121,180),("fettle/mutation_test.py",1081,1140),("fettle/mutation_test.py",1141,1200),("fettle/environment.py",121,141),("fettle/policy_layers.py",1,60),("fettle/policy_layers.py",61,120),("fettle/security_review.py",1,60),("fettle/suppressions_v3.py",121,180)); replay=sorted({manifest["shard_index"] for manifest in manifests for item in manifest["ranges"] if any(item["file"] == file and item["start"] <= end and item["end"] >= start for file,start,end in archived)}); print(json.dumps({"shard": replay if os.environ["MODE"] == "replay" else list(range(json.load(open("prepare.json"))["shard_count"]))}, separators=(",", ":")))')"
            echo "shard_count=$(uv run --no-sync python -c 'import json; print(json.load(open("prepare.json"))["shard_count"])')"
          } >> "$GITHUB_OUTPUT"
      - name: Verify retained SHA-bound preflight
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight'
        id: reuse
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          uv run --no-sync python -c 'import glob,json,os; from fettle.mutation_test import load_partition_manifest; paths=glob.glob("mutation-manifests/partition-*.json"); manifests=[load_partition_manifest(__import__("pathlib").Path(path)) for path in paths]; aggregate=json.load(open("retained-preflight/mutation-preflight.json")); shard_count=len(manifests); assert shard_count and sorted(item["shard_index"] for item in manifests)==list(range(shard_count)), "retained manifests are incomplete"; assert all(item["revision"]==os.environ["GITHUB_SHA"] and item["shard_count"]==shard_count for item in manifests), "retained manifests do not match this commit and topology"; assert aggregate.get("status")=="completed" and aggregate.get("passed") is True, "retained preflight is not successful"; assert aggregate["revision"]==os.environ["GITHUB_SHA"], "retained preflight does not match this commit"; assert aggregate["shard_count"]==shard_count, "retained preflight shard count differs"; assert aggregate["generated"]==aggregate["canonicalized"], "retained preflight details do not reconcile"; assert aggregate["collisions"]==0, "retained preflight contains collisions"; archived=(("fettle/mutation_test.py",121,180),("fettle/mutation_test.py",1081,1140),("fettle/mutation_test.py",1141,1200),("fettle/environment.py",121,141),("fettle/policy_layers.py",1,60),("fettle/policy_layers.py",61,120),("fettle/security_review.py",1,60),("fettle/suppressions_v3.py",121,180)); replay=sorted({manifest["shard_index"] for manifest in manifests for item in manifest["ranges"] if any(item["file"]==file and item["start"]<=end and item["end"]>=start for file,start,end in archived)}); outputs={"matrix":{"shard":list(range(shard_count))},"execution_matrix":{"shard":replay if os.environ["MODE"]=="replay" else list(range(shard_count))},"shard_count":shard_count}; open("reuse-outputs.json","w").write(json.dumps(outputs))'
          {
            echo "matrix=$(uv run --no-sync python -c 'import json; print(json.dumps(json.load(open("reuse-outputs.json"))["matrix"], separators=(",", ":")))')"
            echo "execution_matrix=$(uv run --no-sync python -c 'import json; print(json.dumps(json.load(open("reuse-outputs.json"))["execution_matrix"], separators=(",", ":")))')"
            echo "shard_count=$(uv run --no-sync python -c 'import json; print(json.load(open("reuse-outputs.json"))["shard_count"])')"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
          if-no-files-found: error

  preflight:
    if: github.event_name == 'schedule' || github.event.inputs.mode == 'preflight'
    needs: prepare
    name: mutation (detail preflight ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
      - name: Bounded mutation-detail preflight
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --preflight-manifest mutation-manifests/partition-${{ matrix.shard }}.json
          --json > mutation-preflight.json
      - name: Retain mutation preflight shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-preflight-${{ github.run_id }}-${{ matrix.shard }}
          path: mutation-preflight.json
          if-no-files-found: error

  preflight-aggregate:
    if: (github.event_name == 'schedule' || github.event.inputs.mode == 'preflight') && always()
    needs: [prepare, preflight]
    name: mutation (complete detail corpus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv venv --python 3.12 && uv pip install --quiet -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-preflight-${{ github.run_id }}-*
          path: mutation-preflight-shards
      - name: Aggregate complete mutation-detail corpus
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --aggregate-preflight mutation-preflight-shards
          --shard-count ${{ needs.prepare.outputs.shard_count }} --json > mutation-preflight.json
      - name: Retain complete mutation preflight
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-preflight-${{ github.run_id }}
          path: mutation-preflight.json
          if-no-files-found: error

  full-shard:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'preflight'
    needs: prepare
    name: mutation (full shard ${{ matrix.shard }}, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.execution_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
      - name: Download retained preflight aggregate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mutation-preflight-${{ github.event.inputs.preflight_run_id }}
          path: retained-preflight
          run-id: ${{ github.event.inputs.preflight_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download same-execution checkpoints
        if: github.event.inputs.resume_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-checkpoint-${{ github.event.inputs.mode == 'replay' && format('replay-{0}', github.event.inputs.resume_run_id) || github.event.inputs.calibration_id }}-${{ matrix.shard }}
          path: resume-checkpoints
          run-id: ${{ github.event.inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Full mutation shard evidence
        if: github.event.inputs.mode == 'replay'
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --resume-manifest mutation-manifests/partition-${{ matrix.shard }}.json
          --retained-preflight retained-preflight/mutation-preflight.json
          --calibration-id "replay-${{ github.event.inputs.resume_run_id || github.run_id }}"
          --checkpoint-output mutation-checkpoint.json
          ${{ github.event.inputs.resume_run_id != '' && '--resume-checkpoints resume-checkpoints' || '' }}
          --timeout 1740 --json > mutation-report.json
      - name: Resumable calibration shard evidence
        if: github.event.inputs.mode == 'calibration'
        timeout-minutes: 30
        env:
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
          HAS_RESUME: ${{ github.event.inputs.resume_run_id != '' }}
        run: |
          args=(
            --root .
            --resume-manifest mutation-manifests/partition-${{ matrix.shard }}.json
            --retained-preflight retained-preflight/mutation-preflight.json
            --calibration-id "$CALIBRATION_ID"
            --checkpoint-output mutation-checkpoint.json
            --timeout 1740 --json
          )
          if [[ "$HAS_RESUME" == "true" ]]; then
            args+=(--resume-checkpoints resume-checkpoints)
          fi
          uv run --no-sync python -m fettle.mutation_test "${args[@]}" > mutation-report.json
      - name: Retain resumable execution checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-checkpoint-${{ github.event.inputs.mode == 'replay' && format('replay-{0}', github.event.inputs.resume_run_id || github.run_id) || github.event.inputs.calibration_id }}-${{ matrix.shard }}
          path: mutation-checkpoint.json
          if-no-files-found: error
      - name: Retain mutation shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: mutation-report.json
          if-no-files-found: error

  aggregate:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'calibration' && always()
    name: mutation (full aggregate, advisory)
    needs: [prepare, full-shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv venv --python 3.12 && uv pip install --quiet -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-shard-${{ github.run_id }}-*
          path: mutation-shards
      - name: Validate and aggregate full mutation evidence
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root . --aggregate mutation-shards
          --shard-count ${{ needs.prepare.outputs.shard_count }} --json > mutation-report.json
      - name: Mutation summary
        if: always() && hashFiles('mutation-report.json') != ''
        run: >-
          uv run --no-sync python -c "import json,os,pathlib; r=json.load(open('mutation-report.json'));
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('## Full mutation evidence\n\nStatus: **%s**  \nScore: **%s**  \nKilled: **%s**  \nSurvived: **%s**\n'
          % (r.get('status'), r.get('score'), r.get('killed', 0), r.get('survived', 0)))"
      - name: Retain full mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-evidence-${{ github.run_id }}
          path: mutation-report.json
          if-no-files-found: error
