  calibration-accounting:
    if: always() && github.event.inputs.mode == 'calibration'
    needs: [prepare, full-shard, calibration-monitor, calibration-stage-3-batch-7]
    name: mutation (calibration accounting)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Download stage 3 admission accounting floors
        if: github.event.inputs.calibration_stage == '3'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-calibration-admission-${{ github.run_id }}-*
          path: admission-accounting
      - name: Download terminal observer evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-calibration-monitor-${{ github.run_id }}
          path: terminal-observer
      - name: Collect cumulative job accounting
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ github.event.inputs.resume_run_id }}
          PRIOR_RUN_ID: ${{ github.event.inputs.calibration_stage == '2' && github.event.inputs.stage_1_run_id || github.event.inputs.stage_2_run_id }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
          RUNNER_MINUTE_CEILING: ${{ github.event.inputs.runner_minute_ceiling }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs-current.json
          base_run_id="${RESUME_RUN_ID:-$PRIOR_RUN_ID}"
          if [[ -n "$base_run_id" ]]; then
            gh run download "$base_run_id" --name "mutation-calibration-accounting-$base_run_id" --dir prior-accounting
          fi
          python - <<'PY'
          import json, os, pathlib, sys
          from datetime import datetime, timezone
          from fettle.staged_preflight import (
              account_runner_minutes, bind_calibration_observer_evidence,
              build_calibration_terminal_accounting,
              retain_historical_accounting_floor,
          )
          current = account_runner_minutes(
              pathlib.Path("jobs-current.json"), datetime.now(timezone.utc),
              expected_run_id=os.environ["GITHUB_RUN_ID"],
              expected_run_attempt=os.environ["GITHUB_RUN_ATTEMPT"], job_timeout_minutes=35,
          )
          lifecycle = json.loads(pathlib.Path("terminal-observer/calibration-monitor-lifecycle.json").read_text())
          monitor = json.loads(pathlib.Path("terminal-observer/calibration-monitor-budget.json").read_text())
          if (
              lifecycle.get("action") != "complete" or lifecycle.get("passed") is not True
              or sorted(lifecycle.get("terminal_shards", []))
                 != sorted(lifecycle.get("expected_shards", []))
              or monitor.get("passed") is not True
              or monitor.get("stage") != os.environ["CALIBRATION_STAGE"]
              or monitor.get("calibration_id") != os.environ["CALIBRATION_ID"]
              or monitor.get("ceiling") != int(os.environ["RUNNER_MINUTE_CEILING"])
              or monitor.get("expected_run_id") != os.environ["GITHUB_RUN_ID"]
              or monitor.get("expected_run_attempt") != os.environ["GITHUB_RUN_ATTEMPT"]
          ):
              raise ValueError("terminal observer evidence is incomplete or incompatible")
          admission_floors = sorted(pathlib.Path("admission-accounting").rglob("calibration-admission-current.json"))
          if os.environ["CALIBRATION_STAGE"] == "3":
              if len(admission_floors) != 6:
                  raise ValueError("stage 3 admission accounting floors are missing")
              admitted_batches = []
              for floor in admission_floors:
                  decision = json.loads(floor.with_name("calibration-admission.json").read_text())
                  if (
                      decision.get("passed") is not True or decision.get("stage") != "3"
                      or decision.get("calibration_id") != os.environ["CALIBRATION_ID"]
                      or decision.get("expected_run_id") != os.environ["GITHUB_RUN_ID"]
                      or decision.get("expected_run_attempt") != os.environ["GITHUB_RUN_ATTEMPT"]
                      or not isinstance(decision.get("admitted_batches"), int)
                  ):
                      raise ValueError("stage 3 admission accounting provenance is incompatible")
                  admitted_batches.append(decision["admitted_batches"])
              if sorted(admitted_batches) != list(range(1, 7)):
                  raise ValueError("stage 3 admission accounting sequence is incomplete")
              current = retain_historical_accounting_floor(current, admission_floors)
          prior = pathlib.Path("prior-accounting/calibration-accounting.json")
          retained = None
          base_run_id = ""
          expected_stage = ""
          if prior.exists():
              retained = json.loads(prior.read_text())
              base_run_id = os.environ["RESUME_RUN_ID"] or os.environ["PRIOR_RUN_ID"]
              expected_stage = (os.environ["CALIBRATION_STAGE"] if os.environ["RESUME_RUN_ID"]
                                else str(int(os.environ["CALIBRATION_STAGE"]) - 1))
          result = build_calibration_terminal_accounting(
              current, monitor, lifecycle, stage=os.environ["CALIBRATION_STAGE"],
              calibration_id=os.environ["CALIBRATION_ID"],
              ceiling=int(os.environ["RUNNER_MINUTE_CEILING"]), support_bounds={
              "mutation (calibration accounting)": 15,
              "mutation (assemble evidence)": 30,
              "mutation evidence": 10,
              }, predecessor=retained, predecessor_run_id=base_run_id,
              predecessor_stage=expected_stage,
          )
          result = bind_calibration_observer_evidence(
              result, lifecycle, budget_sha256=__import__("hashlib").sha256(
                  pathlib.Path("terminal-observer/calibration-monitor-budget.json").read_bytes()
              ).hexdigest(),
          )
          assert result["billing_authority"] is False
          pathlib.Path("calibration-accounting.json").write_text(json.dumps(result, indent=2)+"\n")
          sys.exit(0 if result["passed"] else 2)
          PY
      - name: Preserve typed terminal accounting on containment
        if: always()
        env:
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
          RUNNER_MINUTE_CEILING: ${{ github.event.inputs.runner_minute_ceiling }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path("calibration-accounting.json")
          if output.is_file():
              raise SystemExit(0)
          evidence = {
              "jobs_current": Path("jobs-current.json"),
              "monitor_budget": Path("terminal-observer/calibration-monitor-budget.json"),
              "monitor_lifecycle": Path("terminal-observer/calibration-monitor-lifecycle.json"),
          }
          if os.environ["CALIBRATION_STAGE"] != "1":
              evidence["prior_accounting"] = Path("prior-accounting/calibration-accounting.json")
          digests = {
              name: hashlib.sha256(path.read_bytes()).hexdigest()
              for name, path in evidence.items() if path.is_file()
          }
          floor = None
          historical_floor = None
          reason = "terminal accounting prerequisites were incomplete or incompatible"
          if evidence["jobs_current"].is_file():
              try:
                  from fettle.staged_preflight import account_runner_minutes
                  current = account_runner_minutes(
                      evidence["jobs_current"], datetime.now(timezone.utc),
                      expected_run_id=os.environ["GITHUB_RUN_ID"],
                      expected_run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],
                      job_timeout_minutes=35,
                  )
                  floor = current["estimated_runner_minutes"]
              except Exception as exc:
                  reason = f"{type(exc).__name__}: {exc}"
          if evidence.get("prior_accounting", Path()).is_file():
              try:
                  from fettle.staged_preflight import validate_calibration_accounting
                  prior = json.loads(evidence["prior_accounting"].read_text())
                  _lineage, historical_floor = validate_calibration_accounting(prior)
              except Exception as exc:
                  reason = f"{type(exc).__name__}: {exc}"
          result = {
              "schema_version": "1", "kind": "calibration_budget_decision",
              "billing_authority": False, "passed": False,
              "terminal_accounting_status": "indeterminate",
              "stage": os.environ["CALIBRATION_STAGE"],
              "calibration_id": os.environ["CALIBRATION_ID"],
              "ceiling": int(os.environ["RUNNER_MINUTE_CEILING"]),
              "expected_run_id": os.environ["GITHUB_RUN_ID"],
              "expected_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "observed_runner_minutes_floor": floor,
              "historical_charged_runner_minutes_floor": historical_floor,
              "containment_reason": reason,
              "evidence_sha256": digests,
              "missing_evidence": sorted(set(evidence) - set(digests)),
          }
          output.write_text(json.dumps(result, indent=2) + "\n")
          PY
      - name: Retain calibration accounting
        id: retain-accounting
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-calibration-accounting-${{ github.run_id }}
          path: |
            calibration-accounting.json
            jobs-*.json
            terminal-observer
          retention-days: 90
          if-no-files-found: error
      - name: Preserve exact accounting bytes in the job log
        id: retain-accounting-log
        if: always() && steps.retain-accounting.outcome != 'success'
        env:
          PRIMARY_UPLOAD_OUTCOME: ${{ steps.retain-accounting.outcome }}
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from fettle.staged_preflight import (
              build_calibration_accounting_log_envelope,
              calibration_accounting_log_records,
          )
          payload = Path("calibration-accounting.json").read_bytes()
          envelope = build_calibration_accounting_log_envelope(
              payload, repository=os.environ["GITHUB_REPOSITORY"],
              candidate_sha=os.environ["GITHUB_SHA"],
              workflow_ref=os.environ["GITHUB_WORKFLOW_REF"],
              workflow_sha=os.environ["GITHUB_WORKFLOW_SHA"],
              run_id=os.environ["GITHUB_RUN_ID"],
              run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],
              calibration_id=os.environ["CALIBRATION_ID"],
              stage=os.environ["CALIBRATION_STAGE"],
              primary_upload_outcome=os.environ["PRIMARY_UPLOAD_OUTCOME"],
          )
          for record in calibration_accounting_log_records(envelope):
              print(record)
          PY
      - name: Keep primary accounting publication failure visible
        if: always()
        env:
          PRIMARY_UPLOAD_OUTCOME: ${{ steps.retain-accounting.outcome }}
          LOG_FALLBACK_OUTCOME: ${{ steps.retain-accounting-log.outcome }}
        run: |
          if [[ "$PRIMARY_UPLOAD_OUTCOME" != success ]]; then
            printf 'primary accounting publication failed; log fallback=%s\n' "$LOG_FALLBACK_OUTCOME"
            exit 2
          fi

  aggregate:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'retention-probe' && github.event.inputs.mode != 'readback-probe' && github.event.inputs.mode != 'staged-preflight' && always()
    name: mutation (assemble evidence)
    needs: [prepare, full-shard, calibration-stage-3-batch-7, calibration-accounting]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
          uv run --no-sync python -c 'import platform,sys; sys.exit(0 if platform.python_implementation()=="CPython" and platform.python_version()=="3.12.13" else 2)'
      - name: Download primary calibration accounting
        id: download-accounting
        if: github.event.inputs.mode == 'calibration'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-calibration-accounting-${{ github.run_id }}
          path: retained-accounting
      - name: Recover failed primary accounting publication from exact job log
        if: github.event.inputs.mode == 'calibration' && steps.download-accounting.outcome != 'success'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
        run: |
          set -u
          status=accounting-readback.json
          unavailable() {
            python - "$1" <<'PY'
          import json, sys
          from pathlib import Path
          Path("accounting-readback.json").write_text(json.dumps({
              "schema_version": "1", "kind": "calibration_accounting_readback",
              "passed": False, "available": False, "authoritative_predecessor": False,
              "reason": sys.argv[1],
          }, sort_keys=True) + "\n")
          PY
            cat "$status"
            exit 2
          }
          if ! gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > accounting-attempt-jobs.json; then
            unavailable "exact-attempt accounting job metadata is unavailable"
          fi
          if ! python - <<'PY' > accounting-job-id.txt
          import json, os, sys
          pages = json.load(open("accounting-attempt-jobs.json"))
          jobs = [job for page in pages for job in page["jobs"]
                  if job.get("name") == "mutation (calibration accounting)"]
          if len(jobs) != 1:
              raise SystemExit(2)
          job = jobs[0]
          step_list = job.get("steps", [])
          steps = {step.get("name"): step for step in step_list}
          if len(steps) != len(step_list):
              raise SystemExit(2)
          generated = any(
              steps.get(name, {}).get("conclusion") == "success"
              for name in (
                  "Collect cumulative job accounting",
                  "Preserve typed terminal accounting on containment",
              )
          )
          valid = (
              str(job.get("run_id")) == os.environ["GITHUB_RUN_ID"]
              and str(job.get("run_attempt")) == os.environ["GITHUB_RUN_ATTEMPT"]
              and job.get("head_sha") == os.environ["GITHUB_SHA"]
              and job.get("status") == "completed" and job.get("conclusion") == "failure"
              and generated
              and steps.get("Preserve exact accounting bytes in the job log", {}).get("conclusion") == "success"
              and steps.get("Keep primary accounting publication failure visible", {}).get("conclusion") == "failure"
          )
          if not valid or not isinstance(job.get("id"), int):
              raise SystemExit(2)
          print(job["id"])
          PY
          then
            unavailable "exact accounting job provenance or step outcomes are incompatible"
          fi
          job_id=$(cat accounting-job-id.txt)
          downloaded=false
          export GH_HTTP_TIMEOUT=30
          for attempt in 1 2 3; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > accounting-job.log; then
              downloaded=true
              break
            fi
            sleep "$attempt"
          done
          [[ "$downloaded" == true ]] || unavailable "accounting job log is unavailable after bounded retries"
          if ! python - <<'PY'
          import json, os
          from pathlib import Path
          from fettle.staged_preflight import recover_calibration_accounting_log_envelope
          payload = recover_calibration_accounting_log_envelope(
              Path("accounting-job.log").read_bytes(),
              repository=os.environ["GITHUB_REPOSITORY"],
              candidate_sha=os.environ["GITHUB_SHA"],
              workflow_ref=os.environ["GITHUB_WORKFLOW_REF"],
              workflow_sha=os.environ["GITHUB_WORKFLOW_SHA"],
              run_id=os.environ["GITHUB_RUN_ID"],
              run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],
              calibration_id=os.environ["CALIBRATION_ID"],
              stage=os.environ["CALIBRATION_STAGE"],
          )
          retained = Path("retained-accounting")
          retained.mkdir()
          retained.joinpath("calibration-accounting.json").write_bytes(payload)
          Path("accounting-readback.json").write_text(json.dumps({
              "schema_version": "1", "kind": "calibration_accounting_readback",
              "passed": False, "available": True, "channel": "job_log",
              "authoritative_predecessor": False,
              "payload_sha256": __import__("hashlib").sha256(payload).hexdigest(),
          }, sort_keys=True) + "\n")
          PY
          then
            unavailable "accounting job log record is malformed, conflicting, or inapplicable"
          fi
          cat "$status"
      - name: Record primary accounting readback
        if: github.event.inputs.mode == 'calibration' && steps.download-accounting.outcome == 'success'
        run: >-
          printf '%s\n' '{"schema_version":"1","kind":"calibration_accounting_readback","passed":true,"available":true,"channel":"artifact","authoritative_predecessor":true}'
          > accounting-readback.json
      - name: Require successful bounded accounting before publication
        if: github.event.inputs.mode == 'calibration'
        env:
          ACCOUNTING_RESULT: ${{ needs.calibration-accounting.result }}
          PRIMARY_READBACK: ${{ steps.download-accounting.outcome }}
        run: test "$ACCOUNTING_RESULT" = success && test "$PRIMARY_READBACK" = success
      - name: Bind authoritative check to exact candidate
        if: github.event.inputs.mode != 'finalize'
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
        run: >-
          python -c 'import os,re,sys; candidate=os.environ["CANDIDATE_SHA"];
          sys.exit(0 if re.fullmatch(r"[0-9a-f]{40}", candidate) and candidate == os.environ["GITHUB_SHA"] else 1)'
      - name: Prove evidence-only finalization head
        if: github.event.inputs.mode == 'finalize'
        env:
          EXECUTABLE_CANDIDATE_SHA: ${{ github.event.inputs.executable_candidate_sha }}
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
          CALIBRATION_RUN_ID: ${{ github.event.inputs.calibration_run_id }}
        run: |
          python - <<'PY'
          import os, re, subprocess, sys
          executable = os.environ["EXECUTABLE_CANDIDATE_SHA"]
          head = os.environ["CANDIDATE_SHA"]
          run_id = os.environ["CALIBRATION_RUN_ID"]
          allowed = {
              "docs/audit-hardening-worklog.md",
              "docs/completion/audit-hardening.json",
              "docs/completion/evidence/audit-hardening.json",
              "docs/completion/evidence/external/audit-hardening/run-05-locator.json",
              "docs/final-candidate-readiness.md",
          }
          if not (re.fullmatch(r"[0-9a-f]{40}", executable)
                  and head == os.environ["GITHUB_SHA"]
                  and re.fullmatch(r"[1-9][0-9]*", run_id)):
              sys.exit(2)
          subprocess.run(["git", "merge-base", "--is-ancestor", executable, head], check=True)
          raw = subprocess.check_output(
              ["git", "diff", "--raw", "--no-abbrev", executable, head], text=True,
          ).splitlines()
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--no-renames", executable, head], text=True,
          ).splitlines()
          if not changed or set(changed) - allowed or len(changed) != len(set(changed)):
              sys.exit(2)
          for line in raw:
              metadata, path = line.split("\t", 1)
              fields = metadata.split()
              if path not in allowed or fields[0] != ":100644" or fields[1] != "100644" or fields[-1] != "M":
                  sys.exit(2)
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event.inputs.mode == 'calibration'
        with:
          pattern: mutation-shard-${{ github.run_id }}-*
          path: calibration-shards/current
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.resume_run_id != ''
        with:
          name: calibration-resume-bundle-${{ github.run_id }}
          path: calibration-resume
      - name: Download stage 1 mutation evidence
        if: github.event.inputs.mode == 'calibration' && (github.event.inputs.calibration_stage == '2' || github.event.inputs.calibration_stage == '3')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-calibration-stage-${{ github.event.inputs.stage_1_run_id }}
          path: calibration-shards/stage-1
          run-id: ${{ github.event.inputs.stage_1_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download stage 2 mutation evidence
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage == '3'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-calibration-stage-${{ github.event.inputs.stage_2_run_id }}
          path: calibration-shards/stage-2
          run-id: ${{ github.event.inputs.stage_2_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download current-run partition manifests
        if: github.event.inputs.mode == 'calibration'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: mutation-manifests
      - name: Download retained preflight aggregate
        if: github.event.inputs.mode == 'calibration'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-${{ github.event.inputs.preflight_run_id }}
          path: retained-preflight
          run-id: ${{ github.event.inputs.preflight_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate and aggregate full mutation evidence
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage == '3'
        env:
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
        run: |
          if [[ -d calibration-resume/resume-reports ]]; then
            cp -R calibration-resume/resume-reports/. calibration-shards/resume/
          fi
          uv run --no-sync python - <<'PY'
          import json, os
          from pathlib import Path
          from fettle.mutation_test import (
              build_calibration_representation_inventory,
              load_mutation_report_candidates,
              read_calibration_representation_inventory,
              select_shard_subset_attempts,
          )
          from fettle.staged_preflight import WAVES
          selected = []
          for stage in ("stage-1", "stage-2"):
              inventories = sorted(Path("calibration-shards", stage).rglob("representation-inventory.json"))
              if len(inventories) != 1:
                  raise ValueError(f"{stage} requires exactly one validated representation inventory")
              selected.extend(read_calibration_representation_inventory(inventories[0]))
          candidates, quarantined = load_mutation_report_candidates(Path("calibration-shards"))
          stage_3_attempts = [
              report for report in candidates
              if report.get("shard_index") in WAVES["wave-3"]
          ]
          stage_3 = select_shard_subset_attempts(stage_3_attempts, 256, WAVES["wave-3"])
          selected.extend(stage_3)
          if sorted(report.get("shard_index") for report in selected) != list(range(256)):
              raise ValueError("validated calibration representations do not cover 256 shards")
          output = Path("validated-calibration-reports")
          output.mkdir()
          for report in selected:
              target = output / str(report["shard_index"])
              target.mkdir()
              retained = {key: value for key, value in report.items() if not key.startswith("_retained_")}
              target.joinpath("mutation-report.json").write_text(json.dumps(retained, indent=2) + "\n")
          copied, copied_quarantine = load_mutation_report_candidates(output)
          assert not copied_quarantine
          inventory = build_calibration_representation_inventory(
              output, copied, list(range(256)), quarantined,
          )
          output.joinpath("representation-inventory.json").write_text(
              json.dumps(inventory, indent=2) + "\n"
          )
          readback = read_calibration_representation_inventory(
              output / "representation-inventory.json"
          )
          if len(readback) != 256:
              raise ValueError("validated calibration representation readback is incomplete")
          PY
          uv run --no-sync python -m fettle.mutation_test --root . --aggregate validated-calibration-reports \
            --aggregate-scope mutation-manifests \
            --aggregate-preflight-evidence retained-preflight/mutation-preflight.json \
            --calibration-id "$CALIBRATION_ID" \
            --shard-count ${{ needs.prepare.outputs.shard_count }} --json > mutation-report.json
      - name: Consolidate current calibration stage reports
        if: github.event.inputs.mode == 'calibration'
        env:
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
        run: |
          if [[ -d calibration-resume/resume-reports ]]; then
            cp -R calibration-resume/resume-reports/. calibration-shards/resume/
          fi
          uv run --no-sync python - <<'PY'
          import json, os
          from pathlib import Path
          from fettle.mutation_test import select_shard_subset_attempts
          from fettle.staged_preflight import WAVES
          expected = WAVES["wave-" + os.environ["CALIBRATION_STAGE"]]
          from fettle.mutation_test import (
              build_calibration_representation_inventory,
              load_mutation_report_candidates,
          )
          reports, quarantined = load_mutation_report_candidates(Path("calibration-shards"))
          attempts = [report for report in reports if report.get("shard_index") in expected]
          selected = select_shard_subset_attempts(attempts, 256, expected)
          output = Path("calibration-stage-reports")
          output.mkdir()
          for report in selected:
              target = output / str(report["shard_index"])
              target.mkdir()
              retained = {key: value for key, value in report.items() if not key.startswith("_retained_")}
              target.joinpath("mutation-report.json").write_text(json.dumps(retained, indent=2) + "\n")
          copied, copied_quarantine = load_mutation_report_candidates(output)
          assert not copied_quarantine
          inventory = build_calibration_representation_inventory(
              output, copied, expected, quarantined,
          )
          output.joinpath("representation-inventory.json").write_text(
              json.dumps(inventory, indent=2) + "\n"
          )
          PY
      - name: Retain cumulative calibration stage
        if: github.event.inputs.mode == 'calibration'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-calibration-stage-${{ github.run_id }}
          path: calibration-stage-reports
          if-no-files-found: error
          retention-days: 90
      - name: Record non-qualifying authoritative probe
        if: github.event.inputs.mode != 'calibration' && github.event.inputs.mode != 'finalize'
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
          MODE: ${{ github.event.inputs.mode }}
        run: >-
          python -c 'import json,os; mode=os.environ["MODE"];
          json.dump({"status":"unknown","message":mode+" does not constitute mutation qualification","revision":os.environ["CANDIDATE_SHA"],"score":None,"passed":False,"qualification_executed":False},open("mutation-report.json","w"),separators=(",",":"))'
      - name: Record incomplete calibration stage
        if: github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage != '3'
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
        run: >-
          python -c 'import json,os;
          json.dump({"status":"unknown","message":"calibration stage "+os.environ["CALIBRATION_STAGE"]+" retained; all three stages are required","revision":os.environ["CANDIDATE_SHA"],"score":None,"passed":False,"qualification_executed":False},open("mutation-report.json","w"),separators=(",",":"))'
      - name: Bind successful accounting readback to calibration evidence
        if: github.event.inputs.mode == 'calibration'
        env:
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
          CALIBRATION_STAGE: ${{ github.event.inputs.calibration_stage }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          report_path = Path("mutation-report.json")
          accounting_path = Path("retained-accounting/calibration-accounting.json")
          report = json.loads(report_path.read_text())
          accounting = json.loads(accounting_path.read_text())
          if (
              accounting.get("passed") is not True
              or accounting.get("stage") != os.environ["CALIBRATION_STAGE"]
              or accounting.get("calibration_id") != os.environ["CALIBRATION_ID"]
              or not isinstance(accounting.get("observer_evidence"), dict)
          ):
              raise ValueError("calibration accounting readback is incompatible")
          report["accounting_sha256"] = hashlib.sha256(accounting_path.read_bytes()).hexdigest()
          report_path.write_text(json.dumps(report, indent=2) + "\n")
          PY
      - name: Download frozen-candidate calibration
        if: github.event.inputs.mode == 'finalize'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-evidence-${{ github.event.inputs.calibration_run_id }}
          path: frozen-calibration
          run-id: ${{ github.event.inputs.calibration_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download frozen-candidate accounting
        if: github.event.inputs.mode == 'finalize'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-calibration-accounting-${{ github.event.inputs.calibration_run_id }}
          path: frozen-accounting
          run-id: ${{ github.event.inputs.calibration_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate frozen-candidate calibration
        if: github.event.inputs.mode == 'finalize'
        env:
          EXECUTABLE_CANDIDATE_SHA: ${{ github.event.inputs.executable_candidate_sha }}
          CALIBRATION_ID: ${{ github.event.inputs.calibration_id }}
        run: >-
          python -c 'import hashlib,json,os,pathlib,shutil,sys; path=pathlib.Path("frozen-calibration/mutation-report.json");
          checksum=pathlib.Path("frozen-calibration/mutation-report.sha256").read_text().split()[0];
          report=json.loads(path.read_text()); accounting=json.load(open("frozen-accounting/calibration-accounting.json"));
          valid=report.get("status")=="completed" and report.get("passed") is True
          and report.get("revision")==os.environ["EXECUTABLE_CANDIDATE_SHA"]
          and report.get("calibration_id")==os.environ["CALIBRATION_ID"]
          and accounting.get("stage")=="3" and accounting.get("passed") is True
          and accounting.get("calibration_id")==os.environ["CALIBRATION_ID"]
          and hashlib.sha256(path.read_bytes()).hexdigest()==checksum;
          shutil.copyfile(path,"mutation-report.json"); sys.exit(0 if valid else 2)'
      - name: Mutation summary
        if: always() && hashFiles('mutation-report.json') != ''
        run: >-
          uv run --no-sync python -c "import json,os,pathlib; r=json.load(open('mutation-report.json'));
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('## Full mutation evidence\n\nStatus: **%s**  \nScore: **%s**  \nKilled: **%s**  \nSurvived: **%s**\n'
          % (r.get('status'), r.get('score'), r.get('killed', 0), r.get('survived', 0)))"
      - name: Record evidence checksum
        if: always() && hashFiles('mutation-report.json') != ''
        run: shasum -a 256 mutation-report.json > mutation-report.sha256
      - name: Retain full mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-evidence-${{ github.run_id }}
          path: |
            mutation-report.json
            mutation-report.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Enforce mutation evidence result
        if: always() && !(github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage != '3')
        run: >-
          uv run --no-sync python -c "import json,sys;
          report=json.load(open('mutation-report.json'));
          sys.exit(0 if report.get('passed') is True else 2)"

  evidence-readback:
    if: >-
      always() && github.event_name == 'workflow_dispatch'
      && !(github.event.inputs.mode == 'calibration' && github.event.inputs.calibration_stage != '3')
      && github.event.inputs.mode != 'staged-preflight'
      && github.event.inputs.mode != 'retention-probe'
      && github.event.inputs.mode != 'readback-probe'
    needs: aggregate
    name: mutation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-evidence-${{ github.run_id }}
          path: retained-evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event.inputs.mode == 'calibration'
        with:
          name: mutation-calibration-accounting-${{ github.run_id }}
          path: retained-accounting
      - name: Independently read back authoritative evidence
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, sys
          report_path = pathlib.Path("retained-evidence/mutation-report.json")
          checksum_path = pathlib.Path("retained-evidence/mutation-report.sha256")
          try:
              report = json.loads(report_path.read_text())
              expected = checksum_path.read_text().split()[0]
              actual = hashlib.sha256(report_path.read_bytes()).hexdigest()
          except (OSError, UnicodeError, ValueError, json.JSONDecodeError, IndexError):
              sys.exit(2)
          valid = expected == actual and report.get("status") == "completed" and report.get("passed") is True
          if os.environ["MODE"] == "calibration":
              accounting_path = pathlib.Path("retained-accounting/calibration-accounting.json")
              accounting = json.loads(accounting_path.read_text())
              valid = (
                  valid and accounting.get("passed") is True
                  and report.get("accounting_sha256")
                      == hashlib.sha256(accounting_path.read_bytes()).hexdigest()
              )
          sys.exit(0 if valid else 2)
          PY
