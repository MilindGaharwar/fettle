          --reports staged-reports --wave wave-3 --repository "$GITHUB_REPOSITORY"
          --workflow "$GITHUB_WORKFLOW" --workflow-ref "$GITHUB_WORKFLOW_REF"
          --orchestration-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output wave-3-validation.json
      - name: Enforce aggregate operational budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs.json
          candidate/.venv/bin/python control/scripts/staged_preflight.py budget-gate --jobs jobs.json \
            ${{ github.event.inputs.mode == 'staged-preflight-recovery' && '--prior-jobs staged-plan/recovery-source-jobs.json --prior-run-id 37464324954 --prior-run-attempt 1' || '' }} \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --next-wave aggregate --output wave-3-budget.json
      - name: Retain wave 3 validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-wave-3-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
