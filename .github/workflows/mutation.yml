  staged-wave-2:
    if: >-
      always() && github.event_name == 'workflow_dispatch'
      && ((github.event.inputs.mode == 'staged-preflight-recovery' && needs.staged-recovery-gate.result == 'success')
      || (github.event.inputs.mode == 'staged-preflight' && needs.staged-wave-1-gate.result == 'success'))
