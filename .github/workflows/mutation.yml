          if-no-files-found: error

  staged-preflight-evidence:
    if: always() && (github.event.inputs.mode == 'staged-preflight' || github.event.inputs.mode == 'staged-preflight-recovery')
    needs: [staged-preflight-aggregate]
    name: mutation staged preflight evidence
    runs-on: ubuntu-latest
