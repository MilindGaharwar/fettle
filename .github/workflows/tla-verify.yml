name: TLA+ Verification

on:
  push:
    paths:
      - 'specs/tla/**'
      - 'fettle/policy_capsule.py'
      - 'fettle/capsule_guard.py'
      - 'fettle/work_items.py'
      - 'fettle/topology.py'
      - 'fettle/worktrees.py'
  pull_request:
    paths:
      - 'specs/tla/**'
      - 'fettle/policy_capsule.py'
      - 'fettle/capsule_guard.py'
      - 'fettle/work_items.py'
      - 'fettle/topology.py'
      - 'fettle/worktrees.py'

jobs:
  tla-model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download tla2tools.jar
        run: |
          curl -fsSL -o specs/tla/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "dbcc75552f21978a4846688b8e23be1a6b6c0b3fcee35d78fec2df167958ec94  specs/tla/tla2tools.jar" | sha256sum --check

      - name: Run TLA+ model checker
        run: ./specs/tla/run-all.sh

      - name: Upload TLC logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tlc-logs
          path: /tmp/tlc_*.log
