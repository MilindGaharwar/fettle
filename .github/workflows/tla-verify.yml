name: TLA+ Verification

on:
  push:
    paths:
      - 'specs/tla/**'
      - 'fettle/policy_capsule.py'
      - 'fettle/capsule_guard.py'
      - 'fettle/work_items.py'
      - 'fettle/topology.py'
      - 'fettle/worktrees.py'
  pull_request:
    paths:
      - 'specs/tla/**'
      - 'fettle/policy_capsule.py'
      - 'fettle/capsule_guard.py'
      - 'fettle/work_items.py'
      - 'fettle/topology.py'
      - 'fettle/worktrees.py'

jobs:
  tla-model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download tla2tools.jar
        run: |
          curl -fsSL -o specs/tla/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          # Computed from the upstream v1.7.4 asset on 2026-11-17.
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  specs/tla/tla2tools.jar" | sha256sum --check

      - name: Run TLA+ model checker
        run: ./specs/tla/run-all.sh

      - name: Upload TLC logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tlc-logs
          path: /tmp/tlc_*.log
