name: Release

# Trusted Publishing (OIDC) to PyPI — no long-lived tokens anywhere.
# Trigger: push a version tag (v1.2.3). The tag must match pyproject.toml.
# One-time setup: PyPI → Publishing → add pending publisher for project
# "finefettle" (owner MilindGaharwar, repo fettle, workflow release.yml,
# environment pypi).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # Sigstore signing for the attestation
      attestations: write  # store provenance in the repo's attestation log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $VER"
            exit 1
          fi

      - name: Run tests
        run: |
          python -m pip install --quiet pytest ruff==0.15.20 semgrep==1.168.0 pyyaml
          # CLI subprocess tests spawn `python -m fettle.cli` from tmp dirs —
          # fettle must be importable from any cwd (same fix as ci.yml).
          python -m pip install --quiet -e .
          python -m pytest tests/ -q

      - name: Build sdist + wheel
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Smoke-test wheel (console script, version, bundled rules)
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/fettle --version
          /tmp/smoke/bin/python -c "from fettle._resources import rules_dir; d = rules_dir(); assert d.is_dir() and any(d.glob('*.yml')), d"
          # WP-11: bare wheel has no pyyaml — evals must fail with guidance, not a traceback
          /tmp/smoke/bin/python -c "import fettle.evals_runner" 2>&1 | grep -q "finefettle\[evals\]"
          /tmp/smoke/bin/pip install --quiet 'dist/'*.whl'[evals]'
          /tmp/smoke/bin/python -c "import fettle.evals_runner"

      # WP-147: SLSA provenance + Sigstore signatures for every artifact,
      # via GitHub's native attestation (verify: `gh attestation verify`).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      # WP-147: CycloneDX SBOM of the smoke venv — exactly the wheel that
      # ships plus its (empty) runtime dependency set. Kept out of dist/ so
      # the PyPI publish step only sees real distributions.
      - name: Generate SBOM (CycloneDX)
        run: |
          python -m pip install --quiet cyclonedx-bom
          mkdir -p sbom
          cyclonedx-py environment /tmp/smoke/bin/python \
            --output-reproducible -o "sbom/finefettle-${GITHUB_REF_NAME#v}.cdx.json"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/finefettle
    permissions:
      id-token: write   # OIDC — this is the whole credential story
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # WP-147: GitHub release carries the artifacts + SBOM alongside PyPI, so
  # the SBOM is published per release, not buried in a workflow artifact.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4  # gh release needs a repo context

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Create GitHub release with artifacts + SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* sbom/* \
            --verify-tag --generate-notes
