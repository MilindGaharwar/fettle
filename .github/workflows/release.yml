name: Release

# Trusted Publishing (OIDC) to PyPI — no long-lived tokens anywhere.
# Trigger: push a version tag (v1.2.3). The tag must match pyproject.toml.
# One-time setup: PyPI → Publishing → add pending publisher for project
# "finefettle" (owner MilindGaharwar, repo fettle, workflow release.yml,
# environment pypi).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $VER"
            exit 1
          fi

      - name: Verify authored release notes
        run: test -f "docs/engagement/${GITHUB_REF_NAME}-release-notes.md"

      - name: Verify exact commit CI succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA=$(git rev-parse "${GITHUB_REF_NAME}^{}")
          for attempt in $(seq 1 80); do
            RUN=$(gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=$TARGET_SHA&event=push&per_page=10" \
              --jq '.workflow_runs[0] // empty')
            if [ -z "$RUN" ]; then
              echo "Waiting for CI run for $TARGET_SHA ($attempt/80)"
              sleep 15
              continue
            fi
            STATUS=$(jq -r '.status' <<<"$RUN")
            CONCLUSION=$(jq -r '.conclusion // ""' <<<"$RUN")
            URL=$(jq -r '.html_url' <<<"$RUN")
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Exact commit CI succeeded: $URL"
                exit 0
              fi
              echo "::error::Exact commit CI concluded $CONCLUSION: $URL"
              exit 1
            fi
            echo "Waiting for CI run $URL ($STATUS, $attempt/80)"
            sleep 15
          done
          echo "::error::Timed out waiting for CI success for $TARGET_SHA"
          exit 1

  build:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # Sigstore signing for the attestation
      attestations: write  # store provenance in the repo's attestation log
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: |
          python -m pip install --quiet pytest==9.1.1 ruff==0.15.20 semgrep==1.168.0 pyyaml==6.0.3
          # CLI subprocess tests spawn `python -m fettle.cli` from tmp dirs —
          # fettle must be importable from any cwd (same fix as ci.yml).
          python -m pip install --quiet -e .
          python -m pytest tests/ -q
          fettle completion validate

      - name: Build sdist + wheel
        run: |
          python -m pip install --quiet build==1.5.0
          python -m build

      - name: Record candidate wheel identity
        run: |
          mkdir -p artifact-contract
          WHEEL=$(ls dist/*.whl)
          sha256sum "$WHEEL" | sed 's#  dist/#  #' > artifact-contract/wheel.sha256

      - name: Smoke-test dependency-free wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet --no-deps dist/*.whl
          /tmp/smoke/bin/fettle --version
          /tmp/smoke/bin/fettle demo
          /tmp/smoke/bin/python -c "from fettle._resources import rules_dir, commands_dir; r = rules_dir(); c = commands_dir(); assert r.is_dir() and any(r.glob('*.yml')), r; assert c.is_dir() and len(list(c.glob('*.md'))) == 17, c"
          /tmp/smoke/bin/python -c "import sysconfig; from importlib.metadata import distributions; assert len(list(distributions(path=[sysconfig.get_path('purelib')]))) == 1"

      - name: Smoke-test all optional capabilities
        run: |
          python -m venv /tmp/all-smoke
          WHEEL=$(realpath dist/*.whl)
          /tmp/all-smoke/bin/pip install --quiet "${WHEEL}[all]"
          /tmp/all-smoke/bin/python -c "import fettle.evals_runner, playwright, pytest, yaml"
          /tmp/all-smoke/bin/python -c "import sysconfig; from importlib.metadata import distributions; assert len(list(distributions(path=[sysconfig.get_path('purelib')]))) > 1"
          /tmp/all-smoke/bin/python -c "from pathlib import Path; bindir = Path('/tmp/all-smoke/bin'); assert all((bindir / tool).is_file() for tool in ('deptry', 'mutmut', 'pre-commit', 'pyright', 'ruff', 'semgrep'))"

      - name: Validate exact wheel through pipx outside checkout
        run: |
          python -m pip install --quiet pipx==1.7.1
          WHEEL=$(realpath dist/*.whl)
          export PIPX_HOME=/tmp/candidate-pipx
          export PIPX_BIN_DIR=/tmp/candidate-bin
          pipx install "$WHEEL"
          /tmp/candidate-bin/fettle demo
          PIPX_PYTHON=/tmp/candidate-pipx/venvs/finefettle/bin/python
          test -x "$PIPX_PYTHON"
          cd /tmp
          "$PIPX_PYTHON" -c "from pathlib import Path; import fettle; Path(fettle.__file__).resolve().relative_to(Path('/tmp/candidate-pipx/venvs/finefettle').resolve())"
          "$PIPX_PYTHON" -m fettle.installed_artifact_canary \
            --stage candidate \
            --wheel "$WHEEL" \
            --output "$GITHUB_WORKSPACE/artifact-contract/candidate.json" \
            --work-root /tmp/candidate-canary \
            --checkout-root "$GITHUB_WORKSPACE" \
            --pipx-version 1.7.1

      - name: Prove sdist reconstructs a complete wheel
        run: |
          python -m venv /tmp/sdist-smoke
          /tmp/sdist-smoke/bin/pip install --quiet dist/*.tar.gz
          /tmp/sdist-smoke/bin/python -c "from fettle._resources import rules_dir, commands_dir; assert any(rules_dir().glob('*.yml')); assert len(list(commands_dir().glob('*.md'))) == 17"
          /tmp/sdist-smoke/bin/fettle workflows list
          /tmp/sdist-smoke/bin/fettle demo
          /tmp/sdist-smoke/bin/python -c "from fettle.bridge import _source_subagent_hook; assert _source_subagent_hook().is_file()"

      # WP-147: SLSA provenance + Sigstore signatures for every artifact,
      # via GitHub's native attestation (verify: `gh attestation verify`).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      # WP-147: CycloneDX SBOM of the smoke venv — exactly the wheel and
      # runtime dependency set that ship. Kept out of dist/ so
      # the PyPI publish step only sees real distributions.
      - name: Generate SBOM (CycloneDX)
        run: |
          python -m pip install --quiet cyclonedx-bom==7.3.1
          mkdir -p sbom
          cyclonedx-py environment /tmp/smoke/bin/python \
            --output-reproducible -o "sbom/finefettle-${GITHUB_REF_NAME#v}.cdx.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifact-contract
          path: artifact-contract/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/finefettle
    permissions:
      id-token: write   # OIDC — this is the whole credential story
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  public-canary:
    needs: publish
    runs-on: ubuntu-latest
    container: python:3.11-slim
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: artifact-contract
          path: artifact-contract/

      - name: Download and verify public PyPI wheel
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p public-dist
          for attempt in $(seq 1 20); do
            if python -m pip download --no-cache-dir --no-deps --only-binary=:all: \
              --dest public-dist "finefettle==$VERSION"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Public PyPI wheel did not become available"
              exit 1
            fi
            sleep 15
          done
          PUBLIC_WHEEL=$(realpath public-dist/*.whl)
          EXPECTED=$(awk '{print $1}' artifact-contract/wheel.sha256)
          printf '%s  %s\n' "$EXPECTED" "$PUBLIC_WHEEL" | sha256sum -c -

      - name: Run public demo with its Git prerequisite
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends git
          PUBLIC_WHEEL=$(realpath public-dist/*.whl)
          PUBLIC_SITE=/tmp/public/lib/python3.11/site-packages
          python -m pip install --quiet --no-deps --prefix /tmp/public "$PUBLIC_WHEEL"
          PYTHONPATH="$PUBLIC_SITE" python -c "from importlib.metadata import distributions; packages = list(distributions(path=['$PUBLIC_SITE'])); print(f'package_count={len(packages)}'); print('\n'.join(sorted(f'{item.metadata[\"Name\"]}=={item.version}' for item in packages)))"
          set +e
          OUTPUT=$(PYTHONPATH="$PUBLIC_SITE" /tmp/public/bin/fettle demo 2>&1)
          DEMO_EXIT=$?
          set -e
          printf '%s\n' "$OUTPUT"
          echo "demo_exit_code=$DEMO_EXIT"
          exit "$DEMO_EXIT"

      - name: Canary installed governance from public PyPI
        run: |
          python -m pip install --quiet pipx==1.7.1
          PUBLIC_WHEEL=$(realpath public-dist/*.whl)
          export PIPX_HOME=/tmp/public-pipx
          export PIPX_BIN_DIR=/tmp/public-bin
          pipx install "$PUBLIC_WHEEL"
          PIPX_PYTHON=/tmp/public-pipx/venvs/finefettle/bin/python
          test -x "$PIPX_PYTHON"
          cd /tmp
          "$PIPX_PYTHON" -c "from pathlib import Path; import fettle; Path(fettle.__file__).resolve().relative_to(Path('/tmp/public-pipx/venvs/finefettle').resolve())"
          "$PIPX_PYTHON" -m fettle.installed_artifact_canary \
            --stage public \
            --wheel "$PUBLIC_WHEEL" \
            --output "$GITHUB_WORKSPACE/artifact-contract/public.json" \
            --work-root /tmp/public-canary \
            --checkout-root "$GITHUB_WORKSPACE" \
            --pipx-version 1.7.1
          "$PIPX_PYTHON" -m fettle.installed_artifact_contract \
            "$GITHUB_WORKSPACE/artifact-contract/candidate.json" "$GITHUB_WORKSPACE/artifact-contract/public.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-artifact-contract
          path: artifact-contract/public.json

  # WP-147: GitHub release carries the artifacts + SBOM alongside PyPI, so
  # the SBOM is published per release, not buried in a workflow artifact.
  release:
    needs: public-canary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — gh release needs a repo context

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom
          path: sbom/

      - name: Create GitHub release with artifacts + SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/engagement/${GITHUB_REF_NAME}-release-notes.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing authored release notes: $NOTES"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* sbom/* \
            --verify-tag --notes-file "$NOTES"
