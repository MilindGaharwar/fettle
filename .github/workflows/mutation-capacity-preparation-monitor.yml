name: Mutation capacity preparation monitor

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      experiment_id:
        required: true
        type: string
      authorization_id:
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  monitor:
    name: capacity validation (monitor preparation containment)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Monitor admitted worker exposure
        id: monitor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
        run: |
          set +e
          mkdir -p capacity-preparation-monitor
          observation_deadline=$(( $(date +%s) + 70 * 60 ))
          if ! python -c 'import os; from fettle.staged_preflight import capacity_authorization_contract; capacity_authorization_contract(os.environ["AUTHORIZATION_ID"], os.environ["CANDIDATE_SHA"], os.environ["EXPERIMENT_ID"])'; then
            printf '%s\n' '{"action":"cancel","reason":"capacity diagnostic authorization is invalid"}' \
              > capacity-preparation-monitor/final-decision.json
            exit 2
          fi
          for sample in $(seq 1 190); do
            if [ "$(date +%s)" -ge "$observation_deadline" ]; then
              printf '%s\n' '{"action":"cancel","reason":"internal monitor observation deadline expired","terminal_evidence":"unavailable"}' \
                > capacity-preparation-monitor/final-decision.json
              touch capacity-preparation-monitor/cancel-run
              exit 2
            fi
            jobs="capacity-preparation-monitor/jobs-$sample.json"
            decision="capacity-preparation-monitor/decision-$sample.json"
            attempts="capacity-preparation-monitor/collection-$sample-attempts"
            collection="capacity-preparation-monitor/collection-$sample.json"
            if ! python -m fettle.staged_preflight collect-stable-jobs \
              --endpoint "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --output "$jobs" --attempts-directory "$attempts" --report "$collection" \
              --max-attempts 4 --max-elapsed-seconds 45 --retry-delay-seconds 2; then
              printf '%s\n' '{"action":"cancel","reason":"provider accounting unavailable"}' > "$decision"
              cp "$decision" capacity-preparation-monitor/final-decision.json
              touch capacity-preparation-monitor/cancel-run
              exit 2
            fi
            OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ) JOBS="$jobs" DECISION="$decision" \
              python - <<'PY'
          import json, os, re
          from datetime import datetime
          from pathlib import Path
          from fettle.staged_preflight import (
              account_runner_minutes, evaluate_capacity_preparation_admission,
              capacity_authorization_contract, capacity_preparation_batches,
          )
          pages = json.loads(Path(os.environ["JOBS"]).read_text())
          authorization_id = capacity_authorization_contract(os.environ["AUTHORIZATION_ID"], os.environ["CANDIDATE_SHA"], os.environ["EXPERIMENT_ID"])["authorization_id"]
          jobs = [job for page in pages for job in page["jobs"]]
          worker = re.compile(r"^(?:[^/]+ / )?capacity validation \(enumerate (\d+)\)$")
          gate = re.compile(
              r"^capacity-preparation-admit-(\d+) / capacity validation "
              r"\(preparation admission\)$"
          )
          completed_gates = [
              int(match.group(1))
              for job in jobs
              if (match := gate.fullmatch(str(job.get("name", "")))) is not None
              and job.get("status") == "completed" and job.get("conclusion") == "success"
          ]
          completed_gates.sort()
          failed_gates = [
              int(match.group(1))
              for job in jobs
              if (match := gate.fullmatch(str(job.get("name", "")))) is not None
              and job.get("status") == "completed" and job.get("conclusion") != "success"
          ]
          if failed_gates:
              Path("capacity-preparation-monitor/terminal-gate.json").write_text(
                  json.dumps({"gate_id": min(failed_gates)}) + "\n"
              )
              raise SystemExit(11)
          if (
              not completed_gates
              or completed_gates != list(range(max(completed_gates) + 1))
          ):
              raise ValueError("preparation admission lineage is missing or duplicated")
          batches = capacity_preparation_batches()
          admitted = [
              index for batch in batches[:max(completed_gates) + 1] for index in batch
          ]
          terminal = []
          failed = []
          for job in jobs:
              match = worker.fullmatch(str(job.get("name", "")))
              if match is None:
                  continue
              index = int(match.group(1))
              if index not in admitted:
                  raise ValueError("enumeration worker appeared before admission")
              if job.get("status") == "completed":
                  terminal.append(index)
                  if job.get("conclusion") != "success":
                      failed.append(index)
          accounting = account_runner_minutes(
              Path(os.environ["JOBS"]),
              datetime.fromisoformat(os.environ["OBSERVED_AT"].replace("Z", "+00:00")),
              expected_run_id=os.environ["GITHUB_RUN_ID"],
              expected_run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],
              job_timeout_minutes=35,
          )
          result = evaluate_capacity_preparation_admission(
              accounting, admitted_shards=admitted, next_shards=[],
              require_admitted_terminal=False,
          )
          if failed:
              action, reason = "cancel", "an admitted enumeration worker failed"
          elif result["passed"] is not True:
              action, reason = "cancel", "reserved worker exposure exceeded 952 minutes"
          elif sorted(terminal) == list(range(256)):
              action, reason = "complete", "all 256 enumeration workers are terminal-success"
          else:
              action, reason = "continue", "admitted work remains within the reserved ceiling"
          Path(os.environ["DECISION"]).write_text(json.dumps({
              **result, "authorization_id": authorization_id,
              "experiment_id": os.environ["EXPERIMENT_ID"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "action": action, "reason": reason,
              "admitted_worker_shards": admitted,
              "terminal_worker_shards": sorted(set(terminal)),
              "failed_worker_shards": sorted(set(failed)),
              "active_jobs": sorted(set(admitted) - set(terminal)),
              "evidence": {"provider_jobs": os.environ["JOBS"]},
              "next_permitted_action": (
                  "freeze_exact_sample" if action == "complete"
                  else "continue_observation" if action == "continue"
                  else "stop_and_reconcile"
              ),
          }, indent=2) + "\n")
          raise SystemExit(0 if action == "continue" else 10 if action == "complete" else 2)
          PY
            status=$?
            cp "$decision" capacity-preparation-monitor/final-decision.json
            if [ "$status" -eq 10 ]; then exit 0; fi
            if [ "$status" -eq 11 ]; then
              gate_id=$(python -c 'import json; print(json.load(open("capacity-preparation-monitor/terminal-gate.json"))["gate_id"])')
              artifact="capacity-preparation-admission-$GITHUB_RUN_ID-$gate_id"
              rm -rf capacity-preparation-monitor/terminal-admission
              retrieved=false
              for _ in 1 2 3; do
                if timeout 10s gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
                    --name "$artifact" --dir capacity-preparation-monitor/terminal-admission; then
                  retrieved=true
                  break
                fi
                sleep 2
              done
              if [ "$retrieved" = true ]; then
                GATE_ID="$gate_id" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from fettle.staged_preflight import validate_capacity_preparation_terminal_decision
          source = Path("capacity-preparation-monitor/terminal-admission/capacity-preparation-admission.json")
          decision = json.loads(source.read_text())
          validate_capacity_preparation_terminal_decision(
              decision, gate_id=int(os.environ["GATE_ID"]),
              authorization_id=os.environ["AUTHORIZATION_ID"],
              candidate_sha=os.environ["CANDIDATE_SHA"],
              experiment_id=os.environ["EXPERIMENT_ID"],
              run_id=os.environ["GITHUB_RUN_ID"], run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],
              accounting_source=Path(
                  "capacity-preparation-monitor/terminal-admission/capacity-preparation-jobs.json"
              ),
          )
          Path("capacity-preparation-monitor/final-decision.json").write_text(json.dumps({
              "schema_version": "1", "kind": "capacity_preparation_monitor_terminal",
              "action": "stop_and_reconcile", "reason": "admission reservation failed",
              "terminal_evidence": "validated", "terminal_gate_id": int(os.environ["GATE_ID"]),
              "terminal_decision_sha256": hashlib.sha256(source.read_bytes()).hexdigest(),
              "authorization_id": os.environ["AUTHORIZATION_ID"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "experiment_id": os.environ["EXPERIMENT_ID"],
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "next_permitted_action": "stop_and_reconcile",
          }, indent=2) + "\n")
          PY
                validation_status=$?
              else
                validation_status=2
              fi
              if [ "$validation_status" -ne 0 ]; then
                GATE_ID="$gate_id" python - <<'PY'
          import json, os
          from pathlib import Path
          Path("capacity-preparation-monitor/final-decision.json").write_text(json.dumps({
              "schema_version": "1", "kind": "capacity_preparation_monitor_terminal",
              "action": "stop_and_reconcile",
              "reason": "terminal admission decision unavailable or invalid",
              "terminal_evidence": "unavailable", "terminal_gate_id": int(os.environ["GATE_ID"]),
              "authorization_id": os.environ["AUTHORIZATION_ID"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "experiment_id": os.environ["EXPERIMENT_ID"],
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "next_permitted_action": "stop_and_reconcile",
          }, indent=2) + "\n")
          PY
              fi
              exit 2
            fi
            if [ "$status" -eq 2 ]; then
              touch capacity-preparation-monitor/cancel-run
              exit 2
            fi
            if [ "$status" -ne 0 ]; then exit 2; fi
            sleep 30
          done
          printf '%s\n' '{"action":"cancel","reason":"monitor observation loop exhausted","terminal_evidence":"unavailable"}' \
            > capacity-preparation-monitor/final-decision.json
          touch capacity-preparation-monitor/cancel-run
          exit 2
      - name: Retain monitor state before cancellation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-preparation-monitor-${{ github.run_id }}
          path: capacity-preparation-monitor
          if-no-files-found: error
          retention-days: 90
      - name: Request cancellation after retaining diagnostics
        if: steps.monitor.outcome == 'failure' && hashFiles('capacity-preparation-monitor/cancel-run') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
      - name: Require successful terminal observation
        if: always()
        run: test "${{ steps.monitor.outcome }}" = "success"
