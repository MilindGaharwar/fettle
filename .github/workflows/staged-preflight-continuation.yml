name: Staged preflight continuation
run-name: Staged preflight continuation for source ${{ inputs.source_run_id }}/1

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact frozen candidate commit"
        required: true
        type: string
      source_run_id:
        description: "Terminal source with validated wave 1+2 evidence"
        required: true
        type: string
      source_orchestration_sha:
        description: "Immutable first-run orchestration commit"
        required: true
        type: string
      source_plan_sha256:
        description: "SHA-256 of first-run staged plan"
        required: true
        type: string
      source_workflow_ref:
        description: "Immutable first-run workflow ref"
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  prepare:
    name: Validate immutable preflight sources
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Reject rerun attempts
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Check out frozen executable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.candidate_sha }}
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install frozen candidate
        working-directory: candidate
        run: uv venv --python 3.12.13 && uv pip install --quiet --no-deps -e .
      - name: Bind unified candidate and orchestration identity
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
        run: python -c 'import os,re,subprocess,sys; candidate=os.environ["CANDIDATE_SHA"]; actual=subprocess.check_output(["git","-C","candidate","rev-parse","HEAD"],text=True).strip(); control=subprocess.check_output(["git","-C","control","rev-parse","HEAD"],text=True).strip(); sys.exit(0 if candidate==actual==control==os.environ["GITHUB_SHA"] and re.fullmatch(r"[0-9a-f]{40}",control) else 1)'
      - name: Recreate frozen manifests
        working-directory: candidate
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --prepare-manifests ../mutation-manifests --json > ../prepare.json
      - name: Fetch immutable source handoff evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 10); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.inputs.source_run_id }}" > source-run.json
            [ "$(jq -r .status source-run.json)" = "completed" ] && break
            sleep 30
          done
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.inputs.source_run_id }}/attempts/1/jobs?per_page=100" \
            > source-jobs.json
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.inputs.source_run_id }}/artifacts?per_page=100" \
            > source-artifacts.json
      - name: Validate source prerequisites and handoff-only failure
        run: |
          candidate/.venv/bin/python control/scripts/staged_preflight.py validate-source-handoff \
            --run source-run.json --jobs source-jobs.json --artifacts source-artifacts.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-run-id "${{ github.event.inputs.source_run_id }}" \
            --candidate-sha "${{ github.event.inputs.candidate_sha }}" \
            --source-orchestration-sha "${{ github.event.inputs.source_orchestration_sha }}" \
            --source-workflow-ref "${{ github.event.inputs.source_workflow_ref }}" \
            --output source-handoff-validation.json
      - name: Reject duplicate continuation dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/staged-preflight-continuation.yml/runs?event=workflow_dispatch&per_page=100" \
            > continuation-runs.json
          candidate/.venv/bin/python control/scripts/staged_preflight.py validate-continuation-dispatches \
            --runs continuation-runs.json \
            --source-run-id "${{ github.event.inputs.source_run_id }}" \
            --current-run-id "$GITHUB_RUN_ID" \
            --output continuation-dispatch-validation.json
      - name: Download immutable source plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-staged-plan-${{ github.event.inputs.source_run_id }}-1
          path: source-plan
          run-id: ${{ github.event.inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable wave 1 reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-1-${{ github.event.inputs.source_run_id }}-1-*
          path: wave-1-reports
          run-id: ${{ github.event.inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable wave 2 reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-2-${{ github.event.inputs.source_run_id }}-1-*
          path: wave-2-reports
          run-id: ${{ github.event.inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable wave 1 validation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-wave-1-validation-${{ github.event.inputs.source_run_id }}-1
          path: wave-1-validation
          run-id: ${{ github.event.inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable wave 2 validation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-wave-2-validation-${{ github.event.inputs.source_run_id }}-1
          path: wave-2-validation
          run-id: ${{ github.event.inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build exact continuation plan
        id: plan
        run: |
          candidate/.venv/bin/python control/scripts/staged_preflight.py fresh-continuation-plan --root candidate \
            --manifests mutation-manifests \
            --source-plan source-plan/staged-preflight-plan.json \
            --wave-1-reports wave-1-reports --wave-2-reports wave-2-reports \
            --wave-1-validation wave-1-validation/wave-1-validation.json \
            --wave-2-validation wave-2-validation/wave-2-validation.json \
            --source-plan-sha256 "${{ github.event.inputs.source_plan_sha256 }}" \
            --source-run-id "${{ github.event.inputs.source_run_id }}" \
            --source-orchestration-sha "${{ github.event.inputs.source_orchestration_sha }}" \
            --source-workflow-ref "${{ github.event.inputs.source_workflow_ref }}" \
            --candidate-sha "${{ github.event.inputs.candidate_sha }}" \
            --orchestration-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output continuation-plan.json
          echo "matrix=$(python -c 'import json; print(json.dumps({"shard":json.load(open("continuation-plan.json"))["topology"]["matrix_batches"][0]},separators=(",",":")))')" >> "$GITHUB_OUTPUT"
      - name: Retain validated continuation inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            continuation-plan.json
            mutation-manifests
            source-plan
            wave-1-reports
            wave-2-reports
            wave-1-validation
            wave-2-validation
            source-run.json
            source-jobs.json
            source-artifacts.json
            source-handoff-validation.json
            continuation-runs.json
            continuation-dispatch-validation.json
          retention-days: 90
          if-no-files-found: error

  launch-gate:
    name: Reconcile cumulative launch budget
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Download continuation inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - name: Reconcile all prior operational usage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.inputs.source_run_id }}/attempts/1/jobs?per_page=100" > source-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > current-jobs.json
          python control/scripts/staged_preflight.py budget-gate --jobs current-jobs.json \
            --prior-jobs source-jobs.json --prior-run-id ${{ github.event.inputs.source_run_id }} --prior-run-attempt 1 \
            --run-id "$GITHUB_RUN_ID" --run-attempt 1 \
            --next-wave wave-3 --output launch-budget.json
      - name: Retain launch accounting
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-launch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-jobs.json
            current-jobs.json
            launch-budget.json
          retention-days: 90
          if-no-files-found: error

  wave-3-batch-1:
    name: mutation (continuation shard ${{ matrix.shard }})
    needs: [prepare, launch-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: true
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.candidate_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - name: Download continuation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - name: Execute previously unattempted shard
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --preflight-manifest staged-plan/mutation-manifests/partition-${{ matrix.shard }}.json
          --json > mutation-preflight.json
      - name: Retain continuation shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-wave-3-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: mutation-preflight.json
          retention-days: 90
          if-no-files-found: error

  wave-3-admission-1:
    name: Validate and admit continuation batch 1
    needs: [prepare, launch-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      matrix: ${{ steps.admit.outputs.matrix }}
    steps:
      - name: Arm fail-closed admission containment
        run: |
          printf '%s\n' 'armed-through-diagnostics-retention' > admission-containment-armed.txt
          date +%s > admission-observer-started-at.txt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.candidate_sha }}
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install frozen candidate
        working-directory: candidate
        run: uv venv --python 3.12.13 && uv pip install --quiet --no-deps -e .
      - name: Download continuation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - name: Observe batch and enforce cumulative global budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo 'admission-observer-error' > cancellation-requested.txt; fi; exit "$status"' ERR
          mkdir -p admission-snapshots
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.inputs.source_run_id }}/attempts/1/jobs?per_page=100" > source-jobs.json
          observer_deadline=$(( $(cat admission-observer-started-at.txt) + 2040 ))
          sample=0
          while true; do
            sample=$((sample + 1))
            jobs="admission-snapshots/jobs-$sample.json"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > "$jobs"
            observed_at=$(candidate/.venv/bin/python -c 'from datetime import UTC,datetime; print(datetime.now(UTC).isoformat())')
            historical_args=()
            for prior_budget in admission-snapshots/budget-*.json; do
              [ -f "$prior_budget" ] && historical_args+=(--historical-accounting "$prior_budget")
            done
            budget="admission-snapshots/budget-$sample.json"
            if ! candidate/.venv/bin/python control/scripts/staged_preflight.py budget-gate \
              --jobs "$jobs" --prior-jobs source-jobs.json \
              --prior-run-id ${{ github.event.inputs.source_run_id }} --prior-run-attempt 1 \
              --run-id "$GITHUB_RUN_ID" --run-attempt 1 --observed-at "$observed_at" \
              --job-timeout-minutes 35 "${historical_args[@]}" \
              --next-wave complete --output "$budget"; then
              printf '%s\n' 'admission-budget-non-pass' > cancellation-requested.txt
              exit 2
            fi
            expected=$(candidate/.venv/bin/python -c 'import json; print(len(json.load(open("staged-plan/continuation-plan.json"))["topology"]["matrix_batches"][0]))')
            states=$(candidate/.venv/bin/python -c 'import json,re,sys; pages=json.load(open(sys.argv[1])); pages=pages if isinstance(pages,list) else [pages]; expected=set(json.load(open("staged-plan/continuation-plan.json"))["topology"]["matrix_batches"][int(sys.argv[2])]); jobs=[job for page in pages for job in page["jobs"]]; matches=[(int(match.group(1)),job) for job in jobs if (match:=re.fullmatch(r"mutation \(continuation shard (\d+)\)",str(job.get("name","")))) and int(match.group(1)) in expected]; indexes=[index for index,_ in matches]; failed=sum(job.get("status")=="completed" and job.get("conclusion")!="success" for _,job in matches); succeeded=sum(job.get("status")=="completed" and job.get("conclusion")=="success" for _,job in matches); sys.exit(2) if len(indexes)!=len(set(indexes)) else print(len(matches),failed,succeeded)' "$jobs" 0)
            read -r found failed succeeded <<< "$states"
            if [ "$failed" -ne 0 ]; then
              printf '%s\n' 'admission-shard-failure' > cancellation-requested.txt
              exit 2
            fi
            if [ "$found" -eq "$expected" ] && [ "$succeeded" -eq "$expected" ]; then
              cp "$jobs" current-jobs.json
              cp "$budget" admission-budget.json
              break
            fi
            if [ "$(date +%s)" -ge "$observer_deadline" ]; then
              printf '%s\n' 'admission-observer-deadline' > cancellation-requested.txt
              exit 2
            fi
            sleep 30
          done
      - name: Wait for admitted artifact inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in 1 2 3; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > current-artifacts.json
            count=$(jq '[.[].artifacts[] | select(.name | startswith("mutation-preflight-wave-3-'"$GITHUB_RUN_ID"'-1-"))] | length' current-artifacts.json)
            [ "$count" -ge 32 ] && exit 0
            sleep 10
          done
          exit 2
      - name: Download admitted reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-3-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: admitted-reports
      - name: Validate terminal evidence and emit next matrix
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate/.venv/bin/python control/scripts/staged_preflight.py validate-continuation-batch \
            --root candidate --plan staged-plan/continuation-plan.json \
            --manifests staged-plan/mutation-manifests --reports admitted-reports \
            --jobs current-jobs.json --artifacts current-artifacts.json --batch 1 \
            --orchestration-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output admission-validation.json
          echo "matrix=$(candidate/.venv/bin/python -c 'import json; print(json.dumps(json.load(open("admission-validation.json"))["next_matrix"],separators=(",",":")))')" >> "$GITHUB_OUTPUT"
      - name: Retain admission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-admission-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            admission-validation.json
            admission-budget.json
            admission-snapshots
            admission-observer-started-at.txt
            cancellation-requested.txt
            current-jobs.json
            current-artifacts.json
            source-jobs.json
          retention-days: 90
          if-no-files-found: error
      - name: Disarm admission containment after retained success
        if: success()
        run: rm admission-containment-armed.txt
      - name: Request cancellation after retaining admission diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f admission-containment-armed.txt ] || [ -f cancellation-requested.txt ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" > cancellation-response.json
            exit 2
          fi
  wave-3-batch-2:
    name: mutation (continuation shard ${{ matrix.shard }})
    needs: [prepare, wave-3-admission-1]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: true
      max-parallel: 8
      matrix: ${{ fromJSON(needs.wave-3-admission-1.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.candidate_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - name: Download continuation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - name: Execute previously unattempted shard
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --preflight-manifest staged-plan/mutation-manifests/partition-${{ matrix.shard }}.json
          --json > mutation-preflight.json
      - name: Retain continuation shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-wave-3-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: mutation-preflight.json
          retention-days: 90
          if-no-files-found: error

  wave-3-admission-2:
    name: Validate and admit continuation batch 2
    needs: [prepare, wave-3-admission-1]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      matrix: ${{ steps.admit.outputs.matrix }}
    steps:
      - name: Arm fail-closed admission containment
        run: |
          printf '%s\n' 'armed-through-diagnostics-retention' > admission-containment-armed.txt
          date +%s > admission-observer-started-at.txt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.candidate_sha }}
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install frozen candidate
        working-directory: candidate
        run: uv venv --python 3.12.13 && uv pip install --quiet --no-deps -e .
      - name: Download continuation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - name: Download preceding admission accounting
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-admission-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: prior-admission
      - name: Observe batch and enforce cumulative global budget
        env:
