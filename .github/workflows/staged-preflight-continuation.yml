name: Staged preflight continuation

on:
  workflow_dispatch:
    inputs:
      recovery_id:
        description: "Pinned operator-authorized E2 handoff recovery"
        required: true
        type: string

concurrency:
  group: e2-preflight-recovery-37573662156-1
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Validate immutable preflight sources
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      remaining_matrix: ${{ steps.plan.outputs.remaining_matrix }}
      canary_shard: ${{ steps.plan.outputs.canary_shard }}
    steps:
      - name: Reject rerun attempts
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Check out frozen executable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f5560685d1f9eaea05107947fb0ecab791ad9478
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install frozen candidate
        working-directory: candidate
        run: uv venv --python 3.12.13 && uv pip install --quiet --no-deps -e .
      - name: Bind candidate and recovery orchestration identities
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess

          candidate = subprocess.check_output(
              ["git", "-C", "candidate", "rev-parse", "HEAD"], text=True,
          ).strip()
          control = subprocess.check_output(
              ["git", "-C", "control", "rev-parse", "HEAD"], text=True,
          ).strip()
          expected_candidate = "f5560685d1f9eaea05107947fb0ecab791ad9478"
          valid = (
              candidate == expected_candidate
              and re.fullmatch(r"[0-9a-f]{40}", control) is not None
              and control == os.environ["GITHUB_SHA"]
              and control != candidate
              and os.environ.get("RECOVERY_ID") == "E2-37573662156-1-handoff"
          )
          raise SystemExit(0 if valid else 2)
          PY
        env:
          RECOVERY_ID: ${{ github.event.inputs.recovery_id }}
      - name: Capture pinned failed source and prove no prior recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry_api() {
            local output=$1
            shift
            for delay in 0 5 15; do
              if [ "$delay" -ne 0 ]; then sleep "$delay"; fi
              if "$@" > "$output.tmp"; then
                mv "$output.tmp" "$output"
                return 0
              fi
            done
            rm -f "$output.tmp"
            return 1
          }
          retry_api source-run.json gh api "repos/$GITHUB_REPOSITORY/actions/runs/37573662156"
          retry_api source-jobs.json gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37573662156/attempts/1/jobs?per_page=100"
          retry_api source-failure.log gh run view 37573662156 --repo "$GITHUB_REPOSITORY" --job 112642844198 --log
          retry_api source-artifacts.json gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37573662156/artifacts?per_page=100"
          retry_api setup-run.json gh api "repos/$GITHUB_REPOSITORY/actions/runs/37580393007"
          retry_api setup-jobs.json gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37580393007/attempts/1/jobs?per_page=100"
          retry_api setup-artifacts.json gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37580393007/artifacts?per_page=100"
          retry_api layout-run.json gh api "repos/$GITHUB_REPOSITORY/actions/runs/37589782905"
          retry_api layout-jobs.json gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37589782905/attempts/1/jobs?per_page=100"
          retry_api layout-artifacts.json gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37589782905/artifacts?per_page=100"
          retry_api api-run.json gh api "repos/$GITHUB_REPOSITORY/actions/runs/37600554367"
          retry_api api-jobs.json gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37600554367/attempts/1/jobs?per_page=100"
          retry_api api-artifacts.json gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37600554367/artifacts?per_page=100"
          retry_api api-failure.log gh run view 37600554367 --repo "$GITHUB_REPOSITORY" --job 112723599440 --log
          mkdir layout-logs
          for job in 112688644249 112688644256 112688644298 112688644321 112688644327 112688644359 112688644384 112688644514; do
            retry_api "layout-logs/shard-$job.log" gh run view 37589782905 --repo "$GITHUB_REPOSITORY" --job "$job" --log
          done
          retry_api prior-runs.json gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow staged-preflight-continuation.yml --limit 100 \
            --json databaseId,headBranch,headSha,event,status,conclusion,createdAt,url
      - name: Download immutable source plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-staged-plan-37573662156-1
          path: source-plan
          run-id: 37573662156
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable wave 1 reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-1-37573662156-1-*
          path: wave-1-reports
          run-id: 37573662156
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable wave 2 reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-2-37573662156-1-*
          path: wave-2-reports
          run-id: 37573662156
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable wave 1 validation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-wave-1-validation-37573662156-1
          path: wave-1-validation
          run-id: 37573662156
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable wave 2 validation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-wave-2-validation-37573662156-1
          path: wave-2-validation
          run-id: 37573662156
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate operator-authorized failed-source exception
        run: |
          candidate/.venv/bin/python control/scripts/e2_preflight_recovery.py \
            --root candidate \
            --source-run source-run.json --source-jobs source-jobs.json \
            --source-failure-log source-failure.log \
            --source-artifacts source-artifacts.json --prior-runs prior-runs.json \
            --setup-run setup-run.json --setup-jobs setup-jobs.json \
            --setup-artifacts setup-artifacts.json \
            --layout-run layout-run.json --layout-jobs layout-jobs.json \
            --layout-artifacts layout-artifacts.json --layout-logs layout-logs \
            --api-run api-run.json --api-jobs api-jobs.json \
            --api-artifacts api-artifacts.json --api-failure-log api-failure.log \
            --plan source-plan/staged-preflight-plan.json \
            --manifests source-plan/mutation-manifests --wave-1-reports wave-1-reports \
            --wave-2-reports wave-2-reports \
            --wave-1-validation wave-1-validation/wave-1-validation.json \
            --wave-2-validation wave-2-validation/wave-2-validation.json \
            --orchestration-sha "$GITHUB_SHA" --current-run-id "$GITHUB_RUN_ID" \
            --output recovery-authorization.json
      - name: Build exact continuation plan
        id: plan
        env:
          RECOVERY_ORCHESTRATION_SHA: ${{ github.sha }}
        run: |
          candidate/.venv/bin/python control/scripts/staged_preflight.py fresh-continuation-plan --root candidate \
            --manifests source-plan/mutation-manifests \
            --source-plan source-plan/staged-preflight-plan.json \
            --wave-1-reports wave-1-reports --wave-2-reports wave-2-reports \
            --wave-1-validation wave-1-validation/wave-1-validation.json \
            --wave-2-validation wave-2-validation/wave-2-validation.json \
            --source-plan-sha256 "a6fbc9607212d36215d917284859d336ee6db2a370b7ea379a3ad574a4402efa" \
            --source-run-id "37573662156" \
            --source-orchestration-sha "f5560685d1f9eaea05107947fb0ecab791ad9478" \
            --source-workflow-ref "MilindGaharwar/fettle/.github/workflows/mutation.yml@refs/heads/audit/hardening-integration-20261005" \
            --candidate-sha "f5560685d1f9eaea05107947fb0ecab791ad9478" \
            --orchestration-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output continuation-plan.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("continuation-plan.json")
          plan = json.loads(path.read_text())
          plan["source"]["verdict"] = "permanently failed; dispatch handoff only"
          plan["recovery"] = {
              "id": "E2-37573662156-1-handoff",
              "authorization": "operator-authorized dispatch recovery",
              "orchestration_sha": os.environ["RECOVERY_ORCHESTRATION_SHA"],
              "prior_failed_runs": ["37580393007", "37589782905"],
              "canary_shard": 35,
              "canary_artifact_is_eligible": True,
          }
          path.write_text(json.dumps(plan, indent=2) + "\n")
          PY
          {
            echo "matrix=$(python -c 'import json; print(json.dumps({"shard":json.load(open("continuation-plan.json"))["execution_wave"]["shards"]},separators=(",",":")))')"
            echo "remaining_matrix=$(python -c 'import json; print(json.dumps({"shard":[s for s in json.load(open("continuation-plan.json"))["execution_wave"]["shards"] if s != 35]},separators=(",",":")))')"
            echo "canary_shard=35"
          } >> "$GITHUB_OUTPUT"
      - name: Validate producer manifest layout before matrix expansion
        run: |
          candidate/.venv/bin/python control/scripts/staged_preflight.py validate-manifest-handoff \
            --root candidate --artifact-root . --plan continuation-plan.json \
            --output manifest-handoff.json
      - name: Retain validated continuation inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            continuation-plan.json
            source-plan
            wave-1-reports
            wave-2-reports
            wave-1-validation
            wave-2-validation
            source-run.json
            source-jobs.json
            source-failure.log
            source-artifacts.json
            setup-run.json
            setup-jobs.json
            setup-artifacts.json
            layout-run.json
            layout-jobs.json
            layout-artifacts.json
            layout-logs
            api-run.json
            api-jobs.json
            api-artifacts.json
            api-failure.log
            prior-runs.json
            recovery-authorization.json
            manifest-handoff.json
          retention-days: 90
          if-no-files-found: error

  launch-gate:
    name: Reconcile cumulative launch budget
    if: github.run_attempt == 1
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Download continuation inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - name: Reconcile all prior operational usage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37573662156/attempts/1/jobs?per_page=100" > source-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37580393007/attempts/1/jobs?per_page=100" > setup-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > current-jobs.json
          cp staged-plan/layout-jobs.json layout-jobs.json
          cp staged-plan/api-jobs.json api-jobs.json
          python control/scripts/staged_preflight.py budget-gate --jobs current-jobs.json \
            --source source-jobs.json 37573662156 1 \
            --source setup-jobs.json 37580393007 1 \
            --source layout-jobs.json 37589782905 1 \
            --source api-jobs.json 37600554367 1 \
            --run-id "$GITHUB_RUN_ID" --run-attempt 1 \
            --next-wave wave-3 --output launch-budget.json
          python control/scripts/staged_preflight.py recovery-budget-projection \
            --accounting launch-budget.json --remaining-shards 216 \
            --output launch-projection.json
      - name: Validate downloaded manifest handoff before execution
        run: |
          python control/scripts/staged_preflight.py validate-manifest-handoff \
            --root control --artifact-root staged-plan \
            --plan staged-plan/continuation-plan.json --output manifest-handoff.json
      - name: Recheck exclusive recovery identity before matrix expansion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow staged-preflight-continuation.yml \
            --limit 100 --json databaseId,headBranch,headSha,event,status,conclusion,createdAt,url \
            > current-runs.json
          python - <<'PY'
          import json, os
          runs = json.load(open("current-runs.json"))
          competing = [run for run in runs if run["event"] == "workflow_dispatch"
                       and run.get("headBranch") == os.environ["GITHUB_REF_NAME"]
                       and str(run["databaseId"]) not in {
                            "37580393007", "37589782905", os.environ["GITHUB_RUN_ID"],
                            "37600554367",
                       }]
          if competing:
              raise SystemExit("another recovery execution exists")
          PY
      - name: Retain launch accounting
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-launch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-jobs.json
            setup-jobs.json
            layout-jobs.json
            api-jobs.json
            current-jobs.json
            current-runs.json
            launch-budget.json
            launch-projection.json
            manifest-handoff.json
          retention-days: 90
          if-no-files-found: error

  canary:
    name: mutation (continuation shard ${{ needs.prepare.outputs.canary_shard }} canary)
    if: github.run_attempt == 1
    needs: [prepare, launch-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f5560685d1f9eaea05107947fb0ecab791ad9478
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - name: Download continuation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - name: Execute previously unattempted shard
        id: execute
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --preflight-manifest staged-plan/source-plan/mutation-manifests/partition-${{ needs.prepare.outputs.canary_shard }}.json
          --json > mutation-preflight.json
      - name: Capture canary source, process, cache, manifest, and terminal state
        if: always()
        env:
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
          CANARY_SHARD: ${{ needs.prepare.outputs.canary_shard }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          manifest = Path(
              "staged-plan/source-plan/mutation-manifests"
          ) / f"partition-{os.environ['CANARY_SHARD']}.json"
          tracked_clean = subprocess.run(
              ["git", "diff", "--quiet", "--exit-code"], check=False,
          ).returncode == 0 and subprocess.run(
              ["git", "diff", "--cached", "--quiet", "--exit-code"], check=False,
          ).returncode == 0
          process = subprocess.run(
              ["pgrep", "-f", "[m]utmut"], text=True, capture_output=True, check=False,
          )
          cache_paths = [Path(".mutmut-cache"), Path(".fettle/mutation-cache")]
          result = {
              "schema_version": "1",
              "execution_outcome": os.environ["EXECUTION_OUTCOME"],
              "source_restored": tracked_clean,
              "mutmut_processes_remaining": process.stdout.split(),
              "cache": {
                  path.as_posix(): {
                      "exists": path.exists(),
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest()
                      if path.is_file() else None,
                  }
                  for path in cache_paths
              },
              "manifest_path": manifest.as_posix(),
              "manifest_sha256": hashlib.sha256(manifest.read_bytes()).hexdigest(),
              "report_exists": Path("mutation-preflight.json").is_file(),
              "report_size": Path("mutation-preflight.json").stat().st_size
              if Path("mutation-preflight.json").is_file() else 0,
          }
          result["passed"] = (
              result["execution_outcome"] == "success"
              and result["source_restored"]
              and not result["mutmut_processes_remaining"]
              and result["report_size"] > 0
          )
          Path("canary-terminal.json").write_text(json.dumps(result, indent=2) + "\n")
          raise SystemExit(0 if result["passed"] else 2)
          PY
      - name: Retain continuation shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-wave-3-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.prepare.outputs.canary_shard }}
          path: |
            mutation-preflight.json
            canary-terminal.json
          retention-days: 90
          if-no-files-found: error

  canary-readback:
    name: Validate canary artifact handoff
    if: github.run_attempt == 1
    needs: [prepare, canary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-wave-3-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.prepare.outputs.canary_shard }}
          path: canary-report
      - name: Validate downloaded canary through final consumer contract
        run: |
          python control/scripts/staged_preflight.py validate-report-handoff \
            --root control --artifact-root staged-plan \
            --plan staged-plan/continuation-plan.json \
            --report canary-report/mutation-preflight.json \
            --shard "${{ needs.prepare.outputs.canary_shard }}" \
            --output canary-readback.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-canary-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: canary-readback.json
          retention-days: 90
          if-no-files-found: error

  remaining-launch-gate:
    name: Reconcile post-canary completion budget
    if: github.run_attempt == 1
    needs: [prepare, canary-readback]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - name: Recalculate completion reserve from observed canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37573662156/attempts/1/jobs?per_page=100" > source-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37580393007/attempts/1/jobs?per_page=100" > setup-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > current-jobs.json
          cp staged-plan/layout-jobs.json layout-jobs.json
          cp staged-plan/api-jobs.json api-jobs.json
          python control/scripts/staged_preflight.py budget-gate --jobs current-jobs.json \
            --source source-jobs.json 37573662156 1 \
            --source setup-jobs.json 37580393007 1 \
            --source layout-jobs.json 37589782905 1 \
            --source api-jobs.json 37600554367 1 \
            --run-id "$GITHUB_RUN_ID" --run-attempt 1 \
            --next-wave complete --output post-canary-accounting.json
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          pages = json.loads(Path("current-jobs.json").read_text())
          jobs = [job for page in pages for job in page["jobs"]]
          canaries = [job for job in jobs if job.get("name") == "mutation (continuation shard 35 canary)"]
          if len(canaries) != 1 or canaries[0].get("conclusion") != "success":
              raise SystemExit("successful canary timing is missing or ambiguous")
          canary = canaries[0]
          start = datetime.fromisoformat(canary["started_at"].replace("Z", "+00:00"))
          end = datetime.fromisoformat(canary["completed_at"].replace("Z", "+00:00"))
          minutes = (end - start).total_seconds() / 60
          if minutes <= 0:
              raise SystemExit("successful canary timing is malformed")
          Path("canary-minutes.txt").write_text(f"{minutes:.6f}\n")
          PY
          python control/scripts/staged_preflight.py recovery-budget-projection \
            --accounting post-canary-accounting.json --remaining-shards 215 \
            --canary-minutes "$(cat canary-minutes.txt)" \
            --output remaining-launch-projection.json
      - name: Retain post-canary budget decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-remaining-launch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-jobs.json
            setup-jobs.json
            layout-jobs.json
            api-jobs.json
            current-jobs.json
            post-canary-accounting.json
            canary-minutes.txt
            remaining-launch-projection.json
          retention-days: 90
          if-no-files-found: error

  remaining-shards:
    name: mutation (continuation shard ${{ matrix.shard }})
    if: github.run_attempt == 1
    needs: [prepare, canary-readback, remaining-launch-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: true
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.remaining_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f5560685d1f9eaea05107947fb0ecab791ad9478
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - name: Download continuation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - name: Execute previously unattempted shard
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --preflight-manifest staged-plan/source-plan/mutation-manifests/partition-${{ matrix.shard }}.json
          --json > mutation-preflight.json
      - name: Retain continuation shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-wave-3-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: mutation-preflight.json
          retention-days: 90
          if-no-files-found: error

  monitor:
    name: Monitor failures and operational ceiling
    if: github.run_attempt == 1
    needs: [canary-readback, remaining-launch-gate]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Stop on failure or exhausted execution budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37573662156/attempts/1/jobs?per_page=100" > source-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37580393007/attempts/1/jobs?per_page=100" > setup-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37589782905/attempts/1/jobs?per_page=100" > layout-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37600554367/attempts/1/jobs?per_page=100" > api-jobs.json
          while true; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > current-jobs.json
            failed=$(jq '[.[].jobs[] | select(.name | startswith("mutation (continuation shard ")) | select(.status == "completed" and .conclusion != "success")] | length' current-jobs.json)
            succeeded=$(jq '[.[].jobs[] | select(.name | startswith("mutation (continuation shard ")) | select(.status == "completed" and .conclusion == "success")] | length' current-jobs.json)
            if [ "$failed" -ne 0 ]; then
              echo "Continuation shard failure detected; cancelling run"
              gh run cancel "$GITHUB_RUN_ID"
              exit 2
            fi
            if ! python control/scripts/staged_preflight.py budget-gate --jobs current-jobs.json \
              --source source-jobs.json 37573662156 1 \
              --source setup-jobs.json 37580393007 1 \
              --source layout-jobs.json 37589782905 1 \
              --source api-jobs.json 37600554367 1 \
              --run-id "$GITHUB_RUN_ID" --run-attempt 1 \
              --next-wave complete --output monitor-budget.json; then
              echo "Operational execution ceiling reached or accounting became indeterminate; cancelling run"
              gh run cancel "$GITHUB_RUN_ID"
              exit 2
            fi
            if [ "$succeeded" -eq 216 ]; then
              break
            fi
            sleep 60
          done
      - name: Retain terminal monitor accounting
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-jobs.json
            setup-jobs.json
            layout-jobs.json
            api-jobs.json
            current-jobs.json
            monitor-budget.json
          retention-days: 90
          if-no-files-found: error

  validate:
    name: Validate complete continuation wave
    if: github.run_attempt == 1
    needs: [prepare, remaining-shards, monitor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f5560685d1f9eaea05107947fb0ecab791ad9478
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install frozen candidate
        working-directory: candidate
        run: uv venv --python 3.12.13 && uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-3-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: staged-reports
      - name: Validate all 216 new reports
        run: >-
          candidate/.venv/bin/python control/scripts/staged_preflight.py validate-wave --root candidate
          --manifests staged-plan/source-plan/mutation-manifests --plan staged-plan/continuation-plan.json
          --reports staged-reports --wave wave-3 --repository "$GITHUB_REPOSITORY"
          --workflow "$GITHUB_WORKFLOW" --workflow-ref "$GITHUB_WORKFLOW_REF"
          --orchestration-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt 1
          --output continuation-validation.json
      - name: Enforce aggregate launch budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37573662156/attempts/1/jobs?per_page=100" > source-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37580393007/attempts/1/jobs?per_page=100" > setup-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37589782905/attempts/1/jobs?per_page=100" > layout-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37600554367/attempts/1/jobs?per_page=100" > api-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > current-jobs.json
          candidate/.venv/bin/python control/scripts/staged_preflight.py budget-gate --jobs current-jobs.json \
            --source source-jobs.json 37573662156 1 \
            --source setup-jobs.json 37580393007 1 \
            --source layout-jobs.json 37589782905 1 \
            --source api-jobs.json 37600554367 1 \
            --run-id "$GITHUB_RUN_ID" --run-attempt 1 \
            --next-wave aggregate --output aggregate-budget.json
      - name: Retain continuation validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            continuation-validation.json
            aggregate-budget.json
            source-jobs.json
            setup-jobs.json
            layout-jobs.json
            api-jobs.json
            current-jobs.json
          retention-days: 90
          if-no-files-found: error

  aggregate:
    name: Aggregate exact 256-report corpus
    if: github.run_attempt == 1
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f5560685d1f9eaea05107947fb0ecab791ad9478
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        working-directory: candidate
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-3-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: staged-reports
      - name: Assemble and aggregate all immutable reports
        run: |
          candidate/.venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          expected = {
              "wave-1-reports": {8, 27, 28, 37, 48, 50, 51, 53},
              "wave-2-reports": set(range(35)) - {8, 27, 28},
              "staged-reports": set(range(35, 256)) - {37, 48, 50, 51, 53},
          }
          seen = set()
          for directory, required in expected.items():
              indexes = []
              for path in Path("staged-plan" if directory != "staged-reports" else ".").joinpath(directory).rglob("mutation-preflight.json"):
                  indexes.append(json.loads(path.read_text())["shard_index"])
              assert len(indexes) == len(set(indexes)) and set(indexes) == required
              assert seen.isdisjoint(indexes)
              seen.update(indexes)
          assert seen == set(range(256))
          PY
          mkdir -p staged-reports/imported-wave-1 staged-reports/imported-wave-2
          cp -R staged-plan/wave-1-reports/. staged-reports/imported-wave-1/
          cp -R staged-plan/wave-2-reports/. staged-reports/imported-wave-2/
          candidate/.venv/bin/python -m fettle.mutation_test --root candidate \
            --aggregate-preflight staged-reports --shard-count 256 --json > mutation-preflight.json
          candidate/.venv/bin/python control/scripts/staged_preflight.py fresh-completion-record \
            --plan staged-plan/continuation-plan.json --reports staged-reports \
            --aggregate mutation-preflight.json --output staged-preflight-continuation.json
          cp staged-plan/recovery-authorization.json recovery-authorization.json
      - name: Retain consolidated preflight
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mutation-preflight.json
            staged-preflight-continuation.json
            recovery-authorization.json
          retention-days: 90
          if-no-files-found: error

  readback:
    name: Read back durable consolidated evidence
    if: github.run_attempt == 1
    needs: aggregate
    runs-on: ubuntu-latest
    steps:
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Download consolidated preflight artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: retained
      - name: Verify downloaded aggregate and origin record
        env:
          EXPECTED_ORCHESTRATION_SHA: ${{ github.sha }}
          EXPECTED_RECOVERY_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          aggregate = json.loads(Path("retained/mutation-preflight.json").read_text())
          record = json.loads(Path("retained/staged-preflight-continuation.json").read_text())
          expected = "f5560685d1f9eaea05107947fb0ecab791ad9478"
          assert aggregate["status"] == "completed" and aggregate["passed"] is True
          assert aggregate["revision"] == expected and aggregate["shard_count"] == 256
          assert aggregate["generated"] == aggregate["canonicalized"] and aggregate["collisions"] == 0
          assert record["status"] == "completed" and record["passed"] is True
          assert record["candidate_sha"] == expected and len(record["origins"]) == 256
          assert record["kind"] == "fresh_staged_preflight"
          assert record["source"]["run_id"] == "37573662156"
          assert record["source"]["run_attempt"] == "1"
          assert record["source"]["verdict"] == "permanently failed; dispatch handoff only"
          assert set(record["origins"]) == {str(index) for index in range(256)}
          retained = {8, 27, 28, 37, 48, 50, 51, 53} | (set(range(35)) - {8, 27, 28})
          for index in range(256):
              origin = record["origins"][str(index)]
              assert origin["run_attempt"] == "1"
              assert origin["run_id"] == ("37573662156" if index in retained else os.environ["EXPECTED_RECOVERY_RUN_ID"])
              assert origin["wave"] == ("wave-1" if index in {8, 27, 28, 37, 48, 50, 51, 53}
                                         else "wave-2" if index in retained else "wave-3")
              assert len(origin["artifact_sha256"]) == 64
          assert sum(origin["generated"] for origin in record["origins"].values()) == aggregate["generated"]
          assert record["aggregate_sha256"] == hashlib.sha256(
              Path("retained/mutation-preflight.json").read_bytes(),
          ).hexdigest()
          authorization = json.loads(Path("retained/recovery-authorization.json").read_text())
          assert authorization["recovery_orchestration_sha"] == os.environ["EXPECTED_ORCHESTRATION_SHA"]
          assert authorization["recovery_run_id"] == os.environ["EXPECTED_RECOVERY_RUN_ID"]
          checksums = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(Path("retained").iterdir())
          }
          Path("readback-checksums.json").write_text(json.dumps(checksums, indent=2) + "\n")
          PY
      - name: Retain readback verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-continuation-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            readback-checksums.json
          retention-days: 90
          if-no-files-found: error

  terminal-accounting:
    name: Reconcile terminal cumulative budget
    if: github.run_attempt == 1
    needs: readback
    runs-on: ubuntu-latest
    steps:
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Enforce terminal cumulative operational budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37573662156/attempts/1/jobs?per_page=100" > source-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37580393007/attempts/1/jobs?per_page=100" > setup-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37589782905/attempts/1/jobs?per_page=100" > layout-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37600554367/attempts/1/jobs?per_page=100" > api-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > current-jobs.json
          python control/scripts/staged_preflight.py budget-gate --jobs current-jobs.json \
            --source source-jobs.json 37573662156 1 \
            --source setup-jobs.json 37580393007 1 \
            --source layout-jobs.json 37589782905 1 \
            --source api-jobs.json 37600554367 1 \
            --run-id "$GITHUB_RUN_ID" --run-attempt 1 \
            --next-wave complete --output complete-budget.json
      - name: Retain terminal accounting
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-continuation-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            complete-budget.json
            source-jobs.json
            setup-jobs.json
            layout-jobs.json
            api-jobs.json
            current-jobs.json
          retention-days: 90
          if-no-files-found: error
