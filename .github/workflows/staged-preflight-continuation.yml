      - name: Download preceding admission accounting
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-admission-6-${{ github.run_id }}-${{ github.run_attempt }}
          path: prior-admission
      - name: Stop on failure or exhausted execution budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : > monitor-accounting.log
          printf '%s\n' 'monitoring' > monitor-final-status.txt
          mkdir -p monitor-snapshots
          sample=0
          uncertainty=0
          source_uncertainty=api
          for source_sample in 1 2 3; do
            if gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.inputs.source_run_id }}/attempts/1/jobs?per_page=100" > "monitor-snapshots/source-jobs-$source_sample.json" 2>> monitor-accounting.log; then
              source_uncertainty=accounting
              rm -f source-budget-sample.json
              if python control/scripts/staged_preflight.py budget-gate \
                --jobs "monitor-snapshots/source-jobs-$source_sample.json" \
                --run-id ${{ github.event.inputs.source_run_id }} --run-attempt 1 \
                --next-wave complete --output source-budget-sample.json \
                2> >(tee -a monitor-accounting.log >&2); then
                cp "monitor-snapshots/source-jobs-$source_sample.json" source-jobs.json
                break
              elif [ "$?" -eq 2 ] && jq -e '.passed == false' source-budget-sample.json >/dev/null 2>&1; then
                cp "monitor-snapshots/source-jobs-$source_sample.json" source-jobs.json
                printf '%s\n' 'operational-cutoff' > monitor-final-status.txt
                printf '%s\n' 'operational-cutoff' > cancellation-requested.txt
                printf '{"repository":"%s","run_id":"%s","reason":"%s","status":"pending"}\n' \
                  "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "operational-cutoff" > cancellation-attempt.json
                break
              fi
            fi
            sleep 15
          done
          if [ ! -f source-jobs.json ] && [ ! -f cancellation-requested.txt ]; then
            reason="persistent-source-${source_uncertainty}-uncertainty"
            printf '%s\n' "$reason" > monitor-final-status.txt
            printf '%s\n' "$reason" > cancellation-requested.txt
            printf '{"repository":"%s","run_id":"%s","reason":"%s","status":"pending"}\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$reason" > cancellation-attempt.json
          fi
          while true; do
            [ -f cancellation-requested.txt ] && break
            sample=$((sample + 1))
            snapshot="monitor-snapshots/current-jobs-$sample.json"
            if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > "$snapshot" 2>> monitor-accounting.log; then
              uncertainty=$((uncertainty + 1))
              if [ "$uncertainty" -ge 3 ]; then
                printf '%s\n' 'persistent-api-uncertainty' > monitor-final-status.txt
                printf '%s\n' 'persistent-api-uncertainty' > cancellation-requested.txt
                printf '{"repository":"%s","run_id":"%s","reason":"%s","status":"pending"}\n' \
                  "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "persistent-api-uncertainty" > cancellation-attempt.json
                break
              fi
              sleep 15
              continue
            fi
            observed_at=$(python -c 'from datetime import UTC,datetime; print(datetime.now(UTC).isoformat())')
            printf '%s\n' "$observed_at" > "$snapshot.observed-at"
            cp "$snapshot" current-jobs.json
            budget_snapshot="monitor-snapshots/current-budget-$sample.json"
            historical_args=(--historical-accounting prior-admission/admission-budget.json)
            for prior_budget in monitor-snapshots/current-budget-*.json; do
              [ -f "$prior_budget" ] && historical_args+=(--historical-accounting "$prior_budget")
            done
            rm -f monitor-budget.json
            if python control/scripts/staged_preflight.py budget-gate --jobs current-jobs.json \
              --prior-jobs source-jobs.json --prior-run-id ${{ github.event.inputs.source_run_id }} --prior-run-attempt 1 \
              --run-id "$GITHUB_RUN_ID" --run-attempt 1 \
              --observed-at "$observed_at" --job-timeout-minutes 35 \
              "${historical_args[@]}" \
              --next-wave complete --output "$budget_snapshot" \
              2> >(tee -a monitor-accounting.log >&2); then
              cp "$budget_snapshot" monitor-budget.json
              uncertainty=0
            else
              status=$?
              [ ! -f "$budget_snapshot" ] || cp "$budget_snapshot" monitor-budget.json
              if [ "$status" -eq 2 ] && jq -e '.passed == false' "$budget_snapshot" >/dev/null 2>&1; then
                printf '%s\n' 'operational-cutoff' > monitor-final-status.txt
                printf '%s\n' 'operational-cutoff' > cancellation-requested.txt
                printf '{"repository":"%s","run_id":"%s","reason":"%s","status":"pending"}\n' \
                  "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "operational-cutoff" > cancellation-attempt.json
                break
              fi
              uncertainty=$((uncertainty + 1))
              if [ "$uncertainty" -ge 3 ]; then
                printf '%s\n' 'persistent-accounting-uncertainty' > monitor-final-status.txt
                printf '%s\n' 'persistent-accounting-uncertainty' > cancellation-requested.txt
                printf '{"repository":"%s","run_id":"%s","reason":"%s","status":"pending"}\n' \
                  "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "persistent-accounting-uncertainty" > cancellation-attempt.json
                break
              fi
              sleep 15
              continue
            fi
            failed=$(jq '[.[].jobs[] | select((.name | startswith("mutation (continuation shard ")) or (.name | startswith("Validate and admit continuation batch "))) | select(.status == "completed" and .conclusion != "success")] | length' current-jobs.json)
            succeeded=$(jq '[.[].jobs[] | select(.name | startswith("mutation (continuation shard ")) | select(.status == "completed" and .conclusion == "success")] | length' current-jobs.json)
            if [ "$failed" -ne 0 ]; then
              printf '%s\n' 'continuation-chain-failure' > monitor-final-status.txt
              printf '%s\n' 'continuation-chain-failure' > cancellation-requested.txt
              printf '{"repository":"%s","run_id":"%s","reason":"%s","status":"pending"}\n' \
                "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "continuation-chain-failure" > cancellation-attempt.json
              break
            fi
            if [ "$succeeded" -eq 216 ]; then
              printf '%s\n' 'completed' > monitor-final-status.txt
              break
            fi
            sleep 60
          done
      - name: Retain terminal monitor accounting
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-jobs.json
            current-jobs.json
            monitor-budget.json
            monitor-accounting.log
            monitor-snapshots
            monitor-final-status.txt
            cancellation-requested.txt
            cancellation-attempt.json
          retention-days: 90
          if-no-files-found: warn
      - name: Request cancellation after retaining diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f cancellation-requested.txt ]; then
            if output=$(gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" 2>&1); then
              printf '%s\n' "$output" > cancellation-response.log
              printf '%s\n' 'accepted' > cancellation-final-status.txt
              exit 2
            else
              status=$?
              printf '%s\n' "$output" > cancellation-response.log
              printf 'api-failure-%s\n' "$status" > cancellation-final-status.txt
              exit "$status"
            fi
          fi
      - name: Retain cancellation outcome when runner remains available
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-cancellation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cancellation-attempt.json
            cancellation-response.log
            cancellation-final-status.txt
          retention-days: 90
          if-no-files-found: warn

  validate:
    name: Validate complete continuation wave
    needs: [prepare, wave-3-batch-7, monitor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.candidate_sha }}
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install frozen candidate
        working-directory: candidate
        run: uv venv --python 3.12.13 && uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-3-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: staged-reports
      - name: Download retained monitor accounting
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitor-accounting
      - name: Validate all 216 new reports
        run: >-
          candidate/.venv/bin/python control/scripts/staged_preflight.py validate-wave --root candidate
          --manifests staged-plan/mutation-manifests --plan staged-plan/continuation-plan.json
          --reports staged-reports --wave wave-3 --repository "$GITHUB_REPOSITORY"
          --workflow "$GITHUB_WORKFLOW" --workflow-ref "$GITHUB_WORKFLOW_REF"
          --orchestration-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt 1
          --output continuation-validation.json
      - name: Enforce aggregate launch budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.inputs.source_run_id }}/attempts/1/jobs?per_page=100" > source-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > current-jobs.json
          candidate/.venv/bin/python control/scripts/staged_preflight.py budget-gate --jobs current-jobs.json \
            --prior-jobs source-jobs.json --prior-run-id ${{ github.event.inputs.source_run_id }} --prior-run-attempt 1 \
            --run-id "$GITHUB_RUN_ID" --run-attempt 1 \
            --historical-accounting monitor-accounting/monitor-budget.json \
            --next-wave aggregate --output aggregate-budget.json
      - name: Retain continuation validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            continuation-validation.json
            aggregate-budget.json
            source-jobs.json
            current-jobs.json
          retention-days: 90
          if-no-files-found: error

  aggregate:
    name: Aggregate exact 256-report corpus
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.candidate_sha }}
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        working-directory: candidate
        run: |
          uv venv --python 3.12.13
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-3-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: staged-reports
      - name: Assemble and aggregate all immutable reports
        run: |
          candidate/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          expected = {
              "wave-1-reports": {8, 27, 28, 37, 48, 50, 51, 53},
              "wave-2-reports": set(range(35)) - {8, 27, 28},
              "staged-reports": set(range(35, 256)) - {37, 48, 50, 51, 53},
          }
          seen = set()
          for directory, required in expected.items():
              indexes = []
              for path in Path("staged-plan" if directory != "staged-reports" else ".").joinpath(directory).rglob("mutation-preflight.json"):
                  indexes.append(json.loads(path.read_text())["shard_index"])
              assert len(indexes) == len(set(indexes)) and set(indexes) == required
              assert seen.isdisjoint(indexes)
              seen.update(indexes)
          assert seen == set(range(256))
          PY
          mkdir -p staged-reports/imported-wave-1 staged-reports/imported-wave-2
          cp -R staged-plan/wave-1-reports/. staged-reports/imported-wave-1/
          cp -R staged-plan/wave-2-reports/. staged-reports/imported-wave-2/
          candidate/.venv/bin/python -m fettle.mutation_test --root candidate \
            --aggregate-preflight staged-reports --shard-count 256 --json > mutation-preflight.json
          candidate/.venv/bin/python control/scripts/staged_preflight.py fresh-completion-record \
            --plan staged-plan/continuation-plan.json --reports staged-reports \
            --aggregate mutation-preflight.json --output staged-preflight-continuation.json
      - name: Retain consolidated preflight
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mutation-preflight.json
            staged-preflight-continuation.json
          retention-days: 90
          if-no-files-found: error
      - name: Build provenance-bound consumer publication
        run: |
          cp -R staged-plan/mutation-manifests published-manifests
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          aggregate = Path("mutation-preflight.json")
          completion = Path("staged-preflight-continuation.json")
          manifests = sorted(Path("published-manifests").glob("partition-*.json"))
          publication = {
              "schema_version": "1",
              "kind": "mutation_preflight_publication",
              "candidate_sha": "${{ github.event.inputs.candidate_sha }}",
              "source_run_id": "${{ github.event.inputs.source_run_id }}",
              "publication_run_id": "${{ github.run_id }}",
              "publication_run_attempt": "${{ github.run_attempt }}",
              "aggregate_sha256": hashlib.sha256(aggregate.read_bytes()).hexdigest(),
              "completion_sha256": hashlib.sha256(completion.read_bytes()).hexdigest(),
              "manifest_count": len(manifests),
              "manifest_topology_sha256": hashlib.sha256(b"".join(path.read_bytes() for path in manifests)).hexdigest(),
          }
          Path("preflight-publication.json").write_text(json.dumps(publication, indent=2) + "\n")
          Path("published-manifests/preflight-publication.json").write_bytes(
              Path("preflight-publication.json").read_bytes()
          )
          Path("published-manifests/staged-preflight-continuation.json").write_bytes(
              completion.read_bytes()
          )
          PY
      - name: Publish conventional manifest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-manifests-${{ github.run_id }}
          path: published-manifests
          retention-days: 90
          if-no-files-found: error
      - name: Publish conventional preflight artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-${{ github.run_id }}
          path: |
            mutation-preflight.json
            preflight-publication.json
            staged-preflight-continuation.json
          retention-days: 90
          if-no-files-found: error

  readback:
    name: Read back durable consolidated evidence
    needs: aggregate
    runs-on: ubuntu-latest
    steps:
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Download consolidated preflight artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: retained
      - name: Download published consumer aliases
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-*-${{ github.run_id }}
          path: published
      - name: Verify downloaded aggregate and origin record
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          aggregate = json.loads(Path("retained/mutation-preflight.json").read_text())
          record = json.loads(Path("retained/staged-preflight-continuation.json").read_text())
          expected = "${{ github.event.inputs.candidate_sha }}"
          assert aggregate["status"] == "completed" and aggregate["passed"] is True
          assert aggregate["revision"] == expected and aggregate["shard_count"] == 256
          assert aggregate["generated"] == aggregate["canonicalized"] and aggregate["collisions"] == 0
          assert record["status"] == "completed" and record["passed"] is True
          assert record["candidate_sha"] == expected and len(record["origins"]) == 256
          assert record["kind"] == "fresh_staged_preflight"
          assert record["source"]["run_id"] == "${{ github.event.inputs.source_run_id }}"
          checksums = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(Path("retained").iterdir())
          }
          manifest_attestation = Path("published/mutation-manifests-${{ github.run_id }}/preflight-publication.json")
          preflight_attestation = Path("published/mutation-preflight-${{ github.run_id }}/preflight-publication.json")
          published_aggregate = Path("published/mutation-preflight-${{ github.run_id }}/mutation-preflight.json")
          manifest_completion = Path("published/mutation-manifests-${{ github.run_id }}/staged-preflight-continuation.json")
          preflight_completion = Path("published/mutation-preflight-${{ github.run_id }}/staged-preflight-continuation.json")
          manifests = sorted(Path("published/mutation-manifests-${{ github.run_id }}").glob("partition-*.json"))
          assert manifest_attestation.read_bytes() == preflight_attestation.read_bytes()
          assert manifest_completion.read_bytes() == preflight_completion.read_bytes()
          assert preflight_completion.read_bytes() == Path("retained/staged-preflight-continuation.json").read_bytes()
          publication = json.loads(preflight_attestation.read_text())
          assert publication["candidate_sha"] == expected
          assert publication["publication_run_id"] == "${{ github.run_id }}"
          assert publication["publication_run_attempt"] == "1"
          assert publication["source_run_id"] == "${{ github.event.inputs.source_run_id }}"
          assert publication["aggregate_sha256"] == hashlib.sha256(published_aggregate.read_bytes()).hexdigest()
          assert publication["completion_sha256"] == hashlib.sha256(preflight_completion.read_bytes()).hexdigest()
          assert publication["manifest_count"] == len(manifests) == 256
          assert publication["manifest_topology_sha256"] == hashlib.sha256(
              b"".join(path.read_bytes() for path in manifests)
          ).hexdigest()
          assert published_aggregate.read_bytes() == Path("retained/mutation-preflight.json").read_bytes()
          Path("readback-checksums.json").write_text(json.dumps(checksums, indent=2) + "\n")
          PY
      - name: Retain readback verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-continuation-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            readback-checksums.json
          retention-days: 90
          if-no-files-found: error

  terminal-accounting:
    name: Reconcile terminal cumulative budget
    needs: readback
    runs-on: ubuntu-latest
    steps:
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Download retained monitor accounting
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitor-accounting
      - name: Enforce terminal cumulative operational budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.inputs.source_run_id }}/attempts/1/jobs?per_page=100" > source-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > current-jobs.json
          python control/scripts/staged_preflight.py budget-gate --jobs current-jobs.json \
            --prior-jobs source-jobs.json --prior-run-id ${{ github.event.inputs.source_run_id }} --prior-run-attempt 1 \
            --run-id "$GITHUB_RUN_ID" --run-attempt 1 \
            --historical-accounting monitor-accounting/monitor-budget.json \
            --next-wave complete --output complete-budget.json
      - name: Retain terminal accounting
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-continuation-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            complete-budget.json
            source-jobs.json
            current-jobs.json
          retention-days: 90
          if-no-files-found: error
