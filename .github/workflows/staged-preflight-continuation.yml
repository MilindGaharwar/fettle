name: Staged preflight continuation

on:
  push:
    branches:
      - audit/hardening-integration-20261005
    paths:
      - .github/workflows/staged-preflight-continuation.yml

permissions:
  actions: write
  contents: read

jobs:
  prepare:
    if: github.event.head_commit.message == 'Execute staged preflight continuation'
    name: Validate immutable preflight sources
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Reject rerun attempts
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Check out frozen executable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0fc41fdfee13e09f4bda3dc5eee177030882aa36
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install frozen candidate
        working-directory: candidate
        run: uv venv --python 3.12.14 && uv pip install --quiet --no-deps -e .
      - name: Bind candidate and orchestration identities
        env:
          CANDIDATE_SHA: 0fc41fdfee13e09f4bda3dc5eee177030882aa36
        run: >-
          python -c 'import os,re,subprocess,sys; expected="0fc41fdfee13e09f4bda3dc5eee177030882aa36";
          actual=subprocess.check_output(["git","-C","candidate","rev-parse","HEAD"],text=True).strip();
          control=subprocess.check_output(["git","-C","control","rev-parse","HEAD"],text=True).strip();
          sys.exit(0 if os.environ["CANDIDATE_SHA"]==actual==expected
          and re.fullmatch(r"[0-9a-f]{40}",control) and control==os.environ["GITHUB_SHA"] else 1)'
      - name: Recreate frozen manifests
        working-directory: candidate
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --prepare-manifests ../mutation-manifests --json > ../prepare.json
      - name: Confirm immutable historical run verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37464324954" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37476889333" > recovery-run.json
          jq -e '.id == 37464324954 and .run_attempt == 1 and .status == "completed" and .conclusion == "failure" and .head_sha == "891562ba4909b16e6252a0eb7e8674393f43eba0"' source-run.json
          jq -e '.id == 37476889333 and .run_attempt == 1 and .status == "completed" and .conclusion == "failure" and .head_sha == "7da9f5d07884a5913bdbc38f28b34344c839a9f9"' recovery-run.json
      - name: Download immutable source plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-staged-plan-37464324954-1
          path: source-plan
          run-id: 37464324954
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable source reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-1-37464324954-1-*
          path: source-reports
          run-id: 37464324954
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable recovery plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-staged-plan-37476889333-1
          path: recovery-plan
          run-id: 37476889333
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable recovery reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-2-37476889333-1-*
          path: recovery-reports
          run-id: 37476889333
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable recovery validation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-wave-2-validation-37476889333-1
          path: recovery-validation
          run-id: 37476889333
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build exact continuation plan
        id: plan
        run: |
          candidate/.venv/bin/python control/scripts/staged_preflight.py continuation-plan --root candidate \
            --manifests mutation-manifests \
            --source-plan source-plan/staged-preflight-plan.json \
            --source-reports source-reports \
            --recovery-plan recovery-plan/staged-preflight-plan.json \
            --recovery-reports recovery-reports \
            --recovery-validation recovery-validation/wave-2-validation.json \
            --orchestration-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output continuation-plan.json
          echo "matrix=$(python -c 'import json; print(json.dumps({"shard":json.load(open("continuation-plan.json"))["execution_wave"]["shards"]},separators=(",",":")))')" >> "$GITHUB_OUTPUT"
      - name: Retain validated continuation inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            continuation-plan.json
            mutation-manifests
            source-plan
            source-reports
            recovery-plan
            recovery-reports
            recovery-validation
            source-run.json
            recovery-run.json
          retention-days: 90
          if-no-files-found: error

  launch-gate:
    name: Reconcile cumulative launch budget
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Download continuation inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - name: Reconcile all prior operational usage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37464324954/attempts/1/jobs?per_page=100" > source-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37476889333/attempts/1/jobs?per_page=100" > recovery-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > current-jobs.json
          python control/scripts/staged_preflight.py budget-gate --jobs current-jobs.json \
            --prior-jobs source-jobs.json --prior-run-id 37464324954 --prior-run-attempt 1 \
            --additional-prior-jobs recovery-jobs.json --additional-prior-run-id 37476889333 \
            --additional-prior-run-attempt 1 --run-id "$GITHUB_RUN_ID" --run-attempt 1 \
            --next-wave wave-3 --output launch-budget.json
      - name: Retain launch accounting
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-launch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-jobs.json
            recovery-jobs.json
            current-jobs.json
            launch-budget.json
          retention-days: 90
          if-no-files-found: error

  remaining-shards:
    name: mutation (continuation shard ${{ matrix.shard }})
    needs: [prepare, launch-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: true
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0fc41fdfee13e09f4bda3dc5eee177030882aa36
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        run: |
          uv venv --python 3.12.14
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - name: Download continuation plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - name: Execute previously unattempted shard
        run: >-
          uv run --no-sync python -m fettle.mutation_test --root .
          --preflight-manifest staged-plan/mutation-manifests/partition-${{ matrix.shard }}.json
          --json > mutation-preflight.json
      - name: Retain continuation shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-wave-3-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: mutation-preflight.json
          retention-days: 90
          if-no-files-found: error

  monitor:
    name: Monitor failures and operational ceiling
    needs: launch-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Stop on failure or exhausted execution budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37464324954/attempts/1/jobs?per_page=100" > source-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37476889333/attempts/1/jobs?per_page=100" > recovery-jobs.json
          while true; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > current-jobs.json
            failed=$(jq '[.[].jobs[] | select(.name | startswith("mutation (continuation shard ")) | select(.status == "completed" and .conclusion != "success")] | length' current-jobs.json)
            succeeded=$(jq '[.[].jobs[] | select(.name | startswith("mutation (continuation shard ")) | select(.status == "completed" and .conclusion == "success")] | length' current-jobs.json)
            if [ "$failed" -ne 0 ]; then
              echo "Continuation shard failure detected; cancelling run"
              gh run cancel "$GITHUB_RUN_ID"
              exit 2
            fi
            if ! python control/scripts/staged_preflight.py budget-gate --jobs current-jobs.json \
              --prior-jobs source-jobs.json --prior-run-id 37464324954 --prior-run-attempt 1 \
              --additional-prior-jobs recovery-jobs.json --additional-prior-run-id 37476889333 \
              --additional-prior-run-attempt 1 --run-id "$GITHUB_RUN_ID" --run-attempt 1 \
              --next-wave complete --output monitor-budget.json; then
              echo "Operational execution ceiling reached or accounting became indeterminate; cancelling run"
              gh run cancel "$GITHUB_RUN_ID"
              exit 2
            fi
            if [ "$succeeded" -eq 216 ]; then
              break
            fi
            sleep 60
          done
      - name: Retain terminal monitor accounting
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-jobs.json
            recovery-jobs.json
            current-jobs.json
            monitor-budget.json
          retention-days: 90
          if-no-files-found: error

  validate:
    name: Validate complete continuation wave
    needs: [prepare, remaining-shards, monitor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0fc41fdfee13e09f4bda3dc5eee177030882aa36
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install frozen candidate
        working-directory: candidate
        run: uv venv --python 3.12.14 && uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-3-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: staged-reports
      - name: Validate all 216 new reports
        run: >-
          candidate/.venv/bin/python control/scripts/staged_preflight.py validate-wave --root candidate
          --manifests staged-plan/mutation-manifests --plan staged-plan/continuation-plan.json
          --reports staged-reports --wave wave-3 --repository "$GITHUB_REPOSITORY"
          --workflow "$GITHUB_WORKFLOW" --workflow-ref "$GITHUB_WORKFLOW_REF"
          --orchestration-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt 1
          --output continuation-validation.json
      - name: Enforce aggregate launch budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37464324954/attempts/1/jobs?per_page=100" > source-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37476889333/attempts/1/jobs?per_page=100" > recovery-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > current-jobs.json
          candidate/.venv/bin/python control/scripts/staged_preflight.py budget-gate --jobs current-jobs.json \
            --prior-jobs source-jobs.json --prior-run-id 37464324954 --prior-run-attempt 1 \
            --additional-prior-jobs recovery-jobs.json --additional-prior-run-id 37476889333 \
            --additional-prior-run-attempt 1 --run-id "$GITHUB_RUN_ID" --run-attempt 1 \
            --next-wave aggregate --output aggregate-budget.json
      - name: Retain continuation validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-continuation-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            continuation-validation.json
            aggregate-budget.json
            source-jobs.json
            recovery-jobs.json
            current-jobs.json
          retention-days: 90
          if-no-files-found: error

  aggregate:
    name: Aggregate exact 256-report corpus
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0fc41fdfee13e09f4bda3dc5eee177030882aa36
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Install pinned mutation tools
        working-directory: candidate
        run: |
          uv venv --python 3.12.14
          uv pip install --quiet --require-hashes -r requirements-mutation.txt
          uv pip install --quiet --no-deps -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-continuation-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: staged-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-preflight-wave-3-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: staged-reports
      - name: Assemble and aggregate all immutable reports
        run: |
          candidate/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          expected = {
              "source-reports": {8, 27, 28, 37, 48, 50, 51, 53},
              "recovery-reports": set(range(35)) - {8, 27, 28},
              "staged-reports": set(range(35, 256)) - {37, 48, 50, 51, 53},
          }
          seen = set()
          for directory, required in expected.items():
              indexes = []
              for path in Path("staged-plan" if directory != "staged-reports" else ".").joinpath(directory).rglob("mutation-preflight.json"):
                  indexes.append(json.loads(path.read_text())["shard_index"])
              assert len(indexes) == len(set(indexes)) and set(indexes) == required
              assert seen.isdisjoint(indexes)
              seen.update(indexes)
          assert seen == set(range(256))
          PY
          mkdir -p staged-reports/imported-source staged-reports/imported-recovery
          cp -R staged-plan/source-reports/. staged-reports/imported-source/
          cp -R staged-plan/recovery-reports/. staged-reports/imported-recovery/
          candidate/.venv/bin/python -m fettle.mutation_test --root candidate \
            --aggregate-preflight staged-reports --shard-count 256 --json > mutation-preflight.json
          candidate/.venv/bin/python control/scripts/staged_preflight.py recovery-record \
            --plan staged-plan/continuation-plan.json --reports staged-reports \
            --aggregate mutation-preflight.json --output staged-preflight-continuation.json
      - name: Retain consolidated preflight
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mutation-preflight.json
            staged-preflight-continuation.json
          retention-days: 90
          if-no-files-found: error

  readback:
    name: Read back durable consolidated evidence
    needs: aggregate
    runs-on: ubuntu-latest
    steps:
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Download consolidated preflight artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-preflight-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: retained
      - name: Verify downloaded aggregate and origin record
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          aggregate = json.loads(Path("retained/mutation-preflight.json").read_text())
          record = json.loads(Path("retained/staged-preflight-continuation.json").read_text())
          expected = "0fc41fdfee13e09f4bda3dc5eee177030882aa36"
          assert aggregate["status"] == "completed" and aggregate["passed"] is True
          assert aggregate["revision"] == expected and aggregate["shard_count"] == 256
          assert aggregate["generated"] == aggregate["canonicalized"] and aggregate["collisions"] == 0
          assert record["status"] == "completed" and record["passed"] is True
          assert record["candidate_sha"] == expected and len(record["origins"]) == 256
          assert record["historical_verdicts"] == {
              "37464324954": "permanently non-pass", "37476889333": "permanently non-pass",
          }
          checksums = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(Path("retained").iterdir())
          }
          Path("readback-checksums.json").write_text(json.dumps(checksums, indent=2) + "\n")
          PY
      - name: Retain readback verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-continuation-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            readback-checksums.json
          retention-days: 90
          if-no-files-found: error

  terminal-accounting:
    name: Reconcile terminal cumulative budget
    needs: readback
    runs-on: ubuntu-latest
    steps:
      - name: Check out orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
      - name: Enforce terminal cumulative operational budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37464324954/attempts/1/jobs?per_page=100" > source-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/37476889333/attempts/1/jobs?per_page=100" > recovery-jobs.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" > current-jobs.json
          python control/scripts/staged_preflight.py budget-gate --jobs current-jobs.json \
            --prior-jobs source-jobs.json --prior-run-id 37464324954 --prior-run-attempt 1 \
            --additional-prior-jobs recovery-jobs.json --additional-prior-run-id 37476889333 \
            --additional-prior-run-attempt 1 --run-id "$GITHUB_RUN_ID" --run-attempt 1 \
            --next-wave complete --output complete-budget.json
      - name: Retain terminal accounting
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-preflight-continuation-budget-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            complete-budget.json
            source-jobs.json
            recovery-jobs.json
            current-jobs.json
          retention-days: 90
          if-no-files-found: error
