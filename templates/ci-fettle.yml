name: Fettle Quality Gate

on:
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Fettle and analyzers
        run: pip install finefettle ruff==0.15.20 semgrep==1.168.0

      - name: Validate policy
        run: fettle config --validate

      - name: Run Fettle
        run: fettle check --all
