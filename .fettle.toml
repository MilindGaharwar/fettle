# Fettle dogfooding — enforce on itself

[gates.lean_review]
mode = "advisory"

[gates.advisory]
cooldown_seconds = 300
max_per_turn = 3

[gates.discipline_link]
enabled = true
cooldown_seconds = 300

[gates.bash_audit]
enabled = true
capture_command = false

[gates.coverage]
enabled = true
threshold = 80
mode = "advisory"

# Stage 8: never declare done while remote CI is red (or unverified).
[gates.ci]
enabled = true
mode = "enforce"

[gates.plan]
exclude = [
    "docs/change-integrity-implementation-plan.md",
    "docs/fettle-enterprise-product-plan.md",
    "docs/fettle-v14-multiagent-plan.md",
]

[mutation]
enabled = true
mode = "advisory"
paths = ["fettle/"]
exclude = ["tests/", "migrations/"]
base = "origin/main"
timeout_s = 600
full_timeout_s = 1800
default_chunk_lines = 60
full_shards = 240

[mutation.test_mappings]
"fettle/__main__.py" = ["tests/test_cli.py"]
"fettle/agents/claude_code.py" = ["tests/test_agents.py"]
"fettle/agents/codex.py" = ["tests/test_agents.py"]
"fettle/agents/gemini.py" = ["tests/test_agents.py"]
"fettle/agents/opencode.py" = ["tests/test_agents.py"]
"fettle/runners/_subprocess.py" = ["tests/test_runners.py"]
"fettle/uat/__init__.py" = ["tests/test_uat_surfaces.py"]

[mutation.chunk_lines]
"fettle/mutation_test.py" = 10
"fettle/quality_scan.py" = 20

[boundary]
# These tests intentionally embed synthetic detector inputs. Keep exclusions
# exact so all other test and production files remain boundary-scanned.
exclude = [
    "tests/test_boundary_scan.py",
    "tests/test_ci.py",
    "tests/test_lsp_server.py",
    "tests/test_secret_scan.py",
    "tests/test_uat_session.py",
]
