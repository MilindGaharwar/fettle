<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 96" role="img" aria-label="fettle">
  <!-- Wordmark, light backgrounds. Dark variant: wordmark-dark.svg -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8833A"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <g transform="scale(0.75)">
    <rect width="128" height="128" rx="28" fill="#20242E"/>
    <polyline points="18,64 42,64 54,36 72,92 84,64 110,64"
              fill="none" stroke="url(#g)" stroke-width="9"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="114" y="67" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1.5" fill="#2A2F3A">fettle<tspan fill="#F5A623">.</tspan></text>
</svg>
