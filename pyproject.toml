[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finefettle"
version = "1.11.1"
description = "Trust layer for agentic software engineering: policy that survives delegation, evidence that cannot become clean by accident, and verdicts bound to artifacts across Claude Code, Codex CLI, Gemini CLI, and OpenCode"
readme = "README.md"
license = "MIT"
authors = [{name = "Milind"}]
requires-python = ">=3.11"
dependencies = [
    "deptry>=0.23",
    "mutmut==2.5.1",
    "playwright>=1.40",
    "pre-commit>=3.0",
    "pyright>=1.1",
    "pytest>=7.0",
    "pyyaml>=6.0",
    "ruff>=0.4.0",
    "semgrep>=1.50",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.optional-dependencies]
# The core wheel already bundles every runtime capability: analyzers,
# test/mutation runners, hooks, browser automation, and the mutation engine.
# Extras exist as stable install targets for teams that pin by capability;
# `all` composes them so one command installs everything.
dev = ["pre-commit>=4.4"]
semgrep = ["semgrep>=1.168"]
evals = []
uat = []
all = [
    "finefettle[dev]",
    "finefettle[semgrep]",
    "finefettle[evals]",
    "finefettle[uat]",
]

[project.scripts]
fettle = "fettle.cli:main"

[project.urls]
Repository = "https://github.com/MilindGaharwar/fettle"
Documentation = "https://github.com/MilindGaharwar/fettle/tree/main/docs"
Changelog = "https://github.com/MilindGaharwar/fettle/blob/main/CHANGELOG.md"
Issues = "https://github.com/MilindGaharwar/fettle/issues"

[tool.setuptools]
packages = ["fettle", "fettle.adapters", "fettle.agents", "fettle.runners", "fettle.uat"]

[tool.setuptools.package-data]
fettle = ["py.typed", "host-capabilities.json", "installed-host-evidence.json", "*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
# Self-lint config — tests/fixtures contains intentional violations used as
# rule-pack test corpora and must never pollute lint output (audit D9).
extend-exclude = ["tests/fixtures", "examples/assurance-loop/broken.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "SIM", "UP", "B"]
ignore = [
    "SIM105",  # contextlib.suppress — try/except is clearer in hook hot paths
    "SIM108",  # ternary — explicit if/else preferred for readability
    "SIM117",  # nested with — allowed where line length would suffer
    "UP042",   # StrEnum migration tracked for the v1.2 package restructure
    "UP035",   # typing imports — same arc
    "SIM102", "SIM110", "SIM114", "SIM115",  # style-only, cleaned incrementally
    "B905",    # zip strict= — not applicable on all supported call sites
]
